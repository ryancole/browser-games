<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 3rem 1rem;
    background: #0f1115;
    color: #e8e8ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; font-weight: 600; letter-spacing: 0.04em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
  a {
    display: block;
    padding: 1rem 1.25rem;
    background: #171a21;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
  }
  a:hover, a:focus-visible { border-color: #4f8cff; }
  .name { font-weight: 600; }
  .desc { margin-top: 0.25rem; font-size: 0.9rem; opacity: 0.7; }
</style>
</head>
<body>
<main>
  <h1>BROWSER GAMES</h1>
  <ul>
    <li>
      <a href="catch-it/">
        <div class="name">Catch It</div>
        <div class="desc">Catch the green blocks, dodge the red ones.</div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
