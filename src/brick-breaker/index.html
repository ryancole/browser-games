<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #e8e8ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    touch-action: none;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; font-weight: 600; letter-spacing: 0.04em; }
  #hud { display: flex; gap: 1.5rem; margin-bottom: 0.5rem; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: center; }
  canvas {
    background: #171a21;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    max-width: 96vw;
    max-height: 78vh;
    height: auto;
    cursor: none;
  }
  #hint { margin-top: 0.75rem; font-size: 0.85rem; opacity: 0.6; text-align: center; padding: 0 1rem; }
  button + button { background: #2a2f3a; margin-left: 0.5rem; }
  button + button:hover { background: #363c4a; }
  button {
    margin-top: 1rem;
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #3a78f0; }
</style>
</head>
<body>
<h1>BRICK BREAKER</h1>
<div id="hud">
  <span>Score: <strong id="score">0</strong></span>
  <span>Best: <strong id="best">0</strong></span>
  <span>Level: <strong id="level">1</strong></span>
  <span>Lives: <strong id="lives">3</strong></span>
</div>
<canvas id="game" width="480" height="640"></canvas>
<div id="hint">Mouse, ← → or A / D to move · Space or click to launch · P to pause</div>
<div>
  <button id="start">Start</button>
  <button id="mute">Sound: on</button>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const levelEl = document.getElementById("level");
  const livesEl = document.getElementById("lives");
  const startBtn = document.getElementById("start");
  const muteBtn = document.getElementById("mute");

  const loadBest = () => {
    try { return Number(localStorage.getItem("brickbreaker-best")) || 0; } catch { return 0; }
  };
  const saveBest = (v) => {
    try { localStorage.setItem("brickbreaker-best", String(v)); } catch {}
  };

  // ---- 8-bit sound effects (synthesized, no audio files) ----
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem("brickbreaker-muted") === "1"; } catch {}

  function getAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // Play a sequence of notes: [frequency Hz, duration seconds]
  function blip(notes, { type = "square", gain = 0.1, slide = false } = {}) {
    if (muted) return;
    const ac = getAudio();
    if (!ac) return;
    let t = ac.currentTime;
    for (const [freq, dur] of notes) {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(ac.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    }
  }

  const sfx = {
    paddle: () => blip([[440, 0.05]], { gain: 0.08 }),
    wall: () => blip([[330, 0.03]], { type: "triangle", gain: 0.06 }),
    brick: (hp) => blip([[520 + hp * 120, 0.05]], { gain: 0.08 }),
    breakBrick: () => blip([[880, 0.04], [1320, 0.06]], { gain: 0.08 }),
    power: () => blip([[523, 0.06], [784, 0.06], [1047, 0.1]]),
    lose: () => blip([[220, 0.3]], { type: "sawtooth", gain: 0.15, slide: true }),
    start: () => blip([[330, 0.08], [440, 0.08], [660, 0.14]]),
    clear: () => blip([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.25]]),
    over: () => blip([[523, 0.14], [392, 0.14], [330, 0.14], [262, 0.4]], { type: "triangle", gain: 0.2 }),
    best: () => blip([[523, 0.08], [659, 0.08], [784, 0.08], [1047, 0.2]]),
  };

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem("brickbreaker-muted", muted ? "1" : "0"); } catch {}
    muteBtn.textContent = muted ? "Sound: off" : "Sound: on";
  }
  muteBtn.textContent = muted ? "Sound: off" : "Sound: on";
  muteBtn.addEventListener("click", () => { toggleMute(); muteBtn.blur(); });

  // ---- Layout ----
  const COLS = 8, GAP = 4, SIDE = 16, TOP = 60, BRICK_H = 20;
  const BRICK_W = (W - SIDE * 2 - GAP * (COLS - 1)) / COLS;
  // Colour by remaining hit points (index = hp).
  const HP_COLORS = [null, "#7de08a", "#ffd166", "#ff9f5c", "#ff5c5c"];

  const BALL_R = 7;
  const PADDLE_W = 90, PADDLE_WIDE = 140, PADDLE_H = 14;
  const MAX_BOUNCE = Math.PI / 3; // 60° from vertical at the paddle edge
  const MAX_BALLS = 12;

  // Each pattern decides whether a brick sits at row r, column c.
  const PATTERNS = [
    () => true,
    (r, c) => (r + c) % 2 === 0,
    (r, c) => Math.abs(c - 3.5) <= r * 0.5 + 0.5,
    (r, c) => c % 3 !== 1,
    (r, c, rows) => r === 0 || r === rows - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 1),
  ];

  // Power-ups: W = wide paddle, M = multi-ball, S = slow ball, + = extra life.
  const POWERS = [
    { type: "wide", label: "W", color: "#4f8cff", weight: 35 },
    { type: "multi", label: "M", color: "#b48cff", weight: 30 },
    { type: "slow", label: "S", color: "#4fd1c5", weight: 25 },
    { type: "life", label: "+", color: "#ff7eb6", weight: 10 },
  ];
  const DROP_CHANCE = 0.12;

  // ---- State ----
  const paddle = { x: W / 2 - PADDLE_W / 2, y: H - 40, w: PADDLE_W, h: PADDLE_H, speed: 480 };
  const keys = { left: false, right: false };
  let pointerX = null;

  let bricks = [], balls = [], powerups = [], particles = [];
  let score = 0, lives = 3, level = 1, best = loadBest();
  let state = "ready"; // ready | play | clear | over
  let paused = false;
  let wideTimer = 0, slowTimer = 0, clearTimer = 0;

  bestEl.textContent = best;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function ballSpeed() {
    const base = Math.min(520, 300 + (level - 1) * 25);
    return slowTimer > 0 ? base * 0.7 : base;
  }

  function buildLevel() {
    bricks = [];
    const rows = Math.min(9, 4 + level);
    const maxHp = Math.min(4, 1 + Math.floor(level / 2));
    const pattern = PATTERNS[(level - 1) % PATTERNS.length];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!pattern(r, c, rows)) continue;
        // Top rows are the toughest.
        const hp = Math.max(1, maxHp - Math.floor((r * maxHp) / rows));
        bricks.push({
          x: SIDE + c * (BRICK_W + GAP),
          y: TOP + r * (BRICK_H + GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
        });
      }
    }
  }

  function serve() {
    balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R, vx: 0, vy: 0, stuck: true, offset: 0 }];
  }

  function resetRound() {
    powerups = [];
    wideTimer = 0; slowTimer = 0;
    paddle.w = PADDLE_W;
    serve();
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
    livesEl.textContent = lives;
  }

  function addScore(n) {
    score += n;
    if (score > best) { best = score; saveBest(best); }
  }

  function launch() {
    const sp = ballSpeed();
    for (const b of balls) {
      if (!b.stuck) continue;
      const a = (Math.random() - 0.5) * (Math.PI / 6);
      b.vx = sp * Math.sin(a);
      b.vy = -sp * Math.cos(a);
      b.stuck = false;
    }
  }

  function burst(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
    }
  }

  function dropPowerup(x, y) {
    if (Math.random() >= DROP_CHANCE) return;
    let roll = Math.random() * POWERS.reduce((s, p) => s + p.weight, 0);
    const p = POWERS.find(p => (roll -= p.weight) < 0) || POWERS[0];
    powerups.push({ x, y, w: 34, h: 16, ...p });
  }

  function applyPower(p) {
    sfx.power();
    if (p.type === "wide") {
      wideTimer = 12;
    } else if (p.type === "slow") {
      slowTimer = 8;
    } else if (p.type === "life") {
      lives++;
    } else if (p.type === "multi") {
      if (balls.every(b => b.stuck)) launch();
      const extra = [];
      for (const b of balls) {
        if (b.stuck) continue;
        for (const da of [-0.35, 0.35]) {
          const c = Math.cos(da), s = Math.sin(da);
          extra.push({ ...b, vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c });
        }
      }
      balls = balls.concat(extra).slice(0, MAX_BALLS);
    }
  }

  // Keep every ball at the current speed and stop it from going nearly flat.
  function normalize(b, sp) {
    const minVy = sp * 0.3;
    if (Math.abs(b.vy) < minVy) b.vy = (b.vy < 0 ? -1 : 1) * minVy;
    const m = Math.hypot(b.vx, b.vy) || 1;
    b.vx = (b.vx / m) * sp;
    b.vy = (b.vy / m) * sp;
  }

  function hitBrick(b, ball) {
    // Pick the axis with the smaller overlap and bounce along it.
    const ox = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
    const oy = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
    if (ox < oy) {
      ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      ball.x += ball.vx < 0 ? -ox : ox;
    } else {
      ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      ball.y += ball.vy < 0 ? -oy : oy;
    }
    b.hp--;
    if (b.hp <= 0) {
      addScore(10 * b.maxHp);
      burst(b.x + b.w / 2, b.y + b.h / 2, HP_COLORS[b.maxHp]);
      dropPowerup(b.x + b.w / 2 - 17, b.y);
      sfx.breakBrick();
    } else {
      addScore(5);
      sfx.brick(b.hp);
    }
  }

  function circleRect(x, y, r, rect) {
    const cx = clamp(x, rect.x, rect.x + rect.w);
    const cy = clamp(y, rect.y, rect.y + rect.h);
    const dx = x - cx, dy = y - cy;
    return dx * dx + dy * dy < r * r;
  }

  function stepBall(ball, dt, sp) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls and ceiling
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); sfx.wall(); }

    // Paddle: the bounce angle depends on where the ball lands.
    if (ball.vy > 0 && ball.y < paddle.y + paddle.h / 2 && circleRect(ball.x, ball.y, BALL_R, paddle)) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const a = rel * MAX_BOUNCE;
      ball.vx = sp * Math.sin(a);
      ball.vy = -sp * Math.cos(a);
      ball.y = paddle.y - BALL_R;
      sfx.paddle();
    }

    // Bricks: at most one hit per sub-step keeps bounces predictable.
    for (const b of bricks) {
      if (b.hp > 0 && circleRect(ball.x, ball.y, BALL_R, b)) {
        hitBrick(b, ball);
        break;
      }
    }
  }

  function update(dt) {
    // Paddle
    const targetW = wideTimer > 0 ? PADDLE_WIDE : PADDLE_W;
    const center = paddle.x + paddle.w / 2;
    paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);
    paddle.x = center - paddle.w / 2;
    if (keys.left) paddle.x -= paddle.speed * dt;
    if (keys.right) paddle.x += paddle.speed * dt;
    if (pointerX !== null) paddle.x = pointerX - paddle.w / 2;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    wideTimer = Math.max(0, wideTimer - dt);
    slowTimer = Math.max(0, slowTimer - dt);

    // Balls, in small sub-steps so a fast ball can't skip through a brick.
    const sp = ballSpeed();
    for (const ball of balls) {
      if (ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - BALL_R;
        continue;
      }
      normalize(ball, sp);
      const steps = Math.ceil((sp * dt) / 3);
      for (let i = 0; i < steps; i++) stepBall(ball, dt / steps, sp);
    }
    bricks = bricks.filter(b => b.hp > 0);

    // Lost balls
    balls = balls.filter(b => b.y - BALL_R < H);
    if (balls.length === 0) {
      lives--;
      if (lives <= 0) { updateHud(); endGame(); return; }
      sfx.lose();
      resetRound();
    }

    // Power-ups
    for (const p of powerups) {
      p.y += 150 * dt;
      if (!p.taken && circleRect(p.x + p.w / 2, p.y + p.h / 2, p.h / 2, paddle)) {
        p.taken = true;
        applyPower(p);
      }
    }
    powerups = powerups.filter(p => !p.taken && p.y < H);

    if (bricks.length === 0) {
      addScore(100 * level);
      state = "clear";
      clearTimer = 1.6;
      powerups = [];
      sfx.clear();
    }

    updateHud();
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function nextLevel() {
    level++;
    buildLevel();
    resetRound();
    state = "play";
    updateHud();
  }

  function overlay(title, sub) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e8e8ea";
    ctx.textAlign = "center";
    ctx.font = "bold 28px system-ui, sans-serif";
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = "16px system-ui, sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 74);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      ctx.fillStyle = HP_COLORS[b.hp];
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        // A faint top highlight marks bricks that take more than one hit.
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Power-ups
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 12px system-ui, sans-serif";
    for (const p of powerups) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      ctx.fillStyle = "#0f1115";
      ctx.fillText(p.label, p.x + p.w / 2, p.y + p.h / 2 + 1);
    }
    ctx.textBaseline = "alphabetic";

    // Paddle
    ctx.fillStyle = wideTimer > 0 && (wideTimer > 2 || Math.floor(wideTimer * 6) % 2) ? "#7aa8ff" : "#4f8cff";
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Balls
    ctx.fillStyle = slowTimer > 0 ? "#4fd1c5" : "#e8e8ea";
    for (const b of balls) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state === "play" && balls.some(b => b.stuck) && !paused) {
      ctx.fillStyle = "rgba(232,232,234,0.7)";
      ctx.textAlign = "center";
      ctx.font = "15px system-ui, sans-serif";
      ctx.fillText("Space or click to launch", W / 2, paddle.y - 40);
    }

    if (state === "ready") overlay("Ready?", "Break every brick. Don't drop the ball.");
    else if (state === "over") overlay("Game over", `Score: ${score} · Level ${level}`);
    else if (state === "clear") overlay(`Level ${level} cleared!`, `+${100 * level} bonus`);
    else if (paused) overlay("Paused", "Press P or click to resume");
  }

  const STEP = 1 / 120;
  let last = 0, acc = 0;
  function loop(t) {
    const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    if (state === "play" && !paused) {
      acc += dt;
      while (acc >= STEP && state === "play") { update(STEP); acc -= STEP; }
    } else {
      acc = 0;
    }
    if (state === "clear") {
      clearTimer -= dt;
      if (clearTimer <= 0) nextLevel();
    }
    if (!paused) updateParticles(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    particles = [];
    buildLevel();
    resetRound();
    paused = false;
    state = "play";
    startBtn.blur();
    updateHud();
    sfx.start();
  }

  function endGame() {
    state = "over";
    startBtn.textContent = "Play again";
    if (score > 0 && score >= best) sfx.best();
    else sfx.over();
  }

  // One "action" input: start, launch, resume or skip the level-clear pause.
  function action() {
    if (state === "ready" || state === "over") startGame();
    else if (state === "clear") nextLevel();
    else if (paused) paused = false;
    else launch();
  }

  function togglePause() {
    if (state === "play") paused = !paused;
  }

  // Keyboard
  const keyMap = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
  window.addEventListener("keydown", (e) => {
    const k = keyMap[e.key];
    if (k) { keys[k] = true; pointerX = null; e.preventDefault(); }
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!e.repeat) action(); }
    if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    if (e.key === "m" || e.key === "M") toggleMute();
  });
  window.addEventListener("keyup", (e) => {
    const k = keyMap[e.key];
    if (k) keys[k] = false;
  });

  // Pointer: the paddle follows the mouse over the board, or a finger while touching.
  const toCanvasX = (clientX) => {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  };
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "touch" || e.buttons) pointerX = toCanvasX(e.clientX);
  });
  canvas.addEventListener("pointerdown", (e) => {
    pointerX = toCanvasX(e.clientX);
    action();
  });
  canvas.addEventListener("pointerup", (e) => { if (e.pointerType === "touch") pointerX = null; });
  canvas.addEventListener("pointerleave", () => { pointerX = null; });

  // Pause automatically when the tab is hidden.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "play") paused = true;
  });

  startBtn.addEventListener("click", startGame);

  buildLevel();
  serve();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
