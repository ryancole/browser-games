<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powder Run</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0f1115;
    color: #e8e8ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    touch-action: none;
  }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  button {
    padding: 0.5rem 1.1rem;
    font-size: 0.95rem;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #3a78f0; }
  button.secondary { background: rgba(42, 47, 58, 0.85); }
  button.secondary:hover { background: #363c4a; }

  /* Race HUD: arcade-style bands across the top corners, shown only while racing. */
  .race-hud { position: fixed; pointer-events: none; display: none; font-style: italic; }
  body.racing .race-hud { display: block; }
  #hud { top: 14px; left: 0; }
  #speedo { top: 14px; right: 0; }
  .band {
    display: flex; align-items: baseline; gap: 0.7rem; width: fit-content;
    padding: 0.1rem 2.6rem 0.15rem 1.1rem;
    background: linear-gradient(90deg, rgba(18, 22, 32, 0.72) 0%, rgba(18, 22, 32, 0.55) 70%, rgba(18, 22, 32, 0) 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
  }
  #speedo .band {
    padding: 0.1rem 1.1rem 0.15rem 2.6rem;
    background: linear-gradient(270deg, rgba(18, 22, 32, 0.72) 0%, rgba(18, 22, 32, 0.55) 70%, rgba(18, 22, 32, 0) 100%);
    clip-path: polygon(18px 0, 100% 0, 100% 100%, 0 100%);
  }
  .band.sub { margin-top: 6px; padding-top: 0; padding-bottom: 0.05rem; }
  .band .lbl {
    font-weight: 800; font-size: clamp(0.85rem, 2.2vw, 1.25rem); letter-spacing: 0.04em; color: #f4f6fa;
    text-shadow: 2px 2px 0 #1a1d26, -1px -1px 0 #1a1d26, 1px -1px 0 #1a1d26, -1px 1px 0 #1a1d26;
  }
  .band .val {
    font-weight: 900; font-size: clamp(1.4rem, 4.6vw, 2.5rem); letter-spacing: 0.06em; color: #ffd84f;
    font-variant-numeric: tabular-nums;
    text-shadow: 3px 3px 0 #3d2c00, -1px -1px 0 #3d2c00, 1px -1px 0 #3d2c00, -1px 1px 0 #3d2c00;
  }
  .band.sub .val { font-size: clamp(1rem, 3vw, 1.5rem); }
  #course-map { right: 18px; bottom: 18px; text-align: center; }
  #map { display: block; width: 74px; height: 240px; margin: 0 auto; }
  #pos {
    font-weight: 900; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1; margin-bottom: 0.3rem;
    color: #ffc23a; font-variant-numeric: tabular-nums;
    text-shadow: 3px 3px 0 #4a2a00, -1px -1px 0 #4a2a00, 1px -1px 0 #4a2a00, -1px 1px 0 #4a2a00;
  }
  #pos small { font-size: 0.55em; }
  /* Licensed song for the course: its YouTube video, credited, above the sound buttons.
     YouTube needs embedded players to be visible and at least 200 x 200. */
  #yt {
    position: fixed; left: 12px; bottom: 56px; width: 356px; display: none;
    background: rgba(12, 16, 26, 0.82); border-radius: 10px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); color: #fff;
  }
  #yt.on { display: block; }
  #yt .credit { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.7rem; font-size: 0.82rem; line-height: 1.2; }
  #yt .credit .note { font-size: 1.1rem; color: #ff4f6a; }
  #yt .credit .who { flex: 1; min-width: 0; }
  #yt .credit b, #yt .credit span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #yt .credit span { opacity: 0.75; font-size: 0.75rem; }
  #yt .credit a { color: #fff; background: #e62117; padding: 0.3rem 0.55rem; border-radius: 6px; font-size: 0.72rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
  #yt .credit a:hover { background: #c4170e; }
  #yt .video { width: 356px; height: 200px; }
  #yt .video iframe, #yt .video > div { width: 100%; height: 100%; display: block; border: 0; }
  /* Sound, music, voice and restart sit out of the way in the bottom left. */
  #top-right { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 0.5rem; }
  #top-right button { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
  @media (max-width: 640px) {
    #map { width: 56px; height: 170px; }
    .band { padding-right: 1.8rem; }
    #speedo .band { padding-left: 1.8rem; }
  }
  #popup {
    position: fixed; top: 20%; left: 0; right: 0;
    text-align: center; font-weight: 700;
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  /* The trick you're throwing: every part you've completed on this jump, newest
     at the bottom, under the points you'd get for landing it now. */
  #air {
    left: 0; right: 0; bottom: 17%;
    flex-direction: column; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  body.racing #air { display: flex; }
  #air.show { opacity: 1; }
  #air .band {
    clip-path: none; padding: 0.05rem 2.2rem 0.1rem;
    background: linear-gradient(90deg, rgba(18, 22, 32, 0) 0%, rgba(18, 22, 32, 0.65) 22%, rgba(18, 22, 32, 0.65) 78%, rgba(18, 22, 32, 0) 100%);
  }
  #air ol { list-style: none; margin: 0.3rem 0 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
  #air li {
    font-weight: 900; font-size: clamp(0.95rem, 2.6vw, 1.45rem); line-height: 1.15;
    letter-spacing: 0.06em; text-transform: uppercase; color: #f4f6fa; opacity: 0.85;
    text-shadow: 2px 2px 0 #1a1d26, -1px -1px 0 #1a1d26, 1px -1px 0 #1a1d26, -1px 1px 0 #1a1d26;
  }
  #air li:last-child { color: #ffd84f; opacity: 1; animation: air-pop 0.25s ease-out; }
  @keyframes air-pop { from { transform: scale(1.4); } }
  #air.landed .val, #air.landed li { color: #7fe0a8; }
  #air.lost .val, #air.lost li { color: #ff6b6b; text-decoration: line-through; }
  #popup .pts { display: block; font-size: 0.75em; color: #ffd84f; }
  #popup.bad .pts { color: #ff6b6b; }
  #count {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(3rem, 14vw, 8rem); font-weight: 800; color: #fff;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  #charge {
    position: fixed; bottom: 24%; left: 50%; transform: translateX(-50%);
    width: 120px; height: 8px; border-radius: 4px; overflow: hidden;
    background: rgba(15, 17, 21, 0.6); opacity: 0; transition: opacity 0.15s;
  }
  #charge div { height: 100%; width: 0; background: #ffd84f; }
  #panel {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 17, 21, 0.45);
    padding: 1rem;
  }
  #panel.hidden { display: none; }
  .card {
    background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px;
    padding: 1.4rem 1.6rem; width: min(100%, 440px); text-align: center;
  }
  .card h1 { font-size: 1.4rem; margin: 0 0 0.4rem; font-weight: 600; letter-spacing: 0.04em; }
  .card p { margin: 0.3rem 0 0.8rem; font-size: 0.9rem; opacity: 0.75; line-height: 1.4; }
  .card table { margin: 0.5rem auto 1rem; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
  .card td { padding: 0.18rem 0.6rem; }
  .card td:first-child { opacity: 0.65; }
  .card .num { text-align: right; font-variant-numeric: tabular-nums; }
  .card .total td { font-weight: 700; border-top: 1px solid #2a2f3a; padding-top: 0.4rem; opacity: 1; }
  .card .new { color: #ffd84f; font-weight: 600; }
  .card th { padding: 0 0.6rem 0.2rem; font-size: 0.72rem; font-weight: 600; opacity: 0.55; text-align: left; }
  .card th.num { text-align: right; }
  .card .standings .me td { color: #ffd84f; opacity: 1; font-weight: 600; }
  .card .buttons { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
  kbd {
    font-family: inherit; font-size: 0.8em;
    padding: 0.05rem 0.35rem; border: 1px solid #2a2f3a; border-radius: 4px; background: #0f1115;
  }

  /* Menu screens: full-screen, over the course playing behind them. */
  #menu {
    position: fixed; inset: 0; isolation: isolate; overflow: hidden; user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(1rem, 5vh, 2.6rem) 16px clamp(2.6rem, 7vh, 3.6rem);
    background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(8, 12, 28, 0.05) 0%, rgba(8, 12, 28, 0.5) 100%),
      linear-gradient(180deg, rgba(8, 12, 28, 0.35) 0%, rgba(8, 12, 28, 0) 22%, rgba(8, 12, 28, 0) 75%, rgba(8, 12, 28, 0.45) 100%);
  }
  #menu.hidden { display: none; }
  body.on-menu #touch, body.on-menu #restart { display: none; }
  /* Chunky chrome lettering; .lav is the lavender of a highlighted choice. */
  #menu .chrome {
    font-family: "Arial Black", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 900; letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #eef1f6 38%, #8d96aa 50%, #c9ced9 64%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(24, 28, 42, 0.85);
    filter: drop-shadow(2px 3px 0 rgba(8, 12, 28, 0.6)) drop-shadow(0 0 10px rgba(8, 12, 28, 0.35));
  }
  #menu .chrome.lav, #menu .m-item.sel, #menu .m-card.sel .chrome {
    background: linear-gradient(180deg, #f1efff 0%, #c2bcff 36%, #6a60e8 52%, #8c84ff 72%, #e2dfff 100%);
    -webkit-background-clip: text; background-clip: text;
  }
  #menu button.chrome { border: 0; padding: 0; border-radius: 0; cursor: pointer; }
  #menu .m-head { font-size: clamp(1.5rem, 5.2vw, 3rem); letter-spacing: 0.06em; text-align: center; }
  #menu .m-body { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  #menu .m-list { display: flex; flex-direction: column; align-items: center; gap: 0.1em; }
  #menu .m-item {
    font-size: clamp(2rem, 8.5vw, 4.8rem); line-height: 1.12; padding: 0 0.15em;
    transition: transform 0.15s;
  }
  #menu .m-item.sel { transform: scale(1.06); animation: m-glow 1.2s ease-in-out infinite; }
  @keyframes m-glow { 50% { filter: drop-shadow(2px 3px 0 rgba(8, 12, 28, 0.6)) drop-shadow(0 0 16px rgba(140, 130, 255, 0.75)); } }
  #menu .m-desc, #menu .m-err, #menu .m-hint {
    font-size: clamp(0.85rem, 2.2vw, 1.05rem); font-weight: 600; color: #fff; text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(8, 12, 28, 0.8);
    max-width: 36rem; margin: 1rem auto 0; min-height: 2.6em; line-height: 1.3;
  }
  #menu .m-err { color: #ffb4ad; min-height: 0; margin: 0 auto 0.6rem; }
  #menu .m-field { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1rem; }
  #menu .m-field .chrome { font-size: clamp(1.1rem, 3.4vw, 1.8rem); }
  #menu .m-field input {
    width: 9.5em; font: 900 clamp(1.1rem, 3.4vw, 1.8rem) "Arial Black", system-ui, sans-serif; color: #fff;
    background: rgba(8, 12, 28, 0.35); border: 0; border-bottom: 3px solid rgba(255, 255, 255, 0.7); border-radius: 6px 6px 0 0;
    padding: 0.1em 0.35em; text-shadow: 2px 2px 0 rgba(8, 12, 28, 0.7); outline: none; user-select: text;
  }
  #menu .m-field input:focus { border-color: #a69eff; background: rgba(8, 12, 28, 0.5); }
  #menu .m-field.code input { width: 6.2em; font-size: clamp(1.8rem, 7vw, 3.2rem); letter-spacing: 0.25em; text-transform: uppercase; text-align: center; }
  #menu .m-field.code { flex-direction: column; align-items: center; gap: 0.3rem; }
  #menu .m-foot { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  #menu .m-btn { font-size: clamp(1rem, 2.8vw, 1.5rem); white-space: nowrap; }
  #menu .m-btn[hidden] { display: block; visibility: hidden; }
  #menu .m-hint { margin: 0; min-height: 0; opacity: 0.8; }
  #menu .m-status { font-size: clamp(1.4rem, 4.5vw, 2.6rem); text-align: center; }

  /* High scores. */
  #menu .m-scores { max-width: 100%; max-height: 100%; overflow: auto; }
  #menu .m-scores table { border-collapse: separate; border-spacing: 0 4px; font-size: clamp(0.85rem, 2.4vw, 1.2rem); color: #fff; }
  #menu .m-scores th { font-size: 0.72em; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; padding: 0 0.8em; text-align: left; text-shadow: 0 1px 3px #000; }
  #menu .m-scores td { padding: 0.35em 0.8em; background: rgba(8, 12, 28, 0.55); white-space: nowrap; vertical-align: top; text-shadow: 0 1px 2px #000; }
  #menu .m-scores td:first-child { border-radius: 8px 0 0 8px; } #menu .m-scores td:last-child { border-radius: 0 8px 8px 0; }
  #menu .m-scores .rank { font: 900 1.3em "Arial Black", system-ui, sans-serif; color: #c2bcff; }
  #menu .m-scores .num { text-align: right; font-variant-numeric: tabular-nums; }
  #menu .m-scores strong { font-size: 1.15em; color: #ffd84f; }
  #menu .m-scores .sub { display: block; font-size: 0.78em; opacity: 0.7; }

  /* Lobby. */
  #menu .m-code { font-size: clamp(2.6rem, 10vw, 5rem); letter-spacing: 0.22em; padding-left: 0.22em; user-select: text; }
  #menu .m-small { font-size: clamp(0.85rem, 2.2vw, 1.1rem); margin: 0.2rem 0 0.8rem; }
  #menu .m-players { list-style: none; padding: 0; margin: 0 0 0.9rem; width: min(100%, 22rem); }
  #menu .m-players li {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.8rem; margin: 4px 0; border-radius: 8px;
    background: rgba(8, 12, 28, 0.55); color: #fff; font-weight: 700; text-shadow: 0 1px 2px #000;
  }
  #menu .m-players .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6); }
  #menu .m-players .nm { flex: 1; }
  #menu .m-players .tag { font-size: 0.75rem; opacity: 0.7; font-weight: 600; }
  #menu .m-setting { display: flex; align-items: center; gap: 0.6rem; font-size: clamp(1rem, 3vw, 1.6rem); margin: 0.15rem 0; }
  #menu .m-setting > .chrome:first-child { font-size: 0.7em; letter-spacing: 0.08em; min-width: 5.5em; text-align: right; }
  #menu .m-val { min-width: 7.5em; text-align: center; }
  #menu .m-arrow { font-size: 1em; padding: 0 0.2em; }

  /* Course picker: lift passes on a table, the chosen one lifted up off it. */
  #menu .m-cards {
    --w: clamp(112px, 20vw, 190px);
    position: relative; width: 100%; height: calc(var(--w) * 1.4 + 6.5rem);
    perspective: 1000px; perspective-origin: 50% 20%;
  }
  #menu .m-card {
    position: absolute; left: 50%; top: 0; width: var(--w); margin-left: calc(var(--w) / -2);
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    transform: translateX(calc(var(--off) * var(--w) * 1.2)) translateZ(calc(var(--abs) * -70px));
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s, filter 0.35s;
    filter: brightness(0.55) saturate(0.7);
    z-index: calc(10 - var(--abs));
  }
  #menu .m-card.sel { filter: none; }
  #menu .m-label { font-size: clamp(0.85rem, 2.2vw, 1.4rem); text-align: center; line-height: 1.05; min-height: 2.1em; display: flex; align-items: flex-end; justify-content: center; }
  #menu .m-sub { font-size: clamp(0.62rem, 1.4vw, 0.85rem); margin: 0.25rem 0 0.7rem; letter-spacing: 0.06em; }
  #menu .pass {
    position: relative; width: 100%; aspect-ratio: 5 / 7; box-sizing: border-box;
    background: #fbfaf4; border: calc(var(--w) * 0.04) solid var(--c1); border-radius: calc(var(--w) * 0.08);
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
    transform: rotateX(38deg); transform-origin: 50% 100%;
    box-shadow: 0 22px 26px -8px rgba(0, 0, 0, 0.6);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s;
  }
  #menu .m-card.sel .pass {
    transform: rotateX(10deg) translateY(-10px) scale(1.06);
    box-shadow: 0 30px 34px -10px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(190, 182, 255, 0.85), 0 0 26px rgba(140, 130, 255, 0.6);
  }
  #menu .p-scene { width: 100%; height: 30%; background: linear-gradient(180deg, var(--sky), var(--fog)); display: flex; align-items: flex-end; }
  #menu .p-scene svg { width: 100%; height: 70%; display: block; }
  #menu .p-hole { position: absolute; top: 5%; left: 50%; width: 9%; aspect-ratio: 1; margin-left: -4.5%; border-radius: 50%; background: rgba(20, 22, 30, 0.75); z-index: 1; }
  #menu .p-badge {
    width: 44%; aspect-ratio: 1; margin-top: -16%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c1) 70%, #fff), var(--c1));
    border: calc(var(--w) * 0.025) solid #fbfaf4; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  #menu .p-badge svg { width: 100%; height: 100%; display: block; }
  #menu .p-name {
    margin-top: 5%; padding: 0 6%; text-align: center; color: #1d2130; line-height: 1.05;
    font: italic 800 calc(var(--w) * 0.1) Georgia, "Times New Roman", serif;
  }
  #menu .p-pass { margin-top: auto; font: 900 calc(var(--w) * 0.12) "Arial Black", system-ui, sans-serif; letter-spacing: 0.08em; color: var(--c2); }
  #menu .p-stub {
    width: 100%; margin-top: 4%; padding: 3% 0 5%; text-align: center; border-top: 2px dashed rgba(29, 33, 48, 0.3);
    font: 700 calc(var(--w) * 0.065) ui-monospace, Consolas, monospace; color: rgba(29, 33, 48, 0.6); letter-spacing: 0.1em;
  }
  @media (max-height: 520px) {
    #menu .m-cards { --w: clamp(90px, 15vw, 150px); }
    #menu .m-desc { margin-top: 0.4rem; }
  }

  /* Title screen, over the 3D shot of a rider in the air. */
  #title {
    position: fixed; inset: 0; cursor: pointer;
    display: flex; flex-direction: column; gap: 0.6rem;
    padding: clamp(1.2rem, 5vh, 3rem) clamp(1.2rem, 5vw, 4rem);
  }
  #title.hidden { display: none; }
  body.on-title #top-right, body.on-title #touch { display: none; }
  #title .logo { transform: skewX(-10deg) rotate(-6deg); transform-origin: left top; width: fit-content; margin-top: 1vh; }
  #title .word {
    font-size: clamp(3.4rem, 11vw, 8.5rem); font-weight: 900; font-style: italic; line-height: 0.86;
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, #ffffff 0%, #dff1ff 38%, #6fb6ff 52%, #1d4fb0 78%, #0d2a6b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #0b1a3d;
    filter: drop-shadow(0 6px 0 rgba(11, 26, 61, 0.55)) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
  }
  #title .word.run { margin-left: 0.55em; }
  #title .ribbon {
    display: inline-block; margin: 0.7rem 0 0 1.2em; padding: 0.3rem 1.1rem 0.35rem;
    background: linear-gradient(90deg, #ff7a2f, #ff4f3a); color: #fff;
    font-size: clamp(0.9rem, 2.4vw, 1.5rem); font-weight: 800; font-style: italic; letter-spacing: 0.32em;
    box-shadow: 0 4px 0 rgba(11, 26, 61, 0.5);
  }
  #title .press {
    margin-top: auto; align-self: center; font-size: clamp(1rem, 2.2vw, 1.35rem); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: #fff; text-shadow: 0 2px 8px rgba(0, 20, 60, 0.7);
    animation: blink 1.4s ease-in-out infinite;
  }
  #title .foot { align-self: center; font-size: 0.8rem; opacity: 0.85; color: #fff; text-shadow: 0 1px 6px rgba(0, 20, 60, 0.8); text-align: center; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .tap-only { display: none; }

  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: flex; position: fixed; left: 12px; right: 12px; bottom: 16px;
      justify-content: space-between; pointer-events: none;
    }
    #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
    #touch button {
      width: 62px; height: 62px; padding: 0; border-radius: 50%;
      background: rgba(23, 26, 33, 0.7); border: 1px solid #2a2f3a;
      font-size: 0.75rem; font-weight: 600;
    }
    .keys-only { display: none; }
    .tap-only { display: inline; }
