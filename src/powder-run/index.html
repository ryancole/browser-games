// The lobby. The host steers it from the keyboard too: ← → change the course,
// ↑ ↓ the number of bots, Enter starts the race.
function showLobby() {
  const isHost = net.role === "host";
  const bots = lobbyBotCount();
  const players = net.players.map((p, i) => `
      <li><span class="dot" style="background:${LOOKS[i % PLAYER_LOOKS].tagColor}"></span><span class="nm">${esc(p.name)}</span>
      <span class="tag">${[i === 0 && "host", p.id === me.id && "you"].filter(Boolean).join(" · ")}</span></li>`).join("");
  const arrows = (id, value) => isHost
    ? `<button class="m-arrow chrome" id="${id}-">◀</button><span class="m-val chrome lav">${value}</span><button class="m-arrow chrome" id="${id}+">▶</button>`
    : `<span class="m-val chrome lav">${value}</span>`;
  const changeCourse = (d) => {
    const i = (LEVEL_IDS.indexOf(levelId) + d + LEVEL_IDS.length) % LEVEL_IDS.length;
    setLevel(LEVEL_IDS[i]);
    broadcastLobby();
    showLobby();
  };
  const screen = {
    kind: "lobby",
    nav(dx, dy) {
      if (!isHost) return false;
      if (dx) changeCourse(dx);
      else setBots(bots - dy);
      return true;
    },
    go: isHost ? hostStart : null,
    back: () => leaveLobby(),
  };
  openMenu(screen, {
    head: "LOBBY", back: screen.back, backLabel: "Leave", go: isHost ? "Start race" : "", attract: false,
    hint: isHost ? "← → Course · ↑ ↓ Bots · Enter Start · Esc Leave" : "Esc Leave",
    body: `
      <div class="m-code chrome lav">${esc(net.code)}</div>
      <button class="m-small chrome" id="copy">Copy invite link</button>
      <ul class="m-players">${players}</ul>
      <div class="m-setting"><span class="chrome">COURSE</span>${arrows("course", esc(level.name))}</div>
      <div class="m-setting"><span class="chrome">BOTS</span>${arrows("bots", bots)}</div>
      <p class="m-desc">${isHost ? esc(level.blurb) : net.racing ? "A race is on. You'll join the next one." : "Waiting for the host to start the race…"}</p>`,
  });
  $("copy").addEventListener("click", (e) => {
    const link = `${location.origin}${location.pathname}?join=${net.code}`;
    navigator.clipboard?.writeText(link).then(() => (e.target.textContent = "Copied!"), () => (e.target.textContent = link));
  });
  if (isHost) {
    $("course-").addEventListener("click", () => changeCourse(-1));
    $("course+").addEventListener("click", () => changeCourse(1));
    $("bots-").addEventListener("click", () => setBots(bots - 1));
    $("bots+").addEventListener("click", () => setBots(bots + 1));
  }
}
// Only redraw the lobby while it's on screen, not over a race or the results.
const refreshLobby = () => { if (net.role && state === "menu") showLobby(); };

function showResults() {
  resultsShown = true;
  const bonus = Math.max(0, Math.round((PAR_TIME * COURSE_LEN / SECTION_LEN - me.finishTime) * 50));
  const total = me.trickScore + bonus;
  const isBest = total > best;
  if (isBest) { best = total; store.set(bestKey(levelId), String(best)); }
  const rank = saveScore({
    score: total, date: Date.now(), tricks: me.trickScore, time: r2(me.finishTime),
    place: standings().indexOf(me) + 1, riders: riders.length, mode: net.role ? "lobby" : "solo", level: levelId,
  });
  result = { bonus, total, isBest, rank };
  renderResults();
  closeMenu();
  panel.classList.remove("hidden");
}

// Re-rendered as other riders cross the line, so the standings fill in live.
function renderResults() {
  if (!result) return;
  const { bonus, total, isBest, rank } = result;
  const order = standings();
  const rows = order.map((r, i) => `
      <tr${r === me ? ' class="me"' : ""}><td>${i + 1}</td><td>${esc(r.name)}</td>
      <td class="num">${r.finished ? r.finishTime.toFixed(2) + " s" : "racing…"}</td><td class="num">${fmt(r.trickScore)}</td></tr>`).join("");
  const actions = !net.role ? '<button id="go">Ride again</button><button id="leave" class="secondary">Menu</button>'
    : net.role === "host" ? '<button id="go">Race again</button><button id="leave" class="secondary">Leave lobby</button>'
    : '<button id="leave" class="secondary">Leave lobby</button>';
  card.innerHTML = `
    <h1>${ordinal(order.indexOf(me) + 1).toUpperCase()} PLACE</h1>
    <table>
      <tr><td>Time</td><td class="num">${me.finishTime.toFixed(2)} s</td></tr>
      <tr><td>Trick points</td><td class="num">${fmt(me.trickScore)}</td></tr>
      <tr><td>Time bonus</td><td class="num">${fmt(bonus)}</td></tr>
      <tr class="total"><td>Total</td><td class="num">${fmt(total)}</td></tr>
    </table>
    <table class="standings">
      <tr><th></th><th>Rider</th><th class="num">Time</th><th class="num">Tricks</th></tr>${rows}
    </table>
    <p>${isBest ? '<span class="new">New best score!</span>'
      : rank ? `<span class="new">#${rank} on your high scores</span> · Best: ${fmt(best)}`
      : `Best: ${fmt(best)}`}</p>
    ${net.role === "client" ? "<p>Waiting for the host to start the next race…</p>" : ""}
    <div class="buttons">${actions}</div>`;
  $("go")?.addEventListener("click", requestRestart);
  $("leave")?.addEventListener("click", () => leaveLobby());
}

function toggleMute() {
  muted = !muted;
  store.set("powderrun-muted", muted ? "1" : "0");
  if (master) master.gain.value = muted ? 0 : 1;
  muteBtn.textContent = `Sound: ${muted ? "off" : "on"}`;
}
muteBtn.textContent = `Sound: ${muted ? "off" : "on"}`;
musicBtn.textContent = `Music: ${musicOn ? "on" : "off"}`;
musicBtn.addEventListener("click", () => { initAudio(); toggleMusic(); musicBtn.blur(); });
voiceBtn.textContent = `Voice: ${voiceOn ? "on" : "off"}`;
voiceBtn.style.display = speech ? "" : "none"; // no text-to-speech in this browser
voiceBtn.addEventListener("click", () => { toggleVoice(); voiceBtn.blur(); });
muteBtn.addEventListener("click", () => { initAudio(); toggleMute(); muteBtn.blur(); });
restartBtn.addEventListener("click", (e) => { requestRestart(); e.currentTarget.blur(); });
leaveTopBtn.addEventListener("click", () => leaveLobby());

// ---------------------------------------------------------------------------
// Multiplayer. Browsers connect directly to each other over WebRTC using
// PeerJS. PeerJS's public server is only used to find the host by lobby code.
// The host runs the bots and relays every rider's state to everyone; each
// browser runs the physics for its own rider.
// ---------------------------------------------------------------------------
const PEERJS_URL = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
const PEER_PREFIX = "powderrun-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const SEND_RATE = 15;
const net = { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], bots: BOTS.length, racing: false };
let netAcc = 0;
let myName = store.get("powderrun-name") || "";

let peerJS = null;
function loadPeerJS() {
  peerJS ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PEERJS_URL;
    s.onload = () => resolve(window.Peer);
    s.onerror = () => { peerJS = null; reject(new Error("Couldn't load the multiplayer library. Check your internet connection.")); };
    document.head.append(s);
  });
  return peerJS;
}

const makeCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const gearSeed = (v) => (Number.isFinite(v) ? v >>> 0 : 0);
const cleanName = (s) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, 16) || "Rider";
function readName() {
  const input = $("name");
  if (!input) return; // the name box is on the multiplayer menu
  myName = cleanName(input.value);
  store.set("powderrun-name", myName);
}

function peerErrorText(err) {
  switch (err?.type) {
    case "peer-unavailable": return "No lobby found with that code.";
    case "browser-incompatible": return "This browser doesn't support the connections multiplayer needs.";
    case "network": case "server-error": case "socket-error": case "socket-closed":
      return "Couldn't reach the lobby server. Check your connection and try again.";
    default: return `Connection problem (${err?.type || "unknown"}).`;
  }
}

function sendAll(msg) {
  for (const c of net.conns.values()) if (c.open) c.send(msg);
}

// Called every frame during a race; sends at SEND_RATE.
function netTick(dt) {
  if (!net.role) return;
  netAcc += dt;
  if (netAcc < 1 / SEND_RATE) return;
  netAcc %= 1 / SEND_RATE;
  if (net.role === "client") { if (net.host?.open) net.host.send({ t: "me", s: packRider(me) }); }
  else sendAll({ t: "snap", s: riders.map(packRider).filter(Boolean) });
}

// --- Host ---
async function hostLobby() {
  readName();
  stopAttract();
  showStatus("Creating a lobby…");
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message, showHostSetup); }
  const open = (attempt) => {
    const code = makeCode();
    const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
    Object.assign(net, { role: "host", peer, code, conns: new Map(), players: [], racing: false });
    peer.on("open", (id) => {
      me.id = id;
      net.players = [{ id, name: myName, gear: myGear }];
      state = "menu";
      showLobby();
    });
    peer.on("connection", acceptPlayer);
    // Losing the lobby server only stops new players joining; reconnect so they can.
    peer.on("disconnected", () => { if (net.peer === peer && !peer.destroyed) peer.reconnect(); });
    peer.on("error", (err) => {
      if (net.peer !== peer) return;
      if (err.type === "unavailable-id" && attempt < 3) { peer.destroy(); open(attempt + 1); }
      else if (err.type !== "peer-unavailable" && !net.players.length) leaveLobby(peerErrorText(err));
    });
  };
  open(0);
}

function acceptPlayer(conn) {
  conn.on("open", () => {
    if (net.players.length >= MAX_RIDERS) { conn.send({ t: "full" }); setTimeout(() => conn.close(), 500); return; }
    net.conns.set(conn.peer, conn);
  });
  conn.on("data", (m) => onHostData(conn, m));
  conn.on("close", () => dropPlayer(conn.peer));
  conn.on("error", () => dropPlayer(conn.peer));
}

function onHostData(conn, m) {
  if (!m || typeof m !== "object" || !net.conns.has(conn.peer)) return;
  if (m.t === "hello") {
    if (net.players.some((p) => p.id === conn.peer)) return;
    net.players.push({ id: conn.peer, name: cleanName(m.name), gear: gearSeed(m.gear) });
    broadcastLobby();
    refreshLobby();
  } else if (m.t === "me") {
    const r = riders.find((x) => x.id === conn.peer && x.remote);
    if (r) applyNet(r, m.s);
  }
}

function dropPlayer(id) {
  if (net.role !== "host") return;
  net.conns.delete(id);
  const i = net.players.findIndex((p) => p.id === id);
  if (i < 0) return;
  net.players.splice(i, 1);
  removeRider(id);
  broadcastLobby();
  refreshLobby();
}

const lobbyBotCount = () => Math.max(0, Math.min(net.bots, BOTS.length, MAX_RIDERS - net.players.length));
function setBots(n) {
  net.bots = Math.max(0, Math.min(BOTS.length, n));
  broadcastLobby();
  showLobby();
}
function broadcastLobby() {
  sendAll({ t: "lobby", code: net.code, players: net.players, bots: lobbyBotCount(), racing: net.racing, level: levelId });
}

function hostStart() {
  const roster = [
    ...net.players.map((p, i) => ({ id: p.id, name: p.name, look: i % PLAYER_LOOKS, gear: p.gear })),
    ...BOTS.slice(0, lobbyBotCount()).map((b, i) => ({ id: `bot${i}`, name: b.name, look: b.look, bot: b.skill, gear: botGear[i] })),
  ];
  net.racing = true;
  sendAll({ t: "start", roster, level: levelId });
  broadcastLobby();
  startRace(roster);
}

// --- Client ---
async function joinLobby(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 5) return showJoin("Lobby codes are 5 letters and numbers.");
  readName();
  stopAttract();
  showStatus(`Joining lobby ${code}…`);
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message, showJoin); }
  const peer = new Peer({ debug: 0 });
  Object.assign(net, { role: "client", peer, code, host: null, players: [], racing: false });
  const timer = setTimeout(() => {
    if (net.peer === peer && !net.host?.open) {
      leaveLobby("Couldn't connect to the lobby. The host may have left, or a network between you is blocking direct connections.");
    }
  }, 15000);
  peer.on("open", (id) => {
    me.id = id;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
    net.host = conn;
    conn.on("open", () => { clearTimeout(timer); conn.send({ t: "hello", name: myName, gear: myGear }); });
    conn.on("data", onClientData);
    conn.on("close", () => { if (net.peer === peer) leaveLobby("The host closed the lobby."); });
  });
  peer.on("error", (err) => {
    if (net.peer !== peer) return;
    clearTimeout(timer);
    leaveLobby(peerErrorText(err));
  });
}

function onClientData(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "lobby") {
    net.players = (Array.isArray(m.players) ? m.players : []).slice(0, MAX_RIDERS)
      .map((p) => ({ id: String(p?.id), name: cleanName(p?.name), gear: gearSeed(p?.gear) }));
    net.bots = Number.isInteger(m.bots) ? m.bots : 0;
    net.racing = !!m.racing;
    // Show the host's course behind the lobby, but never rebuild it under a race.
    if (state === "menu" && !resultsShown && LEVELS[m.level]) setLevel(m.level);
    // Remove riders whose players have left.
    for (const r of [...riders]) if (r.remote && r.bot == null && !r.id.startsWith("bot") && !net.players.some((p) => p.id === r.id)) removeRider(r.id);
    refreshLobby();
  } else if (m.t === "start") {
    const roster = (Array.isArray(m.roster) ? m.roster : []).slice(0, MAX_RIDERS).map((e) => ({
      id: String(e?.id), name: cleanName(e?.name),
      look: Number.isInteger(e?.look) && e.look >= 0 && e.look < LOOKS.length ? e.look : 0,
      bot: Number.isFinite(e?.bot) ? e.bot : undefined,
      gear: gearSeed(e?.gear),
    }));
    // Joined after this race was set up: wait in the lobby for the next one.
    if (roster.some((e) => e.id === me.id)) {
      setLevel(LEVELS[m.level] ? m.level : "peak");
      startRace(roster);
    }
  } else if (m.t === "snap" && Array.isArray(m.s)) {
    for (const s of m.s) {
      const r = s && riders.find((x) => x.id === s.id && x.remote);
      if (r) applyNet(r, s);
    }
  } else if (m.t === "full") {
    leaveLobby("That lobby is full.");
  }
}

// Back to solo play. `message` explains why, if it wasn't the player's choice.
// Leaving a lobby goes back to the multiplayer menu (the join screen if joining
// failed); a solo race goes back to the main menu.
function leaveLobby(message = "", screen = null) {
  const peer = net.peer, role = net.role;
  screen ??= role === "client" && message ? showJoin : role ? showMultiplayer : showMenu;
  Object.assign(net, { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], racing: false });
  peer?.destroy();
  me.id = "me";
  state = "menu";
  resultsShown = false; result = null;
  countEl.textContent = "";
  restartBtn.style.display = "";
  leaveTopBtn.style.display = "none";
  setRoster(soloRoster());
  snapCamera();
  screen(message);
}

// ---------------------------------------------------------------------------
// Title screen: your rider frozen mid-grab high against a blue sky, shot from
// below with snow spraying off the board. It has its own small scene, so it
// looks the same whichever course is picked. When there's a menu song, the
// first key or tap starts it and the next goes to the menu.
// ---------------------------------------------------------------------------
const titleEl = $("title");
let title = null;

function boardGraphic(g) {
  const hex = (c) => `#${new THREE.Color(c).getHexString()}`;
  return canvasTexture(128, 448, (ctx) => {
    ctx.fillStyle = hex(g.board); ctx.fillRect(0, 0, 128, 448);
    ctx.fillStyle = hex(g.stripe);
    for (let i = -2; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * 70); ctx.lineTo(128, i * 70 - 60); ctx.lineTo(128, i * 70 - 36); ctx.lineTo(0, i * 70 + 24);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(64, 224); ctx.rotate(Math.PI / 2);
    ctx.font = "italic 900 54px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 8; ctx.strokeStyle = "#11131a"; ctx.strokeText("POWDER RUN", 0, 2);
    ctx.fillStyle = "#ffffff"; ctx.fillText("POWDER RUN", 0, 2);
    ctx.restore();
  });
}

function buildTitle() {
  const s = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 3000);
  skyDome(0x1a4fb8, 0xbfe2ff, 0xe8f4ff, s);
  s.add(new THREE.HemisphereLight(0xeaf4ff, 0xb8cce6, 1.5));
  const key = new THREE.DirectionalLight(0xfff4e0, 2.6);
  key.position.set(-4, 8, 6);
  const bounce = new THREE.DirectionalLight(0xbfe0ff, 1.1); // light thrown back up off the snow
  bounce.position.set(2, -6, 4);
  s.add(key, bounce);

  // The sun, low in the top corner, with a soft glare.
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture("rgba(255,255,240,1)", "rgba(255,250,220,0)"), depthWrite: false }));
  sunSprite.position.set(-55, 70, -140);
  sunSprite.scale.setScalar(48);
  s.add(sunSprite);

  // Snowy treetops far below.
  const trees = [];
  for (let i = 0; i < 26; i++) trees.push({ x: -70 + i * 5.6 + Math.sin(i * 7.3) * 2, z: -30 - Math.abs(Math.sin(i * 3.1)) * 25, s: 2 + Math.abs(Math.sin(i * 1.7)) * 1.6 });
  for (const [geo, y, color] of [[new THREE.ConeGeometry(1.9, 3.4, 7), 2.6, 0x2f5d46], [new THREE.ConeGeometry(1.25, 2.8, 7), 4.6, 0xeef4fb]]) {
    instanced(geo, trees, (t, o, c) => { o.position.set(t.x, -17 + y * t.s, t.z); o.scale.setScalar(t.s); o.rotation.set(0, t.x, 0); c.set(color); }, { group: s, shadow: false });
  }

  // The rider, wearing your outfit, in a held grab with the back arm thrown out.
  const model = buildRiderModel(LOOKS[0], rollGear(myGear));
  const tilt = new THREE.Group();
  tilt.add(model.root);
  s.add(tilt);
  const deck = new THREE.Mesh(boardGeometry({ faces: "bottom" }), new THREE.MeshStandardMaterial({ map: boardGraphic(rollGear(myGear)), roughness: 0.35 }));
  deck.position.y = -0.003;
  model.pose.add(deck);
  const legScale = 1 - 0.45 * 0.85;
  model.legs.forEach((l) => (l.scale.y = legScale));
  model.upper.position.y = LEG_BASE + LEG_H * legScale;
  model.upper.rotation.z = -0.3;
  model.arms[0].rotation.set(0.15, 0, 1.25);
  model.arms[1].rotation.set(2.1, 0, -0.5);

  // A plume of snow trailing off the board, drifting in slow motion.
  const N = 700;
  const pos = new Float32Array(N * 3).fill(-999), vel = new Float32Array(N * 3), life = new Float32Array(N);
  const geo = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const plume = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.11, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false }));
  plume.frustumCulled = false;
  s.add(plume);

  // Sparkling flakes drifting across the whole view.
  const F = 400, flakes = new Float32Array(F * 3);
  for (let i = 0; i < F; i++) { flakes[i * 3] = (Math.random() - 0.5) * 16; flakes[i * 3 + 1] = (Math.random() - 0.5) * 10; flakes[i * 3 + 2] = (Math.random() - 0.5) * 8; }
  const flakeGeo2 = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(flakes, 3));
  const flakePts = new THREE.Points(flakeGeo2, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false }));
  flakePts.frustumCulled = false;
  s.add(flakePts);

  return {
    scene: s, cam, tilt, model, pos, vel, life, geo, flakes, flakeGeo2, t: 0, next: 0, acc: 0,
    // Fake motion for the flapping gear: rising fast and carving through the air.
    rider: { model, vx: 3, vy: 7, vz: -14, grounded: false },
  };
}

const tailPt = new THREE.Vector3();
function updateTitle(dt) {
  const T = title;
  T.t += dt;
  const t = T.t;
  // A slow-motion float: the rider eases round and bobs a little.
  // Pitched back so the base of the board faces the camera below.
  T.model.root.rotation.set(-0.25 + Math.sin(t * 0.5) * 0.05, -1.0 + Math.sin(t * 0.33) * 0.16, 0.3);
  T.tilt.rotation.set(0, 0, 0.62 + Math.sin(t * 0.4) * 0.04);
  T.tilt.position.set(0, 0.5 + Math.sin(t * 0.7) * 0.06, 0);
  updateGear(T.rider, dt);

  // Spray leaves the tail of the board and fans out behind and below.
  T.acc += dt * 260;
  while (T.acc >= 1) {
    T.acc -= 1;
    const i = T.next; T.next = (T.next + 1) % T.life.length;
    tailPt.set((Math.random() - 0.5) * 0.4, 0.02, -0.7 - Math.random() * 0.25);
    T.model.pose.localToWorld(tailPt);
    T.pos[i * 3] = tailPt.x; T.pos[i * 3 + 1] = tailPt.y; T.pos[i * 3 + 2] = tailPt.z;
    T.vel[i * 3] = -1.2 - Math.random() * 1.6; T.vel[i * 3 + 1] = -0.9 - Math.random() * 1.2; T.vel[i * 3 + 2] = (Math.random() - 0.5) * 1.4;
    T.life[i] = 1.6 + Math.random() * 1.4;
  }
  for (let i = 0; i < T.life.length; i++) {
    if (T.life[i] <= 0) continue;
    T.life[i] -= dt;
    if (T.life[i] <= 0) { T.pos[i * 3 + 1] = -999; continue; }
    T.vel[i * 3 + 1] -= 0.6 * dt;
    T.pos[i * 3] += T.vel[i * 3] * dt; T.pos[i * 3 + 1] += T.vel[i * 3 + 1] * dt; T.pos[i * 3 + 2] += T.vel[i * 3 + 2] * dt;
  }
  T.geo.attributes.position.needsUpdate = true;
  for (let i = 0; i < T.flakes.length; i += 3) {
    T.flakes[i] = wrapIn(T.flakes[i] - 0.6 * dt, 8);
    T.flakes[i + 1] = wrapIn(T.flakes[i + 1] - 0.35 * dt, 5);
  }
  T.flakeGeo2.attributes.position.needsUpdate = true;

  // Shot from below, framed so the rider sits right of centre on wide screens
  // and in the middle on tall ones.
  const aspect = window.innerWidth / window.innerHeight;
  const cam = T.cam;
  cam.aspect = aspect;
  cam.fov = aspect < 1 ? 62 : 42;
  cam.updateProjectionMatrix();
  const side = aspect < 1 ? 0 : -1.3;
  cam.position.set(side + Math.sin(t * 0.25) * 0.15, -1.1, 4.4);
  cam.lookAt(side * 0.55, 0.75, 0);
}

function showTitle() {
  state = "title";
  title ??= buildTitle();
  panel.classList.add("hidden");
  document.body.classList.add("on-title");
  titleEl.classList.remove("hidden");
}
// Browsers keep the page silent until the first key or tap, so when there's a
// menu song the first press on the title just starts it; the next one goes on to the menu.
let titleMusicStarted = false;
function leaveTitle() {
  if (state !== "title") return;
  initAudio();
  if (!titleMusicStarted && MENU_TRACK && musicOn && !muted) {
    titleMusicStarted = true;
    initAudio();
    titleEl.querySelector(".press").innerHTML =
      '<span class="keys-only">Press any key to start</span><span class="tap-only">Tap to start</span>';
    return;
  }
  state = "menu";
  document.body.classList.remove("on-title");
  titleEl.classList.add("hidden");
  showMenu();
}
titleEl.addEventListener("click", leaveTitle);
window.addEventListener("keydown", (e) => {
  if (state === "title" && !e.repeat && !["KeyM", "KeyN", "KeyV"].includes(e.code)) { e.preventDefault(); leaveTitle(); }
});

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
setLevel(store.get("powderrun-level") || "peak");
setRoster(soloRoster());
for (const r of riders) updateRider(r, 1);
snapCamera();
// Invite links go straight to the join screen with the lobby code filled in.
if (inviteCode) showJoin(); else showTitle();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  syncTrack();
  if (state === "title") {
    updateTitle(dt);
    updateAudio(0, 0);
    renderer.render(title.scene, title.cam);
  } else {
    update(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
