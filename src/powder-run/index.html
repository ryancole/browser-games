const keys = new Set();
const touch = { left: false, right: false, tuck: false, brake: false, grab: false, jump: false };
const has = (...codes) => codes.some((c) => keys.has(c));
function readInput() {
  return {
    left: has("ArrowLeft", "KeyA") || touch.left,
    right: has("ArrowRight", "KeyD") || touch.right,
    tuck: has("ArrowUp", "KeyW") || touch.tuck,
    brake: has("ArrowDown", "KeyS") || touch.brake,
    grab: has("KeyJ", "KeyX", "ShiftLeft", "ShiftRight") || touch.grab,
    jump: has("Space", "KeyK") || touch.jump,
  };
}
const GAME_KEYS = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"]);
window.addEventListener("keydown", (e) => {
  if (menuKey(e)) return;
  if (e.target instanceof HTMLInputElement) return; // typing a name or lobby code
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (e.repeat) { keys.add(e.code); return; }
  keys.add(e.code);
  if (e.code === "KeyM") toggleMute();
  else if (e.code === "KeyN") toggleMusic();
  else if (e.code === "KeyV") toggleVoice();
  else if (e.code === "KeyR" && state !== "menu" && state !== "title") requestRestart();
  else if (e.code === "Enter" && resultsShown) requestRestart();
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => { keys.clear(); for (const k in touch) touch[k] = false; });
document.querySelectorAll("#touch button").forEach((btn) => {
  const k = btn.dataset.t;
  const on = (e) => { e.preventDefault(); touch[k] = true; btn.setPointerCapture?.(e.pointerId); };
  const off = (e) => { e.preventDefault(); touch[k] = false; };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointercancel", off);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
});

// ---------------------------------------------------------------------------
// Riders. Every rider runs the same physics and is driven by a controls object
// ({left, right, tuck, brake, grab, jump}) from the keyboard or a bot. Riders
// owned by other players' browsers are "remote": they don't run physics here,
// they follow the state their owner sends.
// ---------------------------------------------------------------------------
const LOOKS = [
  // Players, in lobby order.
  { jacket: 0xff7a2f, tagColor: "#ffb07a" },
  { jacket: 0x2f9bff, tagColor: "#8cc8ff" },
  { jacket: 0xf2c94c, tagColor: "#ffe08a" },
  { jacket: 0xff5fa2, tagColor: "#ffa8cf" },
  { jacket: 0x2ad1c9, tagColor: "#8ff0ea" },
  { jacket: 0xf2f2f2, tagColor: "#ffffff" },
  { jacket: 0xa0703c, tagColor: "#e0b98a" },
  { jacket: 0x6b7cff, tagColor: "#b0baff" },
  // Bots.
  { jacket: 0x3fbf7f, tagColor: "#8fe8b4" },
  { jacket: 0xe0443a, tagColor: "#ff9a90" },
  { jacket: 0x9b6dff, tagColor: "#c8b0ff" },
];
const PLAYER_LOOKS = 8;
const MAX_RIDERS = 8;
const BOTS = [
  { name: "Juniper", skill: 0.35, look: 8 },
  { name: "Blaze", skill: 0.6, look: 9 },
  { name: "Nova", skill: 0.85, look: 10 },
];
const LANES = [0, -6, 5, 10, -11, -2, 14, -15]; // start positions across the run, in roster order
const NO_INPUT = Object.freeze({ left: false, right: false, tuck: false, brake: false, grab: false, jump: false });

function newRider(e, isMe) {
  const look = LOOKS[e.look] || LOOKS[0];
  return {
    id: e.id, name: e.name, look: e.look, gear: e.gear, isPlayer: isMe, bot: null, remote: false, net: null, netRaw: null,
    model: buildRiderModel(look, rollGear(e.gear ?? 0)), tag: isMe ? null : nameTag(e.name, look.tagColor),
  };
}
function disposeRider(r) {
  scene.remove(r.model.root);
  r.model.root.traverse((o) => o.geometry?.dispose()); // materials are shared, geometry isn't
  if (r.tag) { scene.remove(r.tag); r.tag.material.map.dispose(); r.tag.material.dispose(); }
}

const riders = [];
// Outfits for you and the bots are rolled once per visit; in a lobby the host shares everyone's.
const myGear = randomSeed();
const botGear = BOTS.map(randomSeed);
let me = newRider({ id: "me", name: "You", look: 0, gear: myGear }, true);

// A roster is the list of riders in a race: [{ id, name, look, bot? }], where
// `bot` is a bot's skill. Every browser in a lobby builds the same roster.
function setRoster(roster) {
  for (const r of riders) if (r !== me) disposeRider(r);
  riders.length = 0;
  roster.forEach((e, i) => {
    let r;
    if (e.id === me.id) {
      if (me.look !== e.look || me.gear !== e.gear) { disposeRider(me); me = newRider(e, true); }
      me.name = e.name;
      r = me;
    } else {
      r = newRider(e, false);
      // Bots run in solo races and on the host; other browsers follow the host's copy.
      if (e.bot != null && net.role !== "client") r.bot = { skill: e.bot };
      else r.remote = true;
    }
    r.lane = LANES[i % LANES.length];
    resetRider(r);
    riders.push(r);
  });
}
const soloRoster = () => [
  { id: me.id, name: "You", look: 0, gear: myGear },
  ...BOTS.map((b, i) => ({ id: `bot${i}`, name: b.name, look: b.look, bot: b.skill, gear: botGear[i] })),
];

function removeRider(id) {
  const i = riders.findIndex((r) => r.id === id && r !== me);
  if (i < 0) return;
  disposeRider(riders[i]);
  riders.splice(i, 1);
  if (resultsShown) renderResults();
}

function resetRider(r) {
  endRag(r);
  Object.assign(r, {
    x: center(0) + r.lane, z: 0, y: 0, vx: 0, vy: 0, vz: 0,
    heading: 0, spin: 0, flip: 0, flipYaw: 0, sw: false, takeoffSw: false,
    grounded: true, roof: null, groundVy: 0, airTime: 0, slip: 0,
    charge: 0, popped: false, jumpPrev: false, jumpT: 0, lungeCool: 0, lungeT: 0, grabbing: false, grabTime: 0, grabName: "",
    crashT: 0, crashSpin: 0, lean: 0, crouch: 0,
    trickScore: 0, finished: false, finishTime: 0, inp: NO_INPUT, net: null, netRaw: null,
  });
  r.y = terrainH(r.x, r.z);
  if (r.bot) Object.assign(r.bot, { t: 0, phase: Math.random() * 10, kickIdx: -1, plan: null, lane: null });
}

// What a browser sends about the riders it runs, about 15 times a second.
const r2 = (v) => Math.round(v * 100) / 100;
const NET_KEYS = ["x", "y", "z", "vx", "vy", "vz", "yaw", "fl", "fy", "g", "gr", "c", "ch", "sl", "k", "ts", "fin", "ft"];
function packRider(r) {
  if (r.remote) return r.netRaw;
  const i = r.inp;
  return {
    id: r.id, x: r2(r.x), y: r2(r.y), z: r2(r.z), vx: r2(r.vx), vy: r2(r.vy), vz: r2(r.vz),
    yaw: r2(r.heading + (r.sw ? Math.PI : 0) + r.spin), fl: r2(r.flip), fy: r2(r.flipYaw),
    g: r.grounded ? 1 : 0, gr: r.grabbing ? 1 : 0, c: r2(r.crashT), ch: r2(r.charge), sl: r2(r.slip),
    k: (i.left ? 1 : 0) | (i.right ? 2 : 0) | (i.tuck ? 4 : 0) | (i.brake ? 8 : 0),
    ts: r.trickScore, fin: r.finished ? 1 : 0, ft: r2(r.finishTime),
  };
}
// Incoming state comes from another browser, so only finite numbers are kept.
function applyNet(r, s) {
  if (!s || typeof s !== "object") return;
  const v = { id: r.id };
  for (const k of NET_KEYS) v[k] = Number.isFinite(s[k]) ? s[k] : 0;
  r.netRaw = v;
  r.net = { ...v, at: performance.now() };
  r.trickScore = v.ts;
  if (!r.finished && v.fin) {
    r.finished = true;
    r.finishTime = v.ft;
    if (resultsShown) renderResults();
  }
}
// Draw a remote rider where its last update says it should be by now, eased so
// the 15 updates a second don't show as jumps.
function followNet(r, dt) {
  const n = r.net;
  if (!n) return;
  const t = Math.min(0.25, (performance.now() - n.at) / 1000);
  const tx = n.x + n.vx * t, tz = n.z + n.vz * t;
  const ty = n.g ? surfaceAt(tx, tz, n.y)[0] : n.y + n.vy * t - 0.5 * G_AIR * t * t;
  const k = 1 - Math.exp(-12 * dt), ka = 1 - Math.exp(-20 * dt);
  if (Math.hypot(tx - r.x, ty - r.y, tz - r.z) > 8) { r.x = tx; r.y = ty; r.z = tz; }
  else { r.x += (tx - r.x) * k; r.y += (ty - r.y) * k; r.z += (tz - r.z) * k; }
  if (n.g) r.y = surfaceAt(r.x, r.z, n.y)[0];
  r.vx = n.vx; r.vy = n.vy; r.vz = n.vz;
  r.heading = wrapAngle(r.heading + wrapAngle(n.yaw - r.heading) * ka);
  r.spin = 0; r.sw = false;
  r.flip = wrapAngle(r.flip + wrapAngle(n.fl - r.flip) * ka);
  r.flipYaw = n.fy;
  r.grounded = !!n.g; r.grabbing = !!n.gr; r.charge = n.ch; r.slip = n.sl;
  const wasCrashed = r.crashT > 0;
  r.crashT = n.c;
  r.crashSpin = r.crashT > 0 ? r.crashSpin + 9 * dt : 0;
  if (!wasCrashed && r.crashT > 0) startRag(r, n.vx, n.vy, n.vz);
  else if (wasCrashed && r.crashT <= 0) endRag(r);
  r.inp = { left: !!(n.k & 1), right: !!(n.k & 2), tuck: !!(n.k & 4), brake: !!(n.k & 8), grab: r.grabbing, jump: false };
}

// ---------------------------------------------------------------------------
// Game state and physics
// ---------------------------------------------------------------------------
const STEP = 1 / 180;        // fixed physics step, so every rider behaves the same at any frame rate
let state = "menu";          // menu | countdown | run
let raceTime = 0, countT = 0, simAcc = 0;
let resultsShown = false, lastCount = 0, result = null;
// High scores: your 10 best finished runs, kept in this browser's localStorage.
const SCORES_KEY = "powderrun-scores", MAX_SCORES = 10;
function loadScores() {
  let list;
  try { list = JSON.parse(store.get(SCORES_KEY) || "[]"); } catch { list = []; }
  if (!Array.isArray(list)) return [];
  return list.filter((s) => Number.isFinite(s?.score) && Number.isFinite(s?.date)).map((s) => ({
    score: s.score, date: s.date,
    tricks: Number(s.tricks) || 0, time: Number(s.time) || 0,
    place: Math.max(0, Math.round(Number(s.place) || 0)), riders: Math.max(0, Math.round(Number(s.riders) || 0)),
    mode: s.mode === "lobby" ? "lobby" : "solo",
    level: LEVELS[s.level] ? s.level : "peak", // runs from before there were levels were all on Snowy Peak
  })).sort((a, b) => b.score - a.score || a.date - b.date).slice(0, MAX_SCORES);
}
// Adds a run and returns its rank on the list (1 is best), or 0 if it didn't make the top 10.
function saveScore(entry) {
  const list = [...loadScores(), entry]
    .sort((a, b) => b.score - a.score || a.date - b.date)
    .slice(0, MAX_SCORES);
  store.set(SCORES_KEY, JSON.stringify(list));
  return list.indexOf(entry) + 1;
}
// Each level keeps its own best score. Snowy Peak keeps the key from before there were levels.
const bestKey = (id) => (id === "peak" ? "powderrun-best" : `powderrun-best-${id}`);
const bestFor = (id) => Math.max(Number(store.get(bestKey(id))) || 0, ...loadScores().filter((s) => s.level === id).map((s) => s.score));
let best = 0;

const canControl = (r) => (state === "run" || attract) && r.crashT <= 0 && !r.finished;

function leaveGround(r, y, vy) {
  r.grounded = false;
  r.roof = null;
  r.y = y; r.vy = vy;
  r.airTime = 0; r.spin = 0; r.flip = 0; r.grabTime = 0; r.grabbing = false; r.popped = false;
  r.takeoffSw = r.sw;
  r.called = { spin: 0, flip: 0, grab: false, any: false }; // what's been called out on this jump so far
  // Players' held inputs are latched (see airStep). Bots plan their tricks, so they aren't.
  const i = r.inp || NO_INPUT;
  r.latch = r.isPlayer ? { left: i.left, right: i.right, tuck: i.tuck, brake: i.brake } : null;
  // Tuck or brake already held stays "carried" until let go (see airStep), even after an ollie.
  r.carry = r.isPlayer ? { tuck: i.tuck, brake: i.brake } : null;
  // Flips turn about the axis across the direction of travel at takeoff, so
  // "forward" always means toward where you're headed, whichever way you've spun.
  r.flipYaw = Math.hypot(r.vx, r.vz) > 1 ? Math.atan2(r.vx, r.vz) : r.heading;
}

function ollie(r, late) {
  const base = late ? r.vy : r.groundVy;
  if (r.grounded) leaveGround(r, r.y + 0.02, base);
  r.vy = base + 4 + 4.5 * r.charge;
  r.popped = true;
  r.latch = null; // after an ollie, everything you hold counts straight away
  if (r.isPlayer) sfx.jump();
}

function crash(r, reason) {
  if (r.crashT > 0) return;
  r.crashT = CRASH_T;
  r.crashSpin = 0;
  r.grabbing = false; r.spin = 0; r.flip = 0; r.charge = 0;
  startRag(r, r.vx, r.vy, r.vz);
  if (r.isPlayer) { airTrickEnd("lost"); sfx.crash(); showPopup(reason, "WIPEOUT", true); announceWipeout(); }
}

function recover(r) {
  endRag(r);
  const s = Math.hypot(r.vx, r.vz);
  r.heading = s > 3 ? Math.atan2(r.vx, r.vz) : 0;
  r.sw = false; r.crashSpin = 0;
}

function groundStep(r, h, inp) {
  const ctl = canControl(r);
  const [gx, gz] = surfaceGrad(r.x, r.z, r.roof);
  const inv = 1 / (1 + gx * gx + gz * gz);
  r.vx += -G_GROUND * gx * inv * h;
  r.vz += -G_GROUND * gz * inv * h;

  const steer = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  const brake = ctl && inp.brake;
  const tuck = ctl && inp.tuck && !brake;
  r.heading -= steer * TURN_RATE * (brake ? 1.3 : 1) * h;

  const fx = Math.sin(r.heading), fz = Math.cos(r.heading);
  const sx = Math.cos(r.heading), sz = -Math.sin(r.heading);
  let vf = r.vx * fx + r.vz * fz;
  let vs = r.vx * sx + r.vz * sz;
  r.slip = Math.abs(vs);

  // Edges bite: sideways speed bleeds off, and most of it is redirected forward
  // when carving. On ice they hardly bite, so you turn but keep sliding the way
  // you were going, and braking does little.
  const ice = !!r.roof;
  const grip = r.crashT > 0 ? 1.5 : ice ? (brake ? 0.9 : 0.5) : brake ? 3 : 7;
  const keep = Math.exp(-grip * h);
  const lost = Math.abs(vs) * (1 - keep);
  vs *= keep;
  if (r.crashT <= 0) vf += Math.sign(vf || 1) * lost * (brake ? 0.1 : ice ? 0.3 : 0.55);

  const kAir = tuck ? 0.0045 : 0.0085;
  vf -= ((ice ? 0.008 : 0.03) * vf + kAir * vf * Math.abs(vf)) * h;
  if (brake) vf *= Math.exp(-(ice ? 0.3 : 1.2) * h);
  if (r.crashT > 0) vf *= Math.exp(-1.8 * h);
  if (r.finished) { vf *= Math.exp(-1.4 * h); vs *= Math.exp(-3 * h); }

  r.vx = vf * fx + vs * sx;
  r.vz = vf * fz + vs * sz;

  const nx = r.x + r.vx * h, nz = r.z + r.vz * h;
  const [ground, roof] = surfaceAt(nx, nz, r.y);
  // Ground that rises too steeply to ride (a rock face, a cliff from below, the
  // side of a ledge) is a wall: stay put and bounce or slide along it.
  if (ground - r.y > WALL_STEP) return hitWall(r, nx, nz);
  const yPred = r.y + r.groundVy * h - 0.5 * G_AIR * h * h;
  r.x = nx; r.z = nz;
  if (yPred > ground + 0.04) {
    // The ground fell away faster than gravity can pull us down: we're airborne.
    leaveGround(r, yPred, r.groundVy - G_AIR * h);
  } else {
    // Keep speed along the surface constant when the slope changes, so riding
    // up a steep bank slows you down instead of handing out free speed.
    const [gx2, gz2] = surfaceGrad(nx, nz, roof);
    const sp = Math.hypot(r.vx, r.vz) || 1;
    const mOld = (gx * r.vx + gz * r.vz) / sp, mNew = (gx2 * r.vx + gz2 * r.vz) / sp;
    let scale = Math.sqrt((1 + mOld * mOld) / (1 + mNew * mNew));
    // A sudden steepening (the lip of a cliff or kicker, about to send you
    // airborne) mustn't take away the speed you leave it with.
    if (mNew < mOld) scale = Math.max(scale, 0.985);
    r.vx *= scale; r.vz *= scale;
    // Use the actual height change rather than the local gradient, so touching
    // down for one substep on a kicker's drop-off doesn't glue us to the snow.
    // Capped so a sudden position change (bouncing off a tree) can't launch us.
    r.groundVy = Math.min((ground - r.y) / h, Math.max(mOld, mNew) * sp + 2);
    r.y = ground;
    r.roof = roof;
  }
}

function airStep(r, h, inp) {
  const yPrev = r.y;
  r.vy -= G_AIR * h;
  const drag = Math.exp(-0.05 * h);
  r.vx *= drag; r.vz *= drag;
  const nx = r.x + r.vx * h, nz = r.z + r.vz * h;
  // Flying into a face well above your feet is a wall, not a landing.
  if (terrainH(nx, nz) - (r.y + r.vy * h) > 1.2) hitWall(r, nx, nz);
  else { r.x = nx; r.z = nz; }
  r.y += r.vy * h;
  r.airTime += h;
  // Cave and cabin roofs: you can't fly up through them from underneath.
  for (const c of ceilings) {
    if (r.z < c.z0 || r.z > c.z1) continue;
    const u = r.x - center(r.z);
    if (u < c.u0 || u > c.u1) continue;
    const top = terrainH(r.x, r.z) + c.clear;
    if (yPrev <= top + 0.05 && r.y > top) { r.y = top; r.vy = Math.min(r.vy, 0); }
  }
  if (canControl(r)) {
    // Leaving the ground off a bump or drop without an ollie, a turn or tuck you
    // were already holding doesn't count until you let go and press it again,
    // so riding through moguls or off a cliff doesn't throw you into a spin or flip.
    const L = r.latch;
    if (L) for (const k in L) if (!inp[k]) L[k] = false;
    const held = (k) => inp[k] && !(L && L[k]);
    const steer = (held("right") ? 1 : 0) - (held("left") ? 1 : 0);
    const pitch = (held("tuck") ? 1 : 0) - (held("brake") ? 1 : 0);
    // A tuck or brake you were holding as you ollied (riding along tucked, say)
    // eases in instead of flipping you at once, so a little pop doesn't tip you
    // onto your nose. Let go and press it again for a full-speed flip.
    const C = r.carry;
    if (C) { if (!inp.tuck) C.tuck = false; if (!inp.brake) C.brake = false; }
    const carried = C && ((pitch > 0 && C.tuck) || (pitch < 0 && C.brake));
    const ease = carried ? Math.min(1, Math.max(0, (r.airTime - FLIP_EASE0) / FLIP_EASE)) : 1;
    r.spin -= steer * SPIN_RATE * h;
    r.flip += pitch * FLIP_RATE * ease * h;
    if (inp.grab) {
      if (!r.grabbing) {
        r.grabbing = true;
        if (!r.grabName) r.grabName = inp.tuck ? "Tail" : inp.brake ? "Nose" : steer ? "Method" : "Indy";
      }
      r.grabTime += h;
    } else r.grabbing = false;
    if (r.isPlayer) callTricksInAir(r);
  }
  const [ground, roof] = surfaceAt(r.x, r.z, yPrev);
  if (r.y <= ground) { r.roof = roof; land(r, ground); }
}

// Push back off a wall at (nx, nz): the part of your speed heading into it is
// turned back, the rest carries you along it. Hitting it hard wipes you out.
function hitWall(r, nx, nz) {
  const [gx, gz] = grad(nx, nz);
  const len = Math.hypot(gx, gz) || 1;
  const wx = gx / len, wz = gz / len; // pointing into the wall
  const vin = r.vx * wx + r.vz * wz;
  if (vin > 0) { r.vx -= 1.3 * vin * wx; r.vz -= 1.3 * vin * wz; }
  if (vin > 7 && !r.finished) crash(r, "Hit the wall!");
  if (r.grounded && Math.hypot(r.vx, r.vz) > 2) r.heading = Math.atan2(r.vx, r.vz);
}

function land(r, ground) {
  r.y = ground;
  // Judge the landing against the direction you were flying, before a sloping
  // landing (like the side of a bank) deflects you.
  const phiAir = Math.atan2(r.vx, r.vz);
  const [gx, gz] = surfaceGrad(r.x, r.z, r.roof);
  const len = Math.hypot(gx, 1, gz);
  const nx = -gx / len, ny = 1 / len, nz = -gz / len;
  const vn = r.vx * nx + r.vy * ny + r.vz * nz;
  if (vn < 0) { r.vx -= vn * nx; r.vy -= vn * ny; r.vz -= vn * nz; }
  r.grounded = true;
  r.groundVy = gx * r.vx + gz * r.vz;
  r.charge = 0;
  const airTime = r.airTime;
  const wasGrabbing = r.grabbing;
  const grabTime = r.grabTime, grabName = r.grabName;
  r.grabbing = false; r.grabName = "";

  if (!canControl(r)) { r.spin = 0; r.flip = 0; return; }

  const phi = Math.atan2(r.vx, r.vz);
  const rel = wrapAngle(r.heading + (r.sw ? Math.PI : 0) + r.spin - phiAir);
  const spin = r.spin, flip = r.flip;
  const flipLeft = wrapAngle(flip);
  r.spin = 0; r.flip = 0;
  // Landing a little nose-down is easier to ride out than tail-down, as long as
  // you weren't partway through a flip.
  const nose = flipLeft > 0 && Math.abs(flip) < Math.PI;
  if (Math.abs(flipLeft) > (nose ? FLIP_NOSE_TOL : FLIP_LAND_TOL)) {
    if (Math.abs(flipLeft) > 2.2) return crash(r, "Landed on your head!");
    return crash(r, Math.abs(flip) < Math.PI * 2 - FLIP_LAND_TOL ? "Under-rotated!" : "Over-rotated!");
  }
  if (wasGrabbing && airTime > 0.3) return crash(r, "Still grabbing!");
  if (Math.abs(rel) < SPIN_LAND_TOL) r.sw = false;
  else if (Math.abs(rel) > Math.PI - SPIN_LAND_TOL) r.sw = true;
  else return crash(r, "Landed sideways!");
  r.heading = phi;
  if (airTime > 0.25) landingPuff(r, airTime);
  if (airTime > 0.25 && r.isPlayer) sfx.land();
  scoreTrick(r, airTime, spin, flip, grabTime, grabName);
}

const FLIP_COUNT = ["", "", "Double ", "Triple ", "Quad "];
const flipName = (nFlip, flip) => `${FLIP_COUNT[nFlip] ?? nFlip + "x "}${flip > 0 ? "Frontflip" : "Backflip"}`;
const spinName = (n180, spin) => `${spin > 0 ? "Frontside" : "Backside"} ${n180 * 180}`;
const GRAB_MIN = 0.12; // seconds a grab has to be held to count

// Call out each part of the trick as you complete it in the air: every half
// turn of spin, every full flip, and a grab once it's held long enough. A
// rotation counts as done a little before it's exactly round, about when it
// would land clean. The full trick and its points still come on landing.
function callTricksInAir(r) {
  const c = r.called;
  const n180 = Math.floor((Math.abs(r.spin) + 0.25) / Math.PI);
  const nFlip = Math.floor((Math.abs(r.flip) + 0.3) / (Math.PI * 2));
  const grab = r.grabTime > GRAB_MIN;
  let part = null;
  if (nFlip > c.flip) part = flipName(nFlip, r.flip);
  else if (n180 > c.spin) part = spinName(n180, r.spin);
  else if (grab && !c.grab) part = `${r.grabName} Grab`;
  c.flip = Math.max(c.flip, nFlip); c.spin = Math.max(c.spin, n180); c.grab ||= grab;
  if (!part) return;
  c.any = true;
  airTrickAdd(r, part);
  announceInAir(part);
}

// Points for a trick: each flip, spin and grab, a bit for air time, more for
// combining kinds of trick, and more again for taking off switch.
function trickPoints(nFlip, n180, grabTime, airTime, sw) {
  let pts = 0;
  if (nFlip > 0) pts += FLIP_POINTS[Math.min(nFlip, FLIP_POINTS.length - 1)];
  if (n180 > 0) pts += SPIN_POINTS[Math.min(n180, SPIN_POINTS.length - 1)];
  if (grabTime > GRAB_MIN) pts += Math.round(100 + 400 * Math.min(grabTime, 1.5));
  if (airTime > 0.6) pts += Math.round(airTime * 60);
  const kinds = (nFlip > 0) + (n180 > 0) + (grabTime > GRAB_MIN);
  if (kinds >= 2) pts = Math.round(pts * (kinds === 3 ? 2 : 1.5));
  if (sw) pts = Math.round(pts * 1.25);
  return pts;
}

function scoreTrick(r, airTime, spin, flip, grabTime, grabName) {
  const n180 = Math.round(Math.abs(spin) / Math.PI);
  const nFlip = Math.round(Math.abs(flip) / (Math.PI * 2));
  const parts = [];
  if (nFlip > 0) parts.push(flipName(nFlip, flip));
  if (n180 > 0) parts.push(spinName(n180, spin));
  if (grabTime > GRAB_MIN) parts.push(`${grabName} Grab`);
  if (parts.length === 0 && airTime > 0.8) parts.push("Big Air");
  if (parts.length === 0) return;
  if (r.takeoffSw) parts.unshift("Switch");
  const pts = trickPoints(nFlip, n180, grabTime, airTime, r.takeoffSw);
  r.trickScore += pts;
  if (!r.isPlayer) return;
  sfx.trick();
  // A trick built up in the air already has its list on screen: mark it landed. Otherwise pop it up.
  if (r.called?.any) airTrickEnd("landed", pts);
  else showPopup(parts.join(" + "), `+${pts}`, false);
  announceTrick(parts, pts, r.called?.any);
}

// Riding into a net stops you going further out and you slide along it,
// scrubbing off a little speed for as long as you push into it.
function checkFence(r) {
  const c = center(r.z), d = r.x - c, lim = FENCE_D + widen(r.z) - 0.4;
  if (Math.abs(d) <= lim) return;
  const side = Math.sign(d);
  r.x = c + side * lim;
  const k = centerSlope(r.z), len = Math.hypot(1, k);
  const nx = side / len, nz = (-side * k) / len; // pointing out of the course
  const vn = r.vx * nx + r.vz * nz;
  if (vn > 0) {
    r.vx -= 1.2 * vn * nx; r.vz -= 1.2 * vn * nz;
    r.vx *= 0.995; r.vz *= 0.995;
    // Turn the rider to follow the net, so it guides you rather than wiping you out on landing.
    if (Math.hypot(r.vx, r.vz) > 2) r.heading = Math.atan2(r.vx, r.vz);
  }
  const ground = surfaceAt(r.x, r.z, r.y)[0];
  r.y = r.grounded ? ground : Math.max(r.y, ground);
}

function checkObstacles(r) {
  const key = Math.floor(r.z / BUCKET);
  for (let k = key - 1; k <= key + 1; k++) {
    const list = obstacles.get(k);
    if (!list) continue;
    for (const t of list) {
      const dx = r.x - t.x, dz = r.z - t.z;
      const rad = t.r;
      if (dx * dx + dz * dz >= rad * rad || r.y > t.y + t.h || r.y + 1.7 < t.y + (t.lo || 0)) continue;
      const d = Math.hypot(dx, dz) || 1;
      r.x = t.x + (dx / d) * (rad + 0.05);
      r.z = t.z + (dz / d) * (rad + 0.05);
      r.vx = (dx / d) * 3; r.vz = Math.max(r.vz * 0.15, 1);
      if (!r.finished) crash(r, t.name || "Tree!");
    }
  }
}

// Jump: a quick tap is a lunge, a push forward that gets you moving again when
// you've stalled on a rise. Hold it past TAP_T and it charges an ollie instead,
// which pops when you let go, so a tap never throws you into the air.
const TAP_T = 0.18;       // s: let go sooner than this and it's a tap
const LUNGE = 3.5;        // m/s a lunge adds when you're slow
const LUNGE_COOL = 0.7;   // s before you can lunge again

function lunge(r) {
  const fx = Math.sin(r.heading), fz = Math.cos(r.heading);
  const vf = r.vx * fx + r.vz * fz;
  // Full strength when you're crawling, fading to a nudge at speed.
  const push = LUNGE * Math.max(0.1, 1 - Math.max(0, vf - 3) / 8);
  r.vx += fx * push; r.vz += fz * push;
  r.lungeCool = LUNGE_COOL;
  r.lungeT = 0.25;
  if (r.isPlayer) sfx.lunge();
}

function handleJump(r, inp, h) {
  const ctl = canControl(r);
  const held = inp.jump && ctl;
  r.lungeCool = Math.max(0, r.lungeCool - h);
  r.lungeT = Math.max(0, r.lungeT - h);
  if (held) {
    r.jumpT += h;
    if (r.grounded && r.jumpT > TAP_T) r.charge = Math.min(1, r.charge + h / 0.5);
  } else if (r.jumpPrev && ctl) {
    if (r.jumpT <= TAP_T) {
      if (r.grounded && r.lungeCool <= 0) lunge(r);
    } else if (r.grounded) ollie(r, false);
    // A late pop just after leaving a lip.
    else if (r.airTime < 0.18 && !r.popped) ollie(r, true);
    r.charge = 0;
  }
  if (!held) r.jumpT = 0;
  if (!ctl) r.charge = 0;
  r.jumpPrev = held;
}

// ---------------------------------------------------------------------------
// Crash ragdoll. When you wipe out your body goes limp: it becomes a handful
// of points (hips, shoulders, head, hands, feet) joined by sticks, thrown down
// the hill with the speed you had, sliding on the snow and bouncing off trees,
// posts, walls and the nets. The board comes off and slides away on its own,
// and when you get up you're standing on it again.
// You and the bots are moved by your ragdoll for the whole crash. A rider from
// another browser gets a ragdoll of its own here, nudged toward where that
// browser says they are.
// ---------------------------------------------------------------------------
const CRASH_T = 1.9;          // seconds on the ground before you get up
const RAG_MU = 0.55;         // how much the snow drags on a sliding body...
const BOARD_MU = 0.06;        // ...and on a board with nobody on it
const ARM_LEN = 0.55;
const BOARD_LEN = 1.7;
const RAG_POINTS = [
  // `at` is where the point sits in the upper body's frame (x forward, y up, z to the rider's left).
  { at: [0, 0, 0.28], r: 0.17, m: 3 },     // 0 hip (left)
  { at: [0, 0, -0.28], r: 0.17, m: 3 },    // 1 hip (right)
  { at: [0, 0.56, 0.34], r: 0.15, m: 3 },  // 2 shoulder
  { at: [0, 0.56, -0.34], r: 0.15, m: 3 }, // 3 shoulder
  { at: [0, 0.82, 0], r: 0.2, m: 2 },      // 4 head
  { r: 0.08, m: 1 },                       // 5 hand
  { r: 0.08, m: 1 },                       // 6 hand
  { r: 0.12, m: 1.2 },                     // 7 foot
  { r: 0.12, m: 1.2 },                     // 8 foot
];
// Sticks: [a, b, length, minOnly]. A plain stick holds its length; a minOnly
// one just stops the points getting closer than that, as a rough joint limit.
const RAG_STICKS = (() => {
  const s = [];
  for (let a = 0; a < 5; a++) for (let b = a + 1; b < 5; b++) {
    const [p, q] = [RAG_POINTS[a].at, RAG_POINTS[b].at];
    s.push([a, b, Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]), false]);
  }
  s.push([2, 5, ARM_LEN, false], [3, 6, ARM_LEN, false], [0, 7, LEG_H, false], [1, 8, LEG_H, false]);
  s.push([2, 7, 0.7, true], [3, 8, 0.7, true], [4, 7, 0.85, true], [4, 8, 0.85, true],
    [7, 8, 0.25, true], [4, 5, 0.28, true], [4, 6, 0.28, true]);
  return s;
})();

const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), vD = new THREE.Vector3();
const vSide = new THREE.Vector3(), vY = new THREE.Vector3(), qTmp = new THREE.Quaternion();

function startRag(r, vx, vy, vz) {
  const m = r.model;
  m.root.updateMatrixWorld(true);
  const n = RAG_POINTS.length;
  const p = new Float64Array(n * 3), q = new Float64Array(n * 3);
  const put = (arr, i, v) => { arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z; };
  // The model was last drawn where the rider was at the start of this frame; physics may have moved them on since.
  const d = r.drawnAt || [r.x, r.y, r.z];
  vD.set(r.x - d[0], r.y - d[1], r.z - d[2]);
  for (let i = 0; i < 5; i++) put(p, i, m.upper.localToWorld(vA.fromArray(RAG_POINTS[i].at)).add(vD));
  for (let k = 0; k < 2; k++) {
    put(p, 5 + k, m.arms[k].localToWorld(vA.set(0, -ARM_LEN, 0)).add(vD));
    put(p, 7 + k, m.legs[k].localToWorld(vA.set(0, 0, 0)).add(vD));
  }
  // Throw the body: the feet catch and the top half pitches on down the hill, with a twist to one side.
  const s = Math.hypot(vx, vz), fx = s > 0.5 ? vx / s : 0, fz = s > 0.5 ? vz / s : 1;
  const pitch = Math.min(s * 0.18, 5), side = (Math.random() - 0.5) * 4;
  for (let i = 0; i < n; i++) {
    const top = i >= 2 && i <= 6 ? 1 : 0, foot = i >= 7 ? 1 : 0;
    const wx = vx * 0.85 + fx * (pitch * top - pitch * 0.5 * foot) + fz * side * top;
    const wy = Math.max(vy, 0) * 0.5 + 1.5 * top + 0.5;
    const wz = vz * 0.85 + fz * (pitch * top - pitch * 0.5 * foot) - fx * side * top;
    for (const [k, w] of [[0, wx], [1, wy], [2, wz]]) q[i * 3 + k] = p[i * 3 + k] - w * STEP;
  }
  // The board flies off spinning end over end, and slides away once it lands.
  const bp = new Float64Array(6), bq = new Float64Array(6);
  put(bp, 0, m.pose.localToWorld(vA.set(0, 0.05, BOARD_LEN / 2)).add(vD));
  put(bp, 1, m.pose.localToWorld(vA.set(0, 0.05, -BOARD_LEN / 2)).add(vD));
  const bs = (Math.random() - 0.5) * 4;
  for (let i = 0; i < 2; i++) {
    bq[i * 3] = bp[i * 3] - (vx + fz * bs) * STEP;
    bq[i * 3 + 1] = bp[i * 3 + 1] - (Math.max(vy, 0) + 2.5) * STEP;
    bq[i * 3 + 2] = bp[i * 3 + 2] - (vz - fx * bs) * STEP;
  }
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(m.board.getWorldQuaternion(qTmp));
  // The boots stay on the feet.
  m.boots.forEach((b, k) => { m.legs[k].add(b); b.position.set(0, -LEG_BASE, 0); b.quaternion.identity(); });
  r.rag = {
    p, q, acc: 0, hitT: 0, loud: r.isPlayer,
    board: { p: bp, q: bq, up, spin: (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 8), touch: 0 },
  };
}

function endRag(r) {
  if (!r.rag) return;
  r.rag = null;
  const m = r.model;
  m.boots.forEach((b, k) => { m.board.add(b); b.position.set(0, 0, k ? -0.28 : 0.28); b.quaternion.identity(); });
  m.board.position.set(0, 0, 0); m.board.quaternion.identity();
  m.legs.forEach((l, k) => { l.position.set(0, LEG_BASE, k ? -0.28 : 0.28); l.quaternion.identity(); });
  m.upper.position.set(0, 0, 0); m.upper.quaternion.identity();
  r.snapPose = true;
  snowPuff(r.x, r.y + 0.3, r.z, 30, 1.2);
}

// Verlet: each point's speed is how far it moved last step.
function ragIntegrate(p, q, n, h) {
  const damp = 1 - 0.05 * h;
  for (let o = 0; o < n * 3; o += 3) {
    for (let k = 0; k < 3; k++) {
      const v = (p[o + k] - q[o + k]) * damp;
      q[o + k] = p[o + k];
      p[o + k] += v;
    }
    p[o + 1] -= G_AIR * h * h;
  }
}

function ragStick(p, a, b, len, minOnly, ma, mb) {
  const ao = a * 3, bo = b * 3;
  const dx = p[bo] - p[ao], dy = p[bo + 1] - p[ao + 1], dz = p[bo + 2] - p[ao + 2];
  const d = Math.hypot(dx, dy, dz) || 1e-6;
  if (minOnly && d >= len) return;
  const diff = (d - len) / d, ka = mb / (ma + mb), kb = ma / (ma + mb);
  p[ao] += dx * diff * ka; p[ao + 1] += dy * diff * ka; p[ao + 2] += dz * diff * ka;
  p[bo] -= dx * diff * kb; p[bo + 1] -= dy * diff * kb; p[bo + 2] -= dz * diff * kb;
}

// Keep point i out of the snow, the nets, walls and obstacles, with friction
// and a little bounce. Returns true if it's touching the snow.
function ragCollide(p, q, i, rad, mu, h, rag) {
  const o = i * 3;
  let x = p[o], y = p[o + 1], z = p[o + 2];
  let vx = (x - q[o]) / h, vy = (y - q[o + 1]) / h, vz = (z - q[o + 2]) / h;
  let touch = false;
  const c = center(z), lim = FENCE_D + widen(z) - 0.3, u = x - c;
  if (Math.abs(u) > lim) {
    x = c + Math.sign(u) * lim;
    if (vx * Math.sign(u) > 0) { vx *= -0.3; vz *= 0.9; }
  }
  const key = Math.floor(z / BUCKET);
  for (let k = key - 1; k <= key + 1; k++) {
    const list = obstacles.get(k);
    if (!list) continue;
    for (const t of list) {
      const dx = x - t.x, dz = z - t.z, R = t.r + rad;
      if (dx * dx + dz * dz >= R * R || y - rad > t.y + t.h || y + rad < t.y + (t.lo || 0)) continue;
      const d = Math.hypot(dx, dz) || 1, nx = dx / d, nz = dz / d;
      x = t.x + nx * R; z = t.z + nz * R;
      const vn = vx * nx + vz * nz;
      if (vn < 0) {
        vx -= 1.35 * vn * nx; vz -= 1.35 * vn * nz;
        vx *= 0.8; vz *= 0.8;
        if (rag && vn < -4) ragKnock(rag, t, x, y, z);
      }
    }
  }
  // An ice roof holds up a body that's on top of it (judged from last step's height).
  let [g, roof] = surfaceAt(x, z, q[o + 1] - rad);
  if (y - rad < g) {
    if (!roof && g - y > 1.2) {
      // Deep inside a steep face: it's a wall, so back out the way we came.
      x = q[o]; z = q[o + 2]; vx *= -0.3; vz *= -0.3;
      g = terrainH(x, z);
      if (y - rad < g) y = g + rad;
    } else {
      const [gx, gz] = surfaceGrad(x, z, roof), L = Math.hypot(gx, 1, gz);
      const nx = -gx / L, ny = 1 / L, nz = -gz / L;
      y = g + rad;
      const vn = vx * nx + vy * ny + vz * nz;
      if (vn < 0) {
        const tx = vx - vn * nx, ty = vy - vn * ny, tz = vz - vn * nz;
        const ts = Math.hypot(tx, ty, tz);
        const f = ts > 0 ? Math.max(0, ts + mu * 1.2 * vn) / ts : 0;
        vx = tx * f - 0.15 * vn * nx; vy = ty * f - 0.15 * vn * ny; vz = tz * f - 0.15 * vn * nz;
      }
      touch = true;
    }
  }
  p[o] = x; p[o + 1] = y; p[o + 2] = z;
  q[o] = x - vx * h; q[o + 1] = y - vy * h; q[o + 2] = z - vz * h;
  return touch;
}

// Slamming into something knocks the snow off it.
function ragKnock(rag, t, x, y, z) {
  if (rag.hitT > 0) return;
  rag.hitT = 0.3;
  snowPuff(t.x, t.y + Math.min(t.h, 6) * 0.7, t.z, 40, Math.max(1, t.r * 2));
  snowPuff(x, y, z, 15, 0.5);
  if (rag.loud) sfx.thud();
}

function stepRag(rag, h) {
  const { p, q } = rag, n = RAG_POINTS.length;
  ragIntegrate(p, q, n, h);
  for (let it = 0; it < 4; it++) {
    for (const [a, b, len, minOnly] of RAG_STICKS) ragStick(p, a, b, len, minOnly, RAG_POINTS[a].m, RAG_POINTS[b].m);
  }
  for (let i = 0; i < n; i++) ragCollide(p, q, i, RAG_POINTS[i].r, RAG_MU, h, rag);
  rag.hitT -= h;

  const b = rag.board;
  ragIntegrate(b.p, b.q, 2, h);
  ragStick(b.p, 0, 1, BOARD_LEN, false, 1, 1);
  const t0 = ragCollide(b.p, b.q, 0, 0.05, BOARD_MU, h, null);
  const t1 = ragCollide(b.p, b.q, 1, 0.05, BOARD_MU, h, null);
  ragStick(b.p, 0, 1, BOARD_LEN, false, 1, 1);
  // Which way up the board is: spinning in the air, settling flat (either side up) on the snow.
  vA.set(b.p[0] - b.p[3], b.p[1] - b.p[4], b.p[2] - b.p[5]).normalize();
  if (t0 || t1) {
    const [gx, gz] = grad((b.p[0] + b.p[3]) / 2, (b.p[2] + b.p[5]) / 2);
    vB.set(-gx, 1, -gz).normalize();
    if (b.up.dot(vB) < 0) vB.negate();
    b.up.lerp(vB, 1 - Math.exp(-25 * h));
    b.spin *= Math.exp(-6 * h);
  } else b.up.applyAxisAngle(vA, b.spin * h);
  b.up.addScaledVector(vA, -b.up.dot(vA)).normalize();
}

// You and the bots go where your ragdoll goes.
function syncFromRag(r) {
  const { p, q } = r.rag;
  const x = (p[0] + p[3]) / 2, y = (p[1] + p[4]) / 2, z = (p[2] + p[5]) / 2;
  let vx = 0, vy = 0, vz = 0;
  for (let o = 0; o < 15; o += 3) { vx += p[o] - q[o]; vy += p[o + 1] - q[o + 1]; vz += p[o + 2] - q[o + 2]; }
  const [g, roof] = surfaceAt(x, z, y - 0.6);
  r.x = x; r.z = z;
  r.grounded = y - g < 0.6;
  r.roof = r.grounded ? roof : null;
  r.y = r.grounded ? g : y - 0.4;
  r.vx = vx / (5 * STEP); r.vy = vy / (5 * STEP); r.vz = vz / (5 * STEP);
  r.groundVy = 0;
  r.slip = Math.hypot(r.vx, r.vz);
}

// Another browser's rider: run the ragdoll here, nudged toward where they really are.
function driveRemoteRag(r, dt) {
  const rag = r.rag;
  rag.acc = Math.min(rag.acc + dt, STEP * 12);
  while (rag.acc >= STEP) { rag.acc -= STEP; stepRag(rag, STEP); }
  const { p, q } = rag;
  const k = 1 - Math.exp(-4 * dt);
  const dx = (r.x - (p[0] + p[3]) / 2) * k, dz = (r.z - (p[2] + p[5]) / 2) * k;
  for (let o = 0; o < p.length; o += 3) { p[o] += dx; q[o] += dx; p[o + 2] += dz; q[o + 2] += dz; }
}

// Pose the model from the ragdoll. The root sits at the world origin, so the
// pose group's space is world space.
const mBasis = new THREE.Matrix4(), qLimb = new THREE.Quaternion(), qUpper = new THREE.Quaternion();
const bX = new THREE.Vector3(), bZ = new THREE.Vector3();
// A rotation whose local y is `y` (a unit vector) and whose local z is as close to `zHint` as it can be.
function basisQuat(out, y, zHint) {
  bZ.copy(zHint).addScaledVector(y, -zHint.dot(y));
  if (bZ.lengthSq() < 1e-8) bZ.set(y.y, y.z, y.x).addScaledVector(y, -y.dot(bZ));
  bZ.normalize();
  bX.crossVectors(y, bZ);
  return out.setFromRotationMatrix(mBasis.makeBasis(bX, y, bZ));
}
const ragPt = (p, i, v) => v.set(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]);

function poseRag(r) {
  const m = r.model, { p } = r.rag;
  m.root.position.set(0, 0, 0); m.root.quaternion.identity();
  m.pose.rotation.set(0, 0, 0);
  const hip = ragPt(p, 0, vA).add(ragPt(p, 1, vB)).multiplyScalar(0.5);
  vSide.copy(ragPt(p, 0, vB)).sub(ragPt(p, 1, vC));
  const sh = ragPt(p, 2, vC).add(ragPt(p, 3, vD)).multiplyScalar(0.5);
  vSide.add(ragPt(p, 2, vD)).sub(ragPt(p, 3, vB));
  vY.copy(sh).sub(hip).normalize();
  basisQuat(qUpper, vY, vSide);
  m.upper.position.copy(hip);
  m.upper.quaternion.copy(qUpper);
  for (let k = 0; k < 2; k++) {
    // Arms hang along their local -y, legs stand along their local +y.
    vY.copy(ragPt(p, 2 + k, vB)).sub(ragPt(p, 5 + k, vC)).normalize();
    basisQuat(qLimb, vY, vSide);
    m.arms[k].quaternion.copy(qUpper).invert().multiply(qLimb);
    const foot = ragPt(p, 7 + k, vB);
    vY.copy(ragPt(p, k, vC)).sub(foot).normalize();
    m.legs[k].position.copy(foot);
    m.legs[k].quaternion.copy(basisQuat(qLimb, vY, vSide));
    m.legs[k].scale.y = 1;
  }
  const b = r.rag.board;
  vA.set(b.p[0] - b.p[3], b.p[1] - b.p[4], b.p[2] - b.p[5]).normalize();
  basisQuat(qLimb, b.up, vA);
  m.board.quaternion.copy(qLimb);
  m.board.position.set((b.p[0] + b.p[3]) / 2, (b.p[1] + b.p[4]) / 2, (b.p[2] + b.p[5]) / 2).addScaledVector(b.up, -0.05);
}

function stepRider(r, h, inp) {
  r.inp = inp;
  handleJump(r, inp, h);
  if (r.rag) {
    stepRag(r.rag, h);
    syncFromRag(r);
  } else {
    if (r.grounded) groundStep(r, h, inp); else airStep(r, h, inp);
    checkObstacles(r);
    checkFence(r);
  }
  if (r.crashT > 0) {
    r.crashT -= h;
    r.crashSpin += h * 9;
    if (r.crashT <= 0) recover(r);
  }
  if (!r.finished && r.z >= COURSE_LEN) {
    r.finished = true;
    r.finishTime = raceTime;
    if (r.isPlayer) sfx.finish();
    if (resultsShown) renderResults();
  }
}

// Finished riders by finishing time, then everyone else by distance down the hill.
function standings() {
  return [...riders].sort((a, b) =>
    a.finished !== b.finished ? (a.finished ? -1 : 1) : a.finished ? a.finishTime - b.finishTime : b.z - a.z);
}

// ---------------------------------------------------------------------------
// Bots. A bot only produces controls, exactly like the keyboard does.
// ---------------------------------------------------------------------------
function predictAirTime(r) {
  let { x, y, z, vx, vy, vz } = r, t = 0;
  const dt = 1 / 60;
  while (t < 5) {
    vy -= G_AIR * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
    if (y <= terrainH(x, z)) break;
  }
  return t;
}

function planTrick(r, b) {
  const left = predictAirTime(r);
  // Weaker bots leave a bigger margin, but sometimes try more than they have time for.
  const greedy = Math.random() < 0.3 * (1 - b.skill);
  const avail = left - (0.3 - 0.2 * b.skill) + (greedy ? 0.45 : 0);
  if (avail < 0.35) return null;
  const flipTime = (Math.PI * 2) / FLIP_RATE, halfSpin = Math.PI / SPIN_RATE;
  let flips = 0;
  if (avail > flipTime && Math.random() < 0.3 + 0.45 * b.skill) flips = avail > flipTime * 2 && Math.random() < b.skill - 0.4 ? 2 : 1;
  const maxHalves = Math.min(6, Math.floor(avail / halfSpin));
  const halves = Math.round(maxHalves * Math.random() * (0.5 + 0.5 * b.skill) + (flips ? 0 : 0.3));
  const end = r.airTime + left;
  return {
    spin: halves * Math.PI, spinDir: Math.random() < 0.5 ? 1 : -1,
    flip: flips * Math.PI * 2, flipDir: Math.random() < 0.65 ? -1 : 1,
    grab: Math.random() < 0.55, grabFrom: r.airTime + 0.1, grabTo: end - (greedy ? 0.1 : 0.3),
  };
}

// The nearest obstacle within reach of the straight line from the bot to its
// target, and a point to pass it on whichever side the line already favours.
function botDodge(r, tx, look) {
  const z0 = r.z + 1, z1 = r.z + look + 8;
  let hit = null;
  for (let k = Math.floor(z0 / BUCKET); k <= Math.floor(z1 / BUCKET); k++) {
    for (const o of obstacles.get(k) || []) {
      if (o.z < z0 || o.z > z1 || o.lo) continue;
      const d = o.z - r.z;
      const px = r.x + (tx - r.x) * Math.min(1, d / look);
      if (Math.abs(px - o.x) < o.r + 1.4 && (!hit || d < hit.d)) hit = { o, d, px };
    }
  }
  if (!hit) return null;
  const s = Math.sign(hit.px - hit.o.x) || 1;
  return { x: hit.o.x + s * (hit.o.r + 2.2), d: Math.max(4, hit.d) };
}

function botControls(r, h) {
  const b = r.bot;
  const inp = { left: false, right: false, tuck: false, brake: false, grab: false, jump: false };
  if (!canControl(r)) return inp;
  b.t += h;

  if (!r.grounded) {
    if (!b.plan && r.airTime > 0.04) b.plan = planTrick(r, b) || { spin: 0, flip: 0, grab: false };
    const p = b.plan;
    if (!p) return inp;
    if (Math.abs(r.spin) < p.spin - SPIN_RATE * h * 0.5) inp[p.spinDir > 0 ? "left" : "right"] = true;
    if (Math.abs(r.flip) < p.flip - FLIP_RATE * h * 0.5) inp[p.flipDir > 0 ? "tuck" : "brake"] = true;
    inp.grab = p.grab && r.airTime > p.grabFrom && r.airTime < p.grabTo;
    return inp;
  }
  b.plan = null;

  // Pick the next kicker and decide how to ride it.
  let idx = kickers.findIndex((k) => k.z > r.z - 1);
  if (idx !== b.kickIdx) {
    b.kickIdx = idx;
    b.goKick = Math.random() < 0.5 + 0.45 * b.skill;
    b.kickOff = (Math.random() - 0.5) * 3;
    b.popAt = 0.3 + Math.random() * 1.6 * (1 - b.skill);
  }
  const k = kickers[idx];
  const toKick = k ? k.z - r.z : Infinity;
  const speed = Math.hypot(r.vx, r.vz);

  // Steer toward a point a little way down the run, or at the kicker.
  const look = Math.max(7, speed * 0.7);
  let tx = center(r.z + look) + 5 * Math.sin(b.t * 0.25 + b.phase);
  if (k && b.goKick && toKick < 40) tx = k.x + b.kickOff;
  // Where the run splits into routes (round an island, over a bridge, through a
  // cave), commit to the nearest one when we first see it.
  const lane = lanes.find((l) => r.z + look > l.z0 - 30 && r.z < l.z1);
  if (lane) {
    if (b.lane !== lane) {
      const u = r.x - center(r.z);
      b.lane = lane;
      b.laneU = lane.opts.reduce((p, q) => (Math.abs(q - u) < Math.abs(p - u) ? q : p));
    }
    tx = center(r.z + look) + b.laneU;
  }
  // Steer round the nearest obstacle on the line we're about to take.
  let aimD = look;
  const dodge = botDodge(r, tx, look);
  if (dodge) { tx = dodge.x; aimD = dodge.d; }
  const err = wrapAngle(Math.atan2(tx - r.x, aimD) - r.heading);
  if (err > 0.04) inp.left = true;
  else if (err < -0.04) inp.right = true;

  const vmax = 19 + 11 * b.skill;
  if (speed > vmax || (Math.abs(err) > 0.6 && speed > 12)) inp.brake = true;
  else if (Math.abs(err) < 0.25) inp.tuck = true;

  // Charge an ollie on the ramp and pop just before the lip. Start far enough
  // out that it's a hold, not a tap, even at full speed.
  inp.jump = !!(k && b.goKick && toKick < 12 && toKick > b.popAt && Math.abs(r.x - k.x) < KICK_HALF);
  // Stalled on a rise: tap jump to lunge forward.
  b.stuckT = speed < 3 && !inp.jump ? (b.stuckT || 0) + h : 0;
  if (b.stuckT > 0.6) { b.tapT = 0.08; b.stuckT = 0; }
  if (b.tapT > 0) { b.tapT -= h; inp.jump = true; }
  return inp;
}

function startRace(roster = soloRoster()) {
  closeMenu();
  stopAttract();
  initAudio();
  speech?.cancel();
  setRoster(roster);
  clearSpray();
  clearTrails();
  airTrickClear();
  raceTime = 0; simAcc = 0; netAcc = 0;
  resultsShown = false; result = null;
  countT = 3; lastCount = 4;
  state = "countdown";
  panel.classList.add("hidden");
  restartBtn.style.display = net.role === "client" ? "none" : "";
  leaveTopBtn.style.display = net.role ? "" : "none";
  snapCamera();
}

// R, Restart and "Ride again": a solo race restarts at once; in a lobby only the host can restart.
function requestRestart() {
  if (!net.role) startRace();
  else if (net.role === "host") hostStart();
}

// Attract mode: behind the menus everyone, you included, rides the picked
// course on autopilot, and the camera follows you from in front. Your rider is
// flagged as a bot meanwhile, so none of the race's sounds or callouts play.
let attract = false, attractT = 0;
function startAttract() {
  if (attract || state !== "menu" || net.role) return;
  attract = true;
  me.isPlayer = false;
  me.bot = { skill: 0.9 };
  restartAttract();
}
function restartAttract() {
  for (const r of riders) { resetRider(r); updateRider(r, 1); }
  clearSpray(); clearTrails();
  raceTime = 0; simAcc = 0;
  snapCamera();
}
function stopAttract() {
  if (!attract) return;
  attract = false;
  me.isPlayer = true;
  me.bot = null;
  for (const r of riders) { resetRider(r); updateRider(r, 1); }
  clearSpray(); clearTrails();
  raceTime = 0; simAcc = 0;
  snapCamera();
}

function emitRiderSpray(dt) {
  for (const r of riders) emitSpray(r, dt);
}

function update(dt) {
  const keysIn = readInput();
  if (attract) {
    simAcc += dt;
    while (simAcc >= STEP) {
      simAcc -= STEP;
      raceTime += STEP;
      for (const r of riders) stepRider(r, STEP, botControls(r, STEP));
    }
    emitRiderSpray(dt);
    if (me.z > COURSE_LEN + 30 || attractT > 150 * COURSE_LEN / SECTION_LEN) restartAttract();
  }
  // The menu camera drifts on every menu screen, the lobby included.
  const menuCam = attract || menuOpen();
  if (menuCam) attractT += dt;
  if (state === "countdown") {
    countT -= dt;
    const c = Math.ceil(countT);
    if (c !== lastCount && c > 0) { lastCount = c; sfx.count(); countEl.textContent = c; }
    if (countT <= 0) { state = "run"; sfx.go(); countEl.textContent = "GO!"; setTimeout(() => { if (countEl.textContent === "GO!") countEl.textContent = ""; }, 700); }
  }
  if (state === "run") {
    simAcc += dt;
    while (simAcc >= STEP) {
      simAcc -= STEP;
      raceTime += STEP;
      for (const r of riders) if (!r.remote) stepRider(r, STEP, r.bot ? botControls(r, STEP) : keysIn);
    }
    for (const r of riders) if (r.remote) { followNet(r, dt); if (r.rag) driveRemoteRag(r, dt); }
    netTick(dt);
    if (me.finished && !resultsShown && raceTime - me.finishTime > 1.6) showResults();
    emitRiderSpray(dt);
  }
  for (const r of riders) updateRider(r, dt);
  flushTrails();
  updateSpray(dt);
  if (menuCam) updateAttractCamera(dt); else updateCamera(dt);
  updateWeather(dt);
  levelTime += dt;
  levelTick?.(levelTime);
  updateHUD();
  updateAudio(Math.hypot(me.vx, me.vz), me.slip);
}

// ---------------------------------------------------------------------------
// Rider pose and camera
// ---------------------------------------------------------------------------
const UP = new THREE.Vector3(0, 1, 0);
const vN = new THREE.Vector3(), qa = new THREE.Quaternion(), qy = new THREE.Quaternion();
const qf = new THREE.Quaternion(), flipAxis = new THREE.Vector3();

function updateRider(r, dt) {
  const m = r.model, inp = r.inp;
  if (r.rag) {
    poseRag(r);
    if (r.tag) r.tag.position.set(r.x, r.y + 2.5, r.z);
    updateGear(r, dt);
    updateTrail(r);
    return;
  }
  m.root.position.set(r.x, r.y, r.z);
  (r.drawnAt ??= [0, 0, 0]).splice(0, 3, r.x, r.y, r.z);
  if (r.grounded) {
    const [gx, gz] = surfaceGrad(r.x, r.z, r.roof);
    vN.set(-gx, 1, -gz).normalize();
  } else vN.copy(UP);
  qa.setFromUnitVectors(UP, vN);
  qy.setFromAxisAngle(UP, r.heading + (r.sw ? Math.PI : 0) + r.spin);
  qa.multiply(qy);
  if (r.flip !== 0) {
    // Flip about the world axis across the takeoff direction, applied on top of the spin.
    const s = Math.sin(r.flipYaw), c = Math.cos(r.flipYaw);
    flipAxis.set(c, 0, -s);
    qf.setFromAxisAngle(flipAxis, r.flip);
    qa.premultiply(qf);
    // Pivot about the rider's middle so the body doesn't swing through the snow.
    const fs = Math.sin(r.flip), fc = Math.cos(r.flip);
    m.root.position.x -= FLIP_PIVOT * fs * s;
    m.root.position.z -= FLIP_PIVOT * fs * c;
    m.root.position.y += FLIP_PIVOT * (1 - fc);
  }
  // Straight after getting up from a crash, stand up at once rather than swinging up from the ragdoll's frame.
  m.root.quaternion.slerp(qa, r.snapPose ? 1 : 1 - Math.exp(-(r.grounded ? 14 : 40) * dt));
  r.snapPose = false;
  if (r.tag) r.tag.position.set(r.x, r.y + 2.5, r.z);

  const ctl = canControl(r);
  const speed = Math.hypot(r.vx, r.vz);
  const steer = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  const leanT = r.grounded && ctl ? steer * 0.38 * Math.min(1, speed / 12) * (r.sw ? -1 : 1) : 0;
  r.lean += (leanT - r.lean) * (1 - Math.exp(-8 * dt));
  let crouchT = 0.1;
  if (r.charge > 0) crouchT = 0.3 + 0.5 * r.charge;
  else if (r.lungeT > 0) crouchT = 0.55; // a quick dip as you push off
  else if (r.grabbing) crouchT = 0.75;
  else if (!r.grounded && ctl && (inp.tuck || inp.brake)) crouchT = 0.65;
  else if (ctl && inp.tuck && r.grounded) crouchT = 0.6;
  else if (!r.grounded) crouchT = 0.3;
  r.crouch += (crouchT - r.crouch) * (1 - Math.exp(-12 * dt));

  m.pose.rotation.set(r.crashT > 0 ? r.crashSpin : 0, 0, r.lean);
  const legScale = 1 - 0.45 * r.crouch;
  m.legs.forEach((l) => (l.scale.y = legScale));
  m.upper.position.y = LEG_BASE + LEG_H * legScale;
  m.upper.rotation.z = -r.crouch * 0.35;
  const reach = r.grabbing ? 1.1 : 0;
  m.arms[0].rotation.set(0.35 - reach * 0.2, 0, reach);
  m.arms[1].rotation.set(-0.35 + reach * 0.2, 0, reach * 0.3);
  updateGear(r, dt);
  updateTrail(r);
}

let camYaw = 0;
const camTarget = new THREE.Vector3();
function updateCamera(dt, snap = false) {
  const speed = Math.hypot(me.vx, me.vz);
  const want = speed > 2 ? Math.atan2(me.vx, me.vz) : me.heading;
  camYaw = snap ? want : camYaw + wrapAngle(want - camYaw) * (1 - Math.exp(-3 * dt));
  const back = 8.5 + Math.min(speed, 35) * 0.06;
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  camTarget.set(me.x - fx * back, me.y + 4.2, me.z - fz * back);
  if (snap) camera.position.copy(camTarget);
  else camera.position.lerp(camTarget, 1 - Math.exp(-6 * dt));
  camera.position.y = Math.max(camera.position.y, terrainH(camera.position.x, camera.position.z) + 1.5);
  camera.lookAt(me.x + fx * 4, me.y + 1.2, me.z + fz * 4);
  camera.fov = 62 + Math.min(speed, 40) * 0.3;
  camera.updateProjectionMatrix();

  sun.position.set(me.x - 25, me.y + 45, me.z - 15);
  sun.target.position.set(me.x, me.y, me.z);
  backdrop.position.copy(camera.position);
  riderLight.position.set(me.x, me.y + 3, me.z - 1.5);
}
// In attract mode this also restarts the attract camera's drift.
let attractSnap = false;
function snapCamera() {
  if (attract) { attractSnap = true; attractT = 0; }
  updateCamera(0, true);
}

// Behind the menus (and the lobby, where nobody's moving): low and in front of you, looking back up at you as you
// ride, drifting from one side to the other.
let attractYaw = 0;
const attractCam = new THREE.Vector3();
function updateAttractCamera(dt) {
  const snap = attractSnap;
  attractSnap = false;
  const speed = Math.hypot(me.vx, me.vz);
  const want = speed > 2 ? Math.atan2(me.vx, me.vz) : me.heading;
  attractYaw = snap ? want : attractYaw + wrapAngle(want - attractYaw) * (1 - Math.exp(-1.5 * dt));
  const a = attractYaw + Math.PI * 0.82 + Math.sin(attractT * 0.12) * 0.45;
  // Standing still in the lobby, pull back down the hill to take in the whole start gate.
  const dist = (attract ? 8.5 : 17) + Math.sin(attractT * 0.21) * 1.5;
  // Rigidly tied to you (the turning is what's smoothed), so you never overtake it.
  attractCam.set(me.x + Math.sin(a) * dist, me.y + (attract ? 2.2 : 1.5), me.z + Math.cos(a) * dist);
  camera.position.copy(attractCam);
  camera.position.y = Math.max(camera.position.y, terrainH(camera.position.x, camera.position.z) + 1.2);
  camera.lookAt(me.x, me.y + 1.1, me.z);
  camera.fov = 55;
  camera.updateProjectionMatrix();
  sun.position.set(me.x - 25, me.y + 45, me.z - 15);
  sun.target.position.set(me.x, me.y, me.z);
  backdrop.position.copy(camera.position);
  riderLight.position.set(me.x, me.y + 3, me.z - 1.5);
}

// ---------------------------------------------------------------------------
// HUD and panels
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const timeEl = $("time"), speedEl = $("speed"), tricksEl = $("tricks"), posEl = $("pos");
const countEl = $("count"), popupEl = $("popup"), chargeEl = $("charge");
const panel = $("panel"), card = $("card"), muteBtn = $("mute"), musicBtn = $("music"), voiceBtn = $("voice"), restartBtn = $("restart"), leaveTopBtn = $("leave-lobby");
const fmt = (n) => n.toLocaleString("en-US");
const ordinal = (n) => n + (n > 3 && n < 21 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

// Race time as 1'05"42: minutes, seconds, hundredths.
function fmtRaceTime(t) {
  const cs = Math.floor(t * 100);
  return `${Math.floor(cs / 6000)}'${String(Math.floor(cs / 100) % 60).padStart(2, "0")}"${String(cs % 100).padStart(2, "0")}`;
}

let hudPlace = 0;
function updateHUD() {
  const racing = state === "countdown" || state === "run";
  document.body.classList.toggle("racing", racing);
  chargeEl.style.opacity = me.charge > 0 ? 1 : 0;
  chargeEl.firstElementChild.style.width = `${me.charge * 100}%`;
  if (!racing) return;
  timeEl.textContent = fmtRaceTime(me.finished ? me.finishTime : raceTime);
  speedEl.textContent = Math.round(Math.hypot(me.vx, me.vz) * 3.6);
  tricksEl.textContent = fmt(me.trickScore);
  updateAirTrick();
  const place = standings().indexOf(me) + 1;
  if (place !== hudPlace) {
    hudPlace = place;
    const suffix = ordinal(place).slice(String(place).length);
    posEl.innerHTML = `${place}<small>${suffix}</small>`;
  }
  drawMap(place);
}

// The course map: the run's line from S (start) at the bottom to G (goal) at
// the top, a dot for each rider, and a bigger marker with your place for you.
const mapCanvas = $("map"), mapCtx = mapCanvas.getContext("2d");
let mapPath = null; // [{ x, y }] in 0..1 across, 0 (start) .. 1 (goal) up; rebuilt per course
function mapPoint(z) {
  const t = Math.min(1, Math.max(0, z / COURSE_LEN));
  const i = t * (mapPath.length - 1), a = Math.floor(i), b = Math.min(mapPath.length - 1, a + 1), f = i - a;
  return { x: mapPath[a].x + (mapPath[b].x - mapPath[a].x) * f, y: t };
}
function drawMap(place) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = mapCanvas.clientWidth, ch = mapCanvas.clientHeight;
  if (mapCanvas.width !== Math.round(cw * dpr) || mapCanvas.height !== Math.round(ch * dpr)) {
    mapCanvas.width = Math.round(cw * dpr); mapCanvas.height = Math.round(ch * dpr);
  }
  if (!mapPath || mapPath.level !== levelId) {
    // The line's wiggle, scaled so the widest bend just fits.
    const pts = [];
    let maxAbs = 1;
    const n = Math.round(COURSE_LEN / 20);
    for (let i = 0; i <= n; i++) { const c = center((i / n) * COURSE_LEN); pts.push(c); maxAbs = Math.max(maxAbs, Math.abs(c)); }
    mapPath = pts.map((c) => ({ x: 0.5 + (c / maxAbs) * 0.28 }));
    mapPath.level = levelId;
  }
  const g = mapCtx, pad = 13 * dpr, W = mapCanvas.width, H = mapCanvas.height;
  const px = (p) => p.x * W, py = (p) => H - pad - p.y * (H - pad * 2);
  g.clearRect(0, 0, W, H);
  g.lineCap = g.lineJoin = "round";
  for (const [width, color] of [[9 * dpr, "#0b3a35"], [5.5 * dpr, "#21b39d"]]) {
    g.beginPath();
    mapPath.forEach((p, i) => { const q = { x: p.x, y: i / (mapPath.length - 1) }; i ? g.lineTo(px(q), py(q)) : g.moveTo(px(q), py(q)); });
    g.lineWidth = width; g.strokeStyle = color; g.stroke();
  }
  const disc = (p, r, fill, text, textColor = "#fff") => {
    g.beginPath(); g.arc(px(p), py(p), r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill();
    g.lineWidth = 2 * dpr; g.strokeStyle = "#0b2520"; g.stroke();
    if (text) {
      g.fillStyle = textColor; g.font = `italic 900 ${Math.round(r * 1.25)}px system-ui, sans-serif`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(text, px(p), py(p) + r * 0.06);
    }
  };
  disc({ x: mapPath[0].x, y: 0 }, 10 * dpr, "#1a9c88", "S");
  disc({ x: mapPath[mapPath.length - 1].x, y: 1 }, 10 * dpr, "#1a9c88", "G");
  for (const r of riders) if (r !== me) disc(mapPoint(r.z), 4.5 * dpr, (LOOKS[r.look] || LOOKS[0]).tagColor);
  disc(mapPoint(me.z), 9 * dpr, "#ffb02e", String(place), "#3d2400");
}

// The in-air trick list (see #air). It builds up while you're in the air, then
// turns green with your points if you land it, or red and struck out if you crash.
const airEl = $("air"), airLbl = $("air-lbl"), airVal = $("air-val"), airList = $("air-list");
let airLive = false, airTimer = 0;
function airTrickAdd(r, part) {
  if (!airLive) {
    airLive = true;
    clearTimeout(airTimer);
    airList.replaceChildren();
    airEl.classList.remove("landed", "lost");
    airEl.classList.add("show");
    airLbl.textContent = "TRICK";
    if (r.takeoffSw) airTrickLine("Switch");
  }
  airTrickLine(part);
}
function airTrickLine(text) {
  const li = document.createElement("li");
  li.textContent = text;
  airList.append(li);
}
function airTrickEnd(outcome, pts) {
  if (!airLive) return;
  airLive = false;
  airEl.classList.add(outcome);
  airLbl.textContent = outcome === "landed" ? "LANDED" : "LOST";
  if (pts != null) airVal.textContent = `+${fmt(pts)}`;
  airTimer = setTimeout(() => airEl.classList.remove("show"), 1400);
}
function airTrickClear() {
  airLive = false;
  clearTimeout(airTimer);
  airEl.classList.remove("show", "landed", "lost");
}
// While you're in the air, the points you'd get for landing right now.
function updateAirTrick() {
  if (!airLive) return;
  // Touched down without the trick being scored (finishing mid-air, say): it doesn't count.
  if (me.grounded) return airTrickEnd("lost");
  const c = me.called;
  airVal.textContent = fmt(trickPoints(c.flip, c.spin, c.grab ? me.grabTime : 0, me.airTime, me.takeoffSw));
}

// A screen that's a stack of big chrome words: Up/Down to choose, Enter to pick.
// `items` are { label, desc, go }. `top` is extra HTML above the list (a name box).
function listScreen({ head, items, back, top = "", message = "" }) {
  const screen = {
    kind: "list", sel: 0, count: items.length,
    select(i) {
      screen.sel = (i + items.length) % items.length;
      mBody.querySelectorAll(".m-item").forEach((b, j) => b.classList.toggle("sel", j === screen.sel));
      $("m-desc").textContent = items[screen.sel].desc || "";
    },
    nav(dx, dy) { if (dy) screen.select(screen.sel + dy); return !!dy; },
    go() { items[screen.sel].go(); },
    back,
  };
  openMenu(screen, {
    head, back,
    hint: "↑ ↓ Choose · Enter Select" + (back ? " · Esc Back" : ""),
    body: `${top}${errLine(message)}
      <div class="m-list">${items.map((it, i) => `<button class="m-item chrome" data-i="${i}">${esc(it.label)}</button>`).join("")}</div>
      <p class="m-desc" id="m-desc"></p>`,
  });
  mBody.querySelectorAll(".m-item").forEach((b) => {
    const i = Number(b.dataset.i);
    b.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") screen.select(i); });
    b.addEventListener("click", () => { screen.select(i); screen.go(); });
  });
  screen.select(0);
  return screen;
}

// --- Course picker: a lift pass for each course, laid out on a table ---------
// Each pass shows the course's own line from start to finish, in its colours.
function courseLineSVG(c, len) {
  const N = Math.round(len / 35);
  const xs = [];
  for (let i = 0; i <= N; i++) {
    const z = (i / N) * len;
    let x = c.a1 * Math.sin(z / c.p1 + c.o1) + c.a2 * Math.sin(z / c.p2 + c.o2);
    if (c.tight && z < c.tight.z1) x += c.tight.a * Math.sin(z / c.tight.p) * (1 - smooth(z / c.tight.z1));
    xs.push(x);
  }
  const max = Math.max(1, ...xs.map(Math.abs));
  const pts = xs.map((x, i) => `${(50 + (x / max) * 20).toFixed(1)},${(88 - (i / N) * 76).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts.split(" ")[0].split(",")[0]}" cy="88" r="5" fill="#fff"/><circle cx="${pts.split(" ").at(-1).split(",")[0]}" cy="12" r="5" fill="#fff"/>
  </svg>`;
}
const hexColor = (n) => `#${n.toString(16).padStart(6, "0")}`;
function liftPass(id) {
  const L = LEVELS[id], [c1, c2] = L.furniture.banners;
  return `<div class="pass" style="--c1:${c1};--c2:${c2};--sky:${hexColor(L.sky)};--fog:${hexColor(L.fog[0])}">
      <div class="p-hole"></div>
      <div class="p-scene">
        <svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,40 0,30 16,12 27,22 46,3 63,20 76,10 100,30 100,40" fill="rgba(255,255,255,0.92)"/></svg>
      </div>
      <div class="p-badge">${courseLineSVG(L.course, SECTION_LEN * (L.sections ?? 1))}</div>
      <div class="p-name">${esc(L.name)}</div>
      <div class="p-pass">LIFT PASS</div>
      <div class="p-stub">No. ${String(L.seed).padStart(5, "0")}</div>
    </div>`;
}

let coursePreview = 0;
// The highlighted course is built behind the menu; `go` runs once one is picked.
function courseScreen({ head, go, back, note = "" }) {
  const screen = {
    kind: "courses", sel: Math.max(0, LEVEL_IDS.indexOf(levelId)), count: LEVEL_IDS.length,
    select(i) {
      screen.sel = Math.max(0, Math.min(LEVEL_IDS.length - 1, i));
      const id = LEVEL_IDS[screen.sel];
      mBody.querySelectorAll(".m-card").forEach((el, j) => {
        const off = j - screen.sel;
        el.style.setProperty("--off", off);
        el.style.setProperty("--abs", Math.abs(off));
        el.classList.toggle("sel", off === 0);
      });
      $("m-desc").textContent = LEVELS[id].blurb + (note ? ` ${note}` : "");
      // Build the course behind the menu once the choice settles.
      clearTimeout(coursePreview);
      coursePreview = setTimeout(() => setLevel(id), 280);
    },
    nav(dx) {
      const i = Math.max(0, Math.min(LEVEL_IDS.length - 1, screen.sel + dx));
      if (i === screen.sel) return false;
      screen.select(i);
      return true;
    },
    go() { clearTimeout(coursePreview); setLevel(LEVEL_IDS[screen.sel]); go(); },
    back,
  };
  openMenu(screen, {
    head, back, go: "Race",
    hint: "← → Choose · Enter Select · Esc Back",
    body: `<div class="m-cards">${LEVEL_IDS.map((id, i) => {
        const b = bestFor(id);
        return `<div class="m-card" data-i="${i}">
          <div class="m-label chrome">${esc(LEVELS[id].name)}</div>
          <div class="m-sub chrome">${b ? `BEST ${fmt(b)}` : "NO RUNS YET"}</div>
          ${liftPass(id)}
        </div>`;
      }).join("")}</div>
      <p class="m-desc" id="m-desc"></p>`,
  });
  mBody.querySelectorAll(".m-card").forEach((el) => {
    const i = Number(el.dataset.i);
    el.addEventListener("click", () => (i === screen.sel ? screen.go() : screen.select(i)));
  });
  screen.select(screen.sel);
  return screen;
}

const MENU_DIRS = {
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
// Keys on the menu screens. Returns true when the key was the menu's.
function menuKey(e) {
  if (!menuOpen()) return false;
  const k = e.code, inInput = e.target instanceof HTMLInputElement;
  if (inInput && (k === "KeyA" || k === "KeyD" || k === "KeyW" || k === "KeyS" || k === "Space")) return true; // typing
  const dir = MENU_DIRS[k];
  if (dir) {
    e.preventDefault();
    if (inInput) e.target.blur();
    if (menu.nav?.(...dir)) sfx.menu();
    return true;
  }
  if (e.repeat) return true;
  if (k === "Enter" || k === "NumpadEnter" || (k === "Space" && !inInput)) {
    e.preventDefault();
    if (inInput && e.target.id === "name") { e.target.blur(); return true; }
    menu.go?.();
    return true;
  }
  if (k === "Escape") {
    e.preventDefault();
    if (inInput) e.target.blur();
    menu.back?.();
    return true;
  }
  return inInput;
}

const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const fmtClock = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

// Clearing takes two presses so a stray tap can't wipe the list.
function showScores(confirming = false) {
  const list = loadScores();
  const rows = list.map((s, i) => `
      <tr><td class="rank">${i + 1}</td><td class="num"><strong>${fmt(s.score)}</strong><span class="sub">${s.time.toFixed(2)} s</span></td>
      <td>${s.place && s.riders ? `${ordinal(s.place)} of ${s.riders}` : "–"}${s.mode === "lobby" ? '<span class="sub">lobby</span>' : ""}</td>
      <td>${esc(LEVELS[s.level].name)}</td>
      <td>${esc(fmtDate(s.date))}<span class="sub">${esc(fmtClock(s.date))}</span></td></tr>`).join("");
  const clear = () => {
    if (!list.length) return;
    if (!confirming) return showScores(true);
    store.set(SCORES_KEY, "[]");
    for (const id of LEVEL_IDS) store.set(bestKey(id), "0");
    best = 0;
    showScores();
  };
  // Enter shouldn't wipe the list: only the button does.
  openMenu({ kind: "scores", button: clear, back: () => showMenu() }, {
    head: "HIGH SCORES", back: () => showMenu(), go: list.length ? (confirming ? "Press again to clear" : "Clear history") : "",
    hint: "Esc Back",
    body: list.length
      ? `<div class="m-scores"><table>
          <tr><th></th><th class="num">Score · time</th><th>Place</th><th>Course</th><th>Date</th></tr>${rows}
        </table></div>`
      : `<p class="m-desc">No finished runs yet. Your ${MAX_SCORES} best scores will show up here, with the date you set them.</p>`,
  });
}
