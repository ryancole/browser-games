    // up a steep bank slows you down instead of handing out free speed.
    const [gx2, gz2] = grad(nx, nz);

  const n180 = Math.round(Math.abs(spin) / Math.PI);
  const nFlip = Math.round(Math.abs(flip) / (Math.PI * 2));
  const parts = [];
  let pts = 0;
  if (nFlip > 0) {
    const i = Math.min(nFlip, FLIP_POINTS.length - 1);
    parts.push(`${FLIP_COUNT[nFlip] ?? nFlip + "x "}${flip > 0 ? "Frontflip" : "Backflip"}`);
    pts += FLIP_POINTS[i];
  }
  if (n180 > 0) {
    parts.push(`${spin > 0 ? "Frontside" : "Backside"} ${n180 * 180}`);
    pts += SPIN_POINTS[Math.min(n180, SPIN_POINTS.length - 1)];
  }
  if (grabTime > 0.12) {
    parts.push(`${grabName} Grab`);
    pts += Math.round(100 + 400 * Math.min(grabTime, 1.5));
  }
  if (parts.length === 0 && airTime > 0.8) parts.push("Big Air");
  if (airTime > 0.6) pts += Math.round(airTime * 60);
  if (parts.length === 0) return;
  const kinds = (nFlip > 0) + (n180 > 0) + (grabTime > 0.12);
  if (kinds >= 2) pts = Math.round(pts * (kinds === 3 ? 2 : 1.5));
  if (r.takeoffSw) { parts.unshift("Switch"); pts = Math.round(pts * 1.25); }

    const list = obstacles.get(k);

      const rad = t.r;

    if (r.crashT <= 0) recover(r);
  }
  if (!r.finished && r.z >= COURSE_LEN) {

// Finished riders by finishing time, then everyone else by distance down the hill.
function standings() {
  return [...riders].sort((a, b) =>
    a.finished !== b.finished ? (a.finished ? -1 : 1) : a.finished ? a.finishTime - b.finishTime : b.z - a.z);

// ---------------------------------------------------------------------------
// Bots. A bot only produces controls, exactly like the keyboard does.
// ---------------------------------------------------------------------------
function predictAirTime(r) {
  let { x, y, z, vx, vy, vz } = r, t = 0;
  const dt = 1 / 60;
  while (t < 5) {
    vy -= G_AIR * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
    if (y <= terrainH(x, z)) break;
  }
  return t;
}

function planTrick(r, b) {
  const left = predictAirTime(r);
  // Weaker bots leave a bigger margin, but sometimes try more than they have time for.
  const greedy = Math.random() < 0.3 * (1 - b.skill);
  const avail = left - (0.3 - 0.2 * b.skill) + (greedy ? 0.45 : 0);
  if (avail < 0.35) return null;
  const flipTime = (Math.PI * 2) / FLIP_RATE, halfSpin = Math.PI / SPIN_RATE;
  let flips = 0;
  if (avail > flipTime && Math.random() < 0.3 + 0.45 * b.skill) flips = avail > flipTime * 2 && Math.random() < b.skill - 0.4 ? 2 : 1;
  const maxHalves = Math.min(6, Math.floor(avail / halfSpin));
  const halves = Math.round(maxHalves * Math.random() * (0.5 + 0.5 * b.skill) + (flips ? 0 : 0.3));
  const end = r.airTime + left;
  return {
    spin: halves * Math.PI, spinDir: Math.random() < 0.5 ? 1 : -1,
    flip: flips * Math.PI * 2, flipDir: Math.random() < 0.65 ? -1 : 1,
    grab: Math.random() < 0.55, grabFrom: r.airTime + 0.1, grabTo: end - (greedy ? 0.1 : 0.3),
  };
}

function botControls(r, h) {
  const b = r.bot;
  const inp = { left: false, right: false, tuck: false, brake: false, grab: false, jump: false };
  if (!canControl(r)) return inp;
  b.t += h;

  if (!r.grounded) {
    if (!b.plan && r.airTime > 0.04) b.plan = planTrick(r, b) || { spin: 0, flip: 0, grab: false };
    const p = b.plan;
    if (!p) return inp;
    if (Math.abs(r.spin) < p.spin - SPIN_RATE * h * 0.5) inp[p.spinDir > 0 ? "left" : "right"] = true;
    if (Math.abs(r.flip) < p.flip - FLIP_RATE * h * 0.5) inp[p.flipDir > 0 ? "tuck" : "brake"] = true;
    inp.grab = p.grab && r.airTime > p.grabFrom && r.airTime < p.grabTo;
    return inp;
  }
  b.plan = null;

  // Pick the next kicker and decide how to ride it.
  let idx = kickers.findIndex((k) => k.z > r.z - 1);
  if (idx !== b.kickIdx) {
    b.kickIdx = idx;
    b.goKick = Math.random() < 0.5 + 0.45 * b.skill;
    b.kickOff = (Math.random() - 0.5) * 3;
    b.popAt = 0.3 + Math.random() * 1.6 * (1 - b.skill);
  }
  const k = kickers[idx];
  const toKick = k ? k.z - r.z : Infinity;
  const speed = Math.hypot(r.vx, r.vz);

  // Steer toward a point a little way down the run, or at the kicker.
  const look = Math.max(7, speed * 0.7);
  let tx = center(r.z + look) + 5 * Math.sin(b.t * 0.25 + b.phase);
  if (k && b.goKick && toKick < 40) tx = k.x + b.kickOff;
  const err = wrapAngle(Math.atan2(tx - r.x, look) - r.heading);
  if (err > 0.04) inp.left = true;
  else if (err < -0.04) inp.right = true;

  const vmax = 19 + 11 * b.skill;
  if (speed > vmax || (Math.abs(err) > 0.6 && speed > 12)) inp.brake = true;
  else if (Math.abs(err) < 0.25) inp.tuck = true;

  // Charge an ollie on the ramp and pop just before the lip.
  inp.jump = !!(k && b.goKick && toKick < 9 && toKick > b.popAt && Math.abs(r.x - k.x) < KICK_HALF);
  return inp;
}

function startRace(roster = soloRoster()) {
  initAudio();
  speech?.cancel();
  setRoster(roster);
  clearSpray();
  raceTime = 0; simAcc = 0; netAcc = 0;
  resultsShown = false; result = null;
  countT = 3; lastCount = 4;
  state = "countdown";
  panel.classList.add("hidden");
  restartBtn.style.display = net.role === "client" ? "none" : "";
  leaveTopBtn.style.display = net.role ? "" : "none";
  snapCamera();
}

// R, Restart and "Ride again": a solo race restarts at once; in a lobby only the host can restart.
function requestRestart() {
  if (!net.role) startRace();
  else if (net.role === "host") hostStart();
}

function update(dt) {
  const keysIn = readInput();
  if (state === "countdown") {
    countT -= dt;
    const c = Math.ceil(countT);
    if (c !== lastCount && c > 0) { lastCount = c; sfx.count(); countEl.textContent = c; }
    if (countT <= 0) { state = "run"; sfx.go(); countEl.textContent = "GO!"; setTimeout(() => { if (countEl.textContent === "GO!") countEl.textContent = ""; }, 700); }
  }
  if (state === "run") {
    simAcc += dt;
    while (simAcc >= STEP) {
      simAcc -= STEP;
      raceTime += STEP;
      for (const r of riders) if (!r.remote) stepRider(r, STEP, r.bot ? botControls(r, STEP) : keysIn);
    }
    for (const r of riders) if (r.remote) followNet(r, dt);
    netTick(dt);
    if (me.finished && !resultsShown && raceTime - me.finishTime > 1.6) showResults();
    for (const r of riders) {
      const speed = Math.hypot(r.vx, r.vz);
      if (!r.grounded || speed <= 3) continue;
      const rate = r.crashT > 0 ? 200 : speed * 2.5 + r.slip * 25 + (r.inp.brake && canControl(r) ? speed * 6 : 0);
      emitSpray(r, rate, dt);
    }
  }
  for (const r of riders) updateRider(r, dt);
  updateSpray(dt);
  updateCamera(dt);
  updateWeather(dt);
  levelTime += dt;
  levelTick?.(levelTime);
  updateHUD();
  updateAudio(Math.hypot(me.vx, me.vz), me.slip);
}

// ---------------------------------------------------------------------------
// Rider pose and camera
// ---------------------------------------------------------------------------
const UP = new THREE.Vector3(0, 1, 0);
const vN = new THREE.Vector3(), qa = new THREE.Quaternion(), qy = new THREE.Quaternion();
const qf = new THREE.Quaternion(), flipAxis = new THREE.Vector3();

function updateRider(r, dt) {
  const m = r.model, inp = r.inp;
  m.root.position.set(r.x, r.y, r.z);
  if (r.grounded) {
    const [gx, gz] = grad(r.x, r.z);
    vN.set(-gx, 1, -gz).normalize();
  } else vN.copy(UP);
  qa.setFromUnitVectors(UP, vN);
  qy.setFromAxisAngle(UP, r.heading + (r.sw ? Math.PI : 0) + r.spin);
  qa.multiply(qy);
  if (r.flip !== 0) {
    // Flip about the world axis across the takeoff direction, applied on top of the spin.
    const s = Math.sin(r.flipYaw), c = Math.cos(r.flipYaw);
    flipAxis.set(c, 0, -s);
    qf.setFromAxisAngle(flipAxis, r.flip);
    qa.premultiply(qf);
    // Pivot about the rider's middle so the body doesn't swing through the snow.
    const fs = Math.sin(r.flip), fc = Math.cos(r.flip);
    m.root.position.x -= FLIP_PIVOT * fs * s;
    m.root.position.z -= FLIP_PIVOT * fs * c;
    m.root.position.y += FLIP_PIVOT * (1 - fc);
  }
  m.root.quaternion.slerp(qa, 1 - Math.exp(-(r.grounded ? 14 : 40) * dt));
  if (r.tag) r.tag.position.set(r.x, r.y + 2.5, r.z);

  const ctl = canControl(r);
  const speed = Math.hypot(r.vx, r.vz);
  const steer = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  const leanT = r.grounded && ctl ? steer * 0.38 * Math.min(1, speed / 12) * (r.sw ? -1 : 1) : 0;
  r.lean += (leanT - r.lean) * (1 - Math.exp(-8 * dt));
  let crouchT = 0.1;
  if (r.charge > 0) crouchT = 0.3 + 0.5 * r.charge;
  else if (r.grabbing) crouchT = 0.75;
  else if (!r.grounded && ctl && (inp.tuck || inp.brake)) crouchT = 0.65;
  else if (ctl && inp.tuck && r.grounded) crouchT = 0.6;
  else if (!r.grounded) crouchT = 0.3;
  r.crouch += (crouchT - r.crouch) * (1 - Math.exp(-12 * dt));

  m.pose.rotation.set(r.crashT > 0 ? r.crashSpin : 0, 0, r.lean);
  const legScale = 1 - 0.45 * r.crouch;
  m.legs.forEach((l) => (l.scale.y = legScale));
  m.upper.position.y = LEG_BASE + LEG_H * legScale;
  m.upper.rotation.z = -r.crouch * 0.35;
  const reach = r.grabbing ? 1.1 : 0;
  m.arms[0].rotation.set(0.35 - reach * 0.2, 0, reach);
  m.arms[1].rotation.set(-0.35 + reach * 0.2, 0, reach * 0.3);
  updateGear(r, dt);
}

let camYaw = 0;
const camTarget = new THREE.Vector3();
function updateCamera(dt, snap = false) {
  const speed = Math.hypot(me.vx, me.vz);
  const want = speed > 2 ? Math.atan2(me.vx, me.vz) : me.heading;
  camYaw = snap ? want : camYaw + wrapAngle(want - camYaw) * (1 - Math.exp(-3 * dt));
  const back = 8.5 + Math.min(speed, 35) * 0.06;
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  camTarget.set(me.x - fx * back, me.y + 4.2, me.z - fz * back);
  if (snap) camera.position.copy(camTarget);
  else camera.position.lerp(camTarget, 1 - Math.exp(-6 * dt));
  camera.position.y = Math.max(camera.position.y, terrainH(camera.position.x, camera.position.z) + 1.5);
  camera.lookAt(me.x + fx * 4, me.y + 1.2, me.z + fz * 4);
  camera.fov = 62 + Math.min(speed, 40) * 0.3;
  camera.updateProjectionMatrix();

  sun.position.set(me.x - 25, me.y + 45, me.z - 15);
  sun.target.position.set(me.x, me.y, me.z);
  backdrop.position.copy(camera.position);
  riderLight.position.set(me.x, me.y + 3, me.z - 1.5);
}
const snapCamera = () => updateCamera(0, true);

// ---------------------------------------------------------------------------
// Multiplayer. Browsers connect directly to each other over WebRTC using
// PeerJS. PeerJS's public server is only used to find the host by lobby code.
// The host runs the bots and relays every rider's state to everyone; each
// browser runs the physics for its own rider.
// ---------------------------------------------------------------------------
const PEERJS_URL = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
const PEER_PREFIX = "powderrun-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const SEND_RATE = 15;
const net = { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], bots: BOTS.length, racing: false };
let netAcc = 0;
let myName = store.get("powderrun-name") || "";

let peerJS = null;
function loadPeerJS() {
  peerJS ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PEERJS_URL;
    s.onload = () => resolve(window.Peer);
    s.onerror = () => { peerJS = null; reject(new Error("Couldn't load the multiplayer library. Check your internet connection.")); };
    document.head.append(s);
  });
  return peerJS;
}

const makeCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const gearSeed = (v) => (Number.isFinite(v) ? v >>> 0 : 0);
const cleanName = (s) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, 16) || "Rider";
function readName() {
  myName = cleanName($("name")?.value);
  store.set("powderrun-name", myName);
}

function peerErrorText(err) {
  switch (err?.type) {
    case "peer-unavailable": return "No lobby found with that code.";
    case "browser-incompatible": return "This browser doesn't support the connections multiplayer needs.";
    case "network": case "server-error": case "socket-error": case "socket-closed":
      return "Couldn't reach the lobby server. Check your connection and try again.";
    default: return `Connection problem (${err?.type || "unknown"}).`;
  }
}

function sendAll(msg) {
  for (const c of net.conns.values()) if (c.open) c.send(msg);
}

// Called every frame during a race; sends at SEND_RATE.
function netTick(dt) {
  if (!net.role) return;
  netAcc += dt;
  if (netAcc < 1 / SEND_RATE) return;
  netAcc %= 1 / SEND_RATE;
  if (net.role === "client") { if (net.host?.open) net.host.send({ t: "me", s: packRider(me) }); }
  else sendAll({ t: "snap", s: riders.map(packRider).filter(Boolean) });
}

// --- Host ---
async function hostLobby() {
  readName();
  showStatus("Creating a lobby…");
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message); }
  const open = (attempt) => {
    const code = makeCode();
    const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
    Object.assign(net, { role: "host", peer, code, conns: new Map(), players: [], racing: false });
    peer.on("open", (id) => {
      me.id = id;
      net.players = [{ id, name: myName, gear: myGear }];
      state = "menu";
      showLobby();
    });
    peer.on("connection", acceptPlayer);
    // Losing the lobby server only stops new players joining; reconnect so they can.
    peer.on("disconnected", () => { if (net.peer === peer && !peer.destroyed) peer.reconnect(); });
    peer.on("error", (err) => {
      if (net.peer !== peer) return;
      if (err.type === "unavailable-id" && attempt < 3) { peer.destroy(); open(attempt + 1); }
      else if (err.type !== "peer-unavailable" && !net.players.length) leaveLobby(peerErrorText(err));
    });
  };
  open(0);
}

function acceptPlayer(conn) {
  conn.on("open", () => {
    if (net.players.length >= MAX_RIDERS) { conn.send({ t: "full" }); setTimeout(() => conn.close(), 500); return; }
    net.conns.set(conn.peer, conn);
  });
  conn.on("data", (m) => onHostData(conn, m));
  conn.on("close", () => dropPlayer(conn.peer));
  conn.on("error", () => dropPlayer(conn.peer));
}

function onHostData(conn, m) {
  if (!m || typeof m !== "object" || !net.conns.has(conn.peer)) return;
  if (m.t === "hello") {
    if (net.players.some((p) => p.id === conn.peer)) return;
    net.players.push({ id: conn.peer, name: cleanName(m.name), gear: gearSeed(m.gear) });
    broadcastLobby();
    refreshLobby();
  } else if (m.t === "me") {
    const r = riders.find((x) => x.id === conn.peer && x.remote);
    if (r) applyNet(r, m.s);
  }
}

function dropPlayer(id) {
  if (net.role !== "host") return;
  net.conns.delete(id);
  const i = net.players.findIndex((p) => p.id === id);
  if (i < 0) return;
  net.players.splice(i, 1);
  removeRider(id);
  broadcastLobby();
  refreshLobby();
}

const lobbyBotCount = () => Math.max(0, Math.min(net.bots, BOTS.length, MAX_RIDERS - net.players.length));
function setBots(n) {
  net.bots = Math.max(0, Math.min(BOTS.length, n));
  broadcastLobby();
  showLobby();
}
function broadcastLobby() {
  sendAll({ t: "lobby", code: net.code, players: net.players, bots: lobbyBotCount(), racing: net.racing, level: levelId });
}

function hostStart() {
  const roster = [
    ...net.players.map((p, i) => ({ id: p.id, name: p.name, look: i % PLAYER_LOOKS, gear: p.gear })),
    ...BOTS.slice(0, lobbyBotCount()).map((b, i) => ({ id: `bot${i}`, name: b.name, look: b.look, bot: b.skill, gear: botGear[i] })),
  ];
  net.racing = true;
  sendAll({ t: "start", roster, level: levelId });
  broadcastLobby();
  startRace(roster);
}

// --- Client ---
async function joinLobby(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 5) return showMenu("Lobby codes are 5 letters and numbers.");
  readName();
  showStatus(`Joining lobby ${code}…`);
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message); }
  const peer = new Peer({ debug: 0 });
  Object.assign(net, { role: "client", peer, code, host: null, players: [], racing: false });
  const timer = setTimeout(() => {
    if (net.peer === peer && !net.host?.open) {
      leaveLobby("Couldn't connect to the lobby. The host may have left, or a network between you is blocking direct connections.");
    }
  }, 15000);
  peer.on("open", (id) => {
    me.id = id;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
    net.host = conn;
    conn.on("open", () => { clearTimeout(timer); conn.send({ t: "hello", name: myName, gear: myGear }); });
    conn.on("data", onClientData);
    conn.on("close", () => { if (net.peer === peer) leaveLobby("The host closed the lobby."); });
  });
  peer.on("error", (err) => {
    if (net.peer !== peer) return;
    clearTimeout(timer);
    leaveLobby(peerErrorText(err));
  });
}

function onClientData(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "lobby") {
    net.players = (Array.isArray(m.players) ? m.players : []).slice(0, MAX_RIDERS)
      .map((p) => ({ id: String(p?.id), name: cleanName(p?.name), gear: gearSeed(p?.gear) }));
    net.bots = Number.isInteger(m.bots) ? m.bots : 0;
    net.racing = !!m.racing;
    // Show the host's course behind the lobby, but never rebuild it under a race.
    if (state === "menu" && !resultsShown && LEVELS[m.level]) setLevel(m.level);
    // Remove riders whose players have left.
    for (const r of [...riders]) if (r.remote && r.bot == null && !r.id.startsWith("bot") && !net.players.some((p) => p.id === r.id)) removeRider(r.id);
    refreshLobby();
  } else if (m.t === "start") {
    const roster = (Array.isArray(m.roster) ? m.roster : []).slice(0, MAX_RIDERS).map((e) => ({
      id: String(e?.id), name: cleanName(e?.name),
      look: Number.isInteger(e?.look) && e.look >= 0 && e.look < LOOKS.length ? e.look : 0,
      bot: Number.isFinite(e?.bot) ? e.bot : undefined,
      gear: gearSeed(e?.gear),
    }));
    // Joined after this race was set up: wait in the lobby for the next one.
    if (roster.some((e) => e.id === me.id)) {
      setLevel(LEVELS[m.level] ? m.level : "peak");
      startRace(roster);
    }
  } else if (m.t === "snap" && Array.isArray(m.s)) {
    for (const s of m.s) {
      const r = s && riders.find((x) => x.id === s.id && x.remote);
      if (r) applyNet(r, s);
    }
  } else if (m.t === "full") {
    leaveLobby("That lobby is full.");
  }
}

// Back to solo play. `message` explains why, if it wasn't the player's choice.
function leaveLobby(message = "") {
  const peer = net.peer;
  Object.assign(net, { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], racing: false });
  peer?.destroy();
  me.id = "me";
  state = "menu";
  resultsShown = false; result = null;
  countEl.textContent = "";
  restartBtn.style.display = "";
  leaveTopBtn.style.display = "none";
  setRoster(soloRoster());
  snapCamera();
  showMenu(message);
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
setLevel(store.get("powderrun-level") || "peak");
setRoster(soloRoster());
for (const r of riders) updateRider(r, 1);
snapCamera();
showMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
