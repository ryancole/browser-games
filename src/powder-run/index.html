  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Cloth that flaps: a chain of thin panels hanging from a pivot. updateGear
// points the chain along the wind and gravity (plus a "rest" pull for stiffer
// bits like a pom-pom) and ripples it.
const V_DOWN = new THREE.Vector3(0, -1, 0), V_UP = new THREE.Vector3(0, 1, 0);
function makeFlap(parent, [x, y, z], { segs = 2, len = 0.1, width = 0.1, thick = 0.025, color, taper = 1, rest = V_DOWN, stiff = 0, end = null }) {
  const root = new THREE.Group();
  root.position.set(x, y, z);
  parent.add(root);
  const chain = [];
  let p = root;
  for (let i = 0; i < segs; i++) {
    const s = new THREE.Group();
    if (i) s.position.y = -len;
    p.add(s);
    const w = width * (1 - (1 - taper) * (i / Math.max(1, segs - 1)));
    part(box(thick, len, w, 0, -len / 2), mat(color), s);
    chain.push(s);
    p = s;
  }
  if (end) part(new THREE.SphereGeometry(end.r, 8, 6).translate(0, -len, 0), mat(end.color), p);
  return { root, chain, rest: rest.clone().normalize(), stiff, phase: Math.random() * 10 };
}

function buildRiderModel(look, g) {
  const root = new THREE.Group(), pose = new THREE.Group(), upper = new THREE.Group(), torso = new THREE.Group();
  root.add(pose);
  scene.add(root);
  const jacket = look.jacket;
  const flaps = [];

  // Board, bindings and boots stay planted; the legs above them crouch. In a
  // crash the board comes off and the boots go with the legs (see the ragdoll).
  const board = new THREE.Group();
  pose.add(board);
  part(boardGeometry(), mat(g.board, "shiny"), board);
  part(boardGeometry({ w: 0.14, len: 1.5, thick: 0.004, y0: 0.06 }), mat(g.stripe, "shiny"), board);
  const boots = [0.28, -0.28].map((z) => {
    part(box(0.34, 0.06, 0.26, 0, 0.09, z), mat(g.binding), board);
    const b = new THREE.Group();
    b.position.z = z;
    board.add(b);
    part(box(0.3, 0.2, 0.2, 0.02, 0.17), mat(g.boots), b);
    part(box(0.31, 0.05, 0.22, 0.02, 0.22), mat(g.binding), b); // strap over the boot
    return b;
  });
  const legW = g.baggy ? 0.28 : 0.22;
  const legs = [0.28, -0.28].map((z) => {
    const leg = new THREE.Group();
    leg.position.set(0, LEG_BASE, z);
    pose.add(leg);
    part(box(legW, LEG_H, legW, 0, LEG_H / 2), mat(g.pants), leg);
    if (g.baggy) part(box(legW + 0.03, 0.1, legW + 0.03, 0, 0.04), mat(g.pants), leg); // cuff over the boot
    if (g.knee) part(box(0.03, 0.16, legW * 0.75, legW / 2, LEG_H * 0.45), mat(g.knee), leg);
    return leg;
  });

  // Jacket.
  pose.add(upper);
  upper.add(torso);
  part(box(0.42, 0.64, 0.56, 0, 0.3), mat(jacket), torso);
  if (g.longJacket) part(box(0.45, 0.2, 0.59, 0, -0.06), mat(jacket), torso);
  if (g.yoke) part(box(0.44, 0.16, 0.58, 0, 0.55), mat(g.yoke), torso);
  part(box(0.02, g.longJacket ? 0.78 : 0.6, 0.04, 0.215, g.longJacket ? 0.23 : 0.3), mat(0x1d1f26), torso); // zip
  if (g.hood) part(box(0.16, 0.2, 0.36, -0.21, 0.6), mat(jacket), torso);
  flaps.push(makeFlap(torso, [-0.22, g.longJacket ? -0.15 : 0, 0], {
    segs: 2, len: g.longJacket ? 0.12 : 0.07, width: 0.5, thick: 0.03, color: jacket, stiff: 18,
  }));

  // Head, scarf, headwear and goggles.
  part(new THREE.SphereGeometry(0.19, 10, 8).translate(0, 0.82, 0), mat(g.skin), upper);
  if (g.scarf) {
    part(new THREE.CylinderGeometry(0.15, 0.17, 0.12, 10).translate(0, 0.66, 0), mat(g.scarf), upper);
    flaps.push(makeFlap(upper, [-0.16, 0.66, 0.08], { segs: 3, len: 0.15, width: 0.12, thick: 0.035, color: g.scarf }));
    flaps.push(makeFlap(upper, [-0.16, 0.64, -0.08], { segs: 3, len: 0.12, width: 0.11, thick: 0.035, color: g.scarf }));
  }
  if (g.head === "helmet") {
    part(new THREE.SphereGeometry(0.215, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2).translate(0, 0.84, 0), mat(g.headColor, "shiny"), upper);
    part(box(0.36, 0.03, 0.07, -0.01, 1.045), mat(g.headAccent, "shiny"), upper);
  } else {
    part(new THREE.SphereGeometry(0.205, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55).translate(0, 0.84, 0), mat(g.headColor), upper);
    if (g.head === "beanie-cuff" || g.head === "beanie-pom") {
      part(new THREE.CylinderGeometry(0.214, 0.214, 0.08, 12).translate(0, 0.88, 0), mat(g.head === "beanie-cuff" ? g.headAccent : g.headColor), upper);
    }
    if (g.head === "beanie-pom") {
      flaps.push(makeFlap(upper, [0, 1.03, 0], {
        segs: 1, len: 0.06, width: 0.03, thick: 0.03, color: g.headColor, rest: V_UP, stiff: 22, end: { r: 0.065, color: g.headAccent },
      }));
    } else if (g.head === "beanie-slouch") {
      flaps.push(makeFlap(upper, [-0.1, 1.0, 0], {
        segs: 2, len: 0.12, width: 0.22, thick: 0.1, taper: 0.55, color: g.headColor, rest: new THREE.Vector3(-1, -0.4, 0), stiff: 14,
      }));
    }
  }
  part(new THREE.CylinderGeometry(0.214, 0.214, 0.045, 12, 1, true).translate(0, 0.8, 0), mat(g.strap), upper);
  part(box(0.07, 0.12, 0.34, 0.18, 0.8), mat(g.frame), upper);
  part(box(0.02, 0.09, 0.3, 0.218, 0.8), mat(g.lens, "lens"), upper);
  if (g.phones) buildHeadphones(g.phones, upper, g.head === "helmet");

  // Sleeves and gloves.
  const arms = [0.34, -0.34].map((z) => {
    const a = new THREE.Group();
    a.position.set(0, 0.56, z);
    upper.add(a);
    part(box(0.16, 0.52, 0.16, 0, -0.24), mat(jacket), a);
    if (g.yoke) part(box(0.17, 0.12, 0.17, 0, -0.02), mat(g.yoke), a);
    part(box(0.17, 0.13, 0.17, 0, -0.55), mat(g.gloves), a);
    return a;
  });

  return { root, pose, upper, torso, legs, arms, flaps, board, boots };
}

// Headphones over the hat, ear to ear, with a cord down to a cassette player
// clipped to the front of the jacket at the hip.
const vCordA = new THREE.Vector3(), vCordB = new THREE.Vector3();
function buildHeadphones({ band, pad, deck }, upper, helmet) {
  const R = helmet ? 0.245 : 0.235;
  // The band: a half ring over the top of the head, from ear to ear.
  part(new THREE.TorusGeometry(R, 0.018, 6, 16, Math.PI).rotateY(Math.PI / 2).translate(0, 0.83, 0), mat(band, "shiny"), upper);
  for (const z of [R, -R]) {
    const s = Math.sign(z);
    part(new THREE.CylinderGeometry(0.085, 0.085, 0.035, 12).rotateX(Math.PI / 2), mat(band, "shiny"), upper, 0, 0.8, z + s * 0.012);
    part(new THREE.CylinderGeometry(0.08, 0.08, 0.04, 12).rotateX(Math.PI / 2), mat(pad), upper, 0, 0.8, z - s * 0.02);
  }
  // The player, with its tape window and a play button on top.
  const px = 0.24, py = 0.14, pz = 0.13;
  part(box(0.05, 0.16, 0.12), mat(deck, "shiny"), upper, px, py, pz);
  part(box(0.012, 0.07, 0.08), mat(0x23262f, "shiny"), upper, px + 0.028, py + 0.015, pz);
  part(box(0.03, 0.02, 0.03), mat(0xff5a3a), upper, px, py + 0.09, pz + 0.03);
  part(box(0.065, 0.02, 0.02), mat(0x2a2f3a), upper, px - 0.01, py + 0.03, pz - 0.065); // belt clip
  // The cord: down from the right ear cup, over the shoulder and down the front.
  const pts = [[0, 0.72, R], [0.14, 0.62, R * 0.85], [0.235, 0.42, 0.18], [px, py + 0.1, pz + 0.02]];
  for (let i = 0; i < pts.length - 1; i++) {
    vCordA.fromArray(pts[i]); vCordB.fromArray(pts[i + 1]);
    const len = vCordA.distanceTo(vCordB);
    const cord = part(new THREE.CylinderGeometry(0.007, 0.007, len, 4), mat(0x1d1f26), upper);
    cord.position.copy(vCordA).add(vCordB).multiplyScalar(0.5);
    cord.quaternion.setFromUnitVectors(V_UP, vCordB.sub(vCordA).normalize());
    cord.castShadow = false;
  }
}

// Point each flap along the air rushing past (the weather's wind minus the
// rider's own motion) and gravity, then ripple it faster the harder it blows.
const qInv = new THREE.Quaternion(), qAim = new THREE.Quaternion();
const vAir = new THREE.Vector3(), vPull = new THREE.Vector3(), vGrav = new THREE.Vector3();
function updateGear(r, dt) {
  const m = r.model;
  vAir.set(windX - r.vx, r.grounded ? 0 : -r.vy, windZ - r.vz);
  const air = vAir.length();
  const t = performance.now() / 1000;
  const amp = Math.min(0.7, 0.08 + air * 0.022), freq = 5 + air * 0.45;
  for (const f of m.flaps) {
    f.root.parent.getWorldQuaternion(qInv).invert();
    vPull.copy(vAir).multiplyScalar(0.03 * air).applyQuaternion(qInv);
    vGrav.set(0, -4, 0).applyQuaternion(qInv);
    vPull.add(vGrav).addScaledVector(f.rest, f.stiff);
    if (vPull.lengthSq() < 1e-6) continue;
    qAim.setFromUnitVectors(V_DOWN, vPull.normalize());
    f.root.quaternion.slerp(qAim, 1 - Math.exp(-12 * dt));
    f.chain.forEach((s, i) => {
      const ph = t * freq + f.phase - i * 1.3;
      s.rotation.z = amp * Math.sin(ph) * (0.5 + i * 0.5);
      s.rotation.x = amp * 0.35 * Math.sin(ph * 1.37 + 1);
    });
  }
  // The jacket puffs in and out a little at speed.
  const b = 1 + Math.min(1, air / 25) * 0.035 * Math.sin(t * freq * 0.7 + m.flaps[0].phase);
  m.torso.scale.set(b, 1, b);
}

// A floating name above other riders' heads.
function nameTag(text, color) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.font = "bold 34px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  const w = g.measureText(text).width + 30;
  g.fillStyle = "rgba(15, 17, 21, 0.6)";
  g.beginPath(); g.roundRect((256 - w) / 2, 8, w, 48, 24); g.fill();
  g.fillStyle = color;
  g.fillText(text, 128, 33);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  s.scale.set(2, 0.5, 1);
  scene.add(s);
  return s;
}

// ---------------------------------------------------------------------------
// Snow spray particles
// ---------------------------------------------------------------------------
// Every particle is a soft puff that grows as it drifts and fades out. Puffs
// have a cool grey-blue rim so they still read against white snow, and each
// has its own size and fade, which plain PointsMaterial can't do, so its
// shaders get two extra attributes.
const SPRAY_N = 2400;
const sprayPos = new Float32Array(SPRAY_N * 3).fill(-9999);
const sprayVel = new Float32Array(SPRAY_N * 3);
const sprayLife = new Float32Array(SPRAY_N);   // seconds left
const sprayMax = new Float32Array(SPRAY_N);    // seconds it started with
const sprayBase = new Float32Array(SPRAY_N);   // size when it's thrown
const spraySize = new Float32Array(SPRAY_N);
const sprayAlpha = new Float32Array(SPRAY_N);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute("position", new THREE.BufferAttribute(sprayPos, 3));
sprayGeo.setAttribute("aSize", new THREE.BufferAttribute(spraySize, 1));
sprayGeo.setAttribute("aAlpha", new THREE.BufferAttribute(sprayAlpha, 1));
const dot = document.createElement("canvas");
dot.width = dot.height = 32;
{
  const g = dot.getContext("2d");
  const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 32, 32);
}
const sprayTex = canvasTexture(64, 64, (g) => {
  const grd = g.createRadialGradient(32, 30, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(0.45, "rgba(246,249,255,0.95)");
  grd.addColorStop(0.75, "rgba(180,196,220,0.5)");
  grd.addColorStop(1, "rgba(160,178,205,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
});
const sprayMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1, map: sprayTex, transparent: true, depthWrite: false });
sprayMat.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", "#include <common>\nattribute float aSize;\nattribute float aAlpha;\nvarying float vAlpha;")
    .replace("gl_PointSize = size;", "gl_PointSize = size * aSize;\n\tvAlpha = aAlpha;");
  sh.fragmentShader = sh.fragmentShader
    .replace("#include <common>", "#include <common>\nvarying float vAlpha;")
    .replace("vec4 diffuseColor = vec4( diffuse, opacity );", "vec4 diffuseColor = vec4( diffuse, opacity * vAlpha );");
};
const spray = new THREE.Points(sprayGeo, sprayMat);
spray.frustumCulled = false;
scene.add(spray);
let sprayNext = 0;

function sprayOne(x, y, z, vx, vy, vz, life, size) {
  const i = sprayNext; sprayNext = (sprayNext + 1) % SPRAY_N;
  sprayPos[i * 3] = x; sprayPos[i * 3 + 1] = y; sprayPos[i * 3 + 2] = z;
  sprayVel[i * 3] = vx; sprayVel[i * 3 + 1] = vy; sprayVel[i * 3 + 2] = vz;
  sprayLife[i] = sprayMax[i] = life;
  sprayBase[i] = size;
}

// Sheets of snow. A scraping board edge throws snow out in a curtain, not in
// lumps: every 1/45 s it throws a "slice", SHEET_K points leaving the same spot
// on the edge at different strengths (from a dribble to the full throw), and
// each slice is stitched to the one before into a strip of quads. As the
// points fly, slow down and fall, the strip spreads into an arcing, streaky
// sheet that fades away. The ring of snow from a landing is one closed sheet.
const SHEET_K = 4, SHEET_N = 1400, SHEET_RATE = 45;
const SHEET_ROW = [0.12, 0.42, 0.72, 1];    // how much of the full throw each row gets
const SHEET_ROW_A = [0.9, 1, 0.85, 0.4];    // and how dense it looks: thin at the tip
// Shaded blue-grey low down, where the sheet is thick, so it stands out against the snow.
const SHEET_ROW_C = [[0.72, 0.79, 0.9], [0.84, 0.89, 0.96], [0.94, 0.96, 1], [1, 1, 1]];
const shPos = new Float32Array(SHEET_N * SHEET_K * 3).fill(-9999);
const shVel = new Float32Array(SHEET_N * SHEET_K * 3);
const shCol = new Float32Array(SHEET_N * SHEET_K * 4);
const shUV = new Float32Array(SHEET_N * SHEET_K * 2);
const shLife = new Float32Array(SHEET_N), shMax = new Float32Array(SHEET_N), shStrength = new Float32Array(SHEET_N);
const shSerial = new Int32Array(SHEET_N), shPrev = new Int32Array(SHEET_N).fill(-1), shPrevSerial = new Int32Array(SHEET_N);
const shIdx = new Uint32Array(SHEET_N * (SHEET_K - 1) * 6);
for (let i = 0; i < SHEET_N * SHEET_K; i++) shCol.set(SHEET_ROW_C[i % SHEET_K], i * 4);
const sheetGeo = new THREE.BufferGeometry();
sheetGeo.setAttribute("position", new THREE.BufferAttribute(shPos, 3));
sheetGeo.setAttribute("color", new THREE.BufferAttribute(shCol, 4));
sheetGeo.setAttribute("uv", new THREE.BufferAttribute(shUV, 2));
sheetGeo.setIndex(new THREE.BufferAttribute(shIdx, 1));
// Streaks running out from the edge, ragged and thinning towards the tip.
const sheetTex = canvasTexture(128, 128, (g) => {
  const r = mulberry32(99);
  // A thin veil under the streaks, so the sheet reads as one sheet.
  const veil = g.createLinearGradient(0, 128, 0, 0);
  veil.addColorStop(0, "rgba(255,255,255,0.55)");
  veil.addColorStop(0.7, "rgba(255,255,255,0.3)");
  veil.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = veil;
  g.fillRect(0, 0, 128, 128);
  for (let n = 0; n < 140; n++) {
    const x = r() * 128, w = 1 + r() * 5, top = 128 * (0.35 + r() * 0.65);
    const shade = r() < 0.4 ? "170,188,215" : "255,255,255";
    const grd = g.createLinearGradient(0, 128, 0, 128 - top);
    grd.addColorStop(0, `rgba(${shade},${0.45 + r() * 0.5})`);
    grd.addColorStop(0.6, `rgba(${shade},${0.3 + r() * 0.4})`);
    grd.addColorStop(1, `rgba(${shade},0)`);
    g.fillStyle = grd;
    g.fillRect(x, 128 - top, w, top);
    if (x + w > 128) g.fillRect(x - 128, 128 - top, w, top); // wrap round, so it tiles along the sheet
  }
}, true);
const sheetMat = new THREE.MeshBasicMaterial({
  map: sheetTex, vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide,
});
const sheets = new THREE.Mesh(sheetGeo, sheetMat);
sheets.frustumCulled = false;
scene.add(sheets);
let shNext = 0, shCount = 0;

// One slice: every row leaves (x, y, z) with the shared velocity `v` plus its
// share of the throw `o`. `prev` is the slice it joins on to, or -1.
function sheetSlice(x, y, z, vx, vy, vz, ox, oy, oz, life, strength, u, prev) {
  const i = shNext; shNext = (shNext + 1) % SHEET_N;
  shSerial[i] = ++shCount;
  for (let k = 0; k < SHEET_K; k++) {
    const j = i * SHEET_K + k, f = SHEET_ROW[k];
    shPos[j * 3] = x + ox * f * 0.02; shPos[j * 3 + 1] = y + oy * f * 0.02; shPos[j * 3 + 2] = z + oz * f * 0.02;
    shVel[j * 3] = vx + ox * f; shVel[j * 3 + 1] = vy + oy * f; shVel[j * 3 + 2] = vz + oz * f;
    shUV[j * 2] = u; shUV[j * 2 + 1] = k / (SHEET_K - 1);
    shCol[j * 4 + 3] = 0;
  }
  shLife[i] = shMax[i] = life;
  shStrength[i] = strength;
  shPrev[i] = prev;
  shPrevSerial[i] = prev >= 0 ? shSerial[prev] : 0;
  return i;
}

function updateSheets(dt) {
  const drag = Math.exp(-1.7 * dt);
  let n = 0;
  for (let i = 0; i < SHEET_N; i++) {
    if (shLife[i] <= 0) continue;
    shLife[i] -= dt;
    const age = 1 - Math.max(0, shLife[i]) / shMax[i];
    const a = shLife[i] <= 0 ? 0 : shStrength[i] * Math.min(1, age * 10) * (1 - age) ** 1.4;
    for (let k = 0; k < SHEET_K; k++) {
      const j = i * SHEET_K + k;
      shVel[j * 3] *= drag; shVel[j * 3 + 2] *= drag;
      shVel[j * 3 + 1] = shVel[j * 3 + 1] * drag - 7 * dt;
      shPos[j * 3] += shVel[j * 3] * dt; shPos[j * 3 + 1] += shVel[j * 3 + 1] * dt; shPos[j * 3 + 2] += shVel[j * 3 + 2] * dt;
      const ground = terrainH(shPos[j * 3], shPos[j * 3 + 2]) + 0.03;
      if (shPos[j * 3 + 1] < ground) { shPos[j * 3 + 1] = ground; shVel[j * 3 + 1] = 0; }
      shCol[j * 4 + 3] = a * SHEET_ROW_A[k];
    }
    // Stitch to the slice before, if that's still the one this was joined to.
    const p = shPrev[i];
    if (a > 0 && p >= 0 && shLife[p] > 0 && shSerial[p] === shPrevSerial[i]) {
      for (let k = 0; k < SHEET_K - 1; k++) {
        const pa = p * SHEET_K + k, ia = i * SHEET_K + k;
        shIdx[n++] = pa; shIdx[n++] = ia; shIdx[n++] = pa + 1;
        shIdx[n++] = pa + 1; shIdx[n++] = ia; shIdx[n++] = ia + 1;
      }
    }
  }
  sheetGeo.setDrawRange(0, n);
  for (const name of ["position", "color"]) sheetGeo.attributes[name].needsUpdate = true;
  sheetGeo.attributes.uv.needsUpdate = true;
  const idx = sheetGeo.index;
  idx.clearUpdateRanges();
  idx.addUpdateRange(0, Math.max(1, n));
  idx.needsUpdate = true;
}
function clearSheets() {
  shLife.fill(0);
  for (let i = 0; i < SHEET_N * SHEET_K; i++) shCol[i * 4 + 3] = 0;
  shPos.fill(-9999);
}

// Snow thrown up by a rider's board. Whatever sideways speed the board has
// (carving round a turn, skidding, braking) scrapes a sheet of snow off the
// edge and throws it out that way, to the outside of the turn, with a few
// loose grains flying off it. Riding fast also kicks up a fine trail of
// powder off the tail.
function emitSpray(r, dt) {
  const speed = Math.hypot(r.vx, r.vz);
  if (r.rag) {
    r.sheetLast = -1;
    // A crashed rider sprays snow from wherever their body is sliding.
    r.sprayAcc = (r.sprayAcc || 0) + Math.min(speed, 20) * 6 * dt;
    for (; r.sprayAcc >= 1; r.sprayAcc--) {
      sprayOne(r.x + (rand() - 0.5) * 1.2, r.y + 0.15, r.z + (rand() - 0.5) * 1.2,
        r.vx * 0.3 + (rand() - 0.5) * 3, 1 + rand() * 2.5, r.vz * 0.3 + (rand() - 0.5) * 3, 0.6 + rand() * 0.6, 0.14 + rand() * 0.14);
    }
    return;
  }
  if (!r.grounded || speed < 2) { r.sheetLast = -1; return; }
  const fx = Math.sin(r.heading), fz = Math.cos(r.heading);
  const sx = Math.cos(r.heading), sz = -Math.sin(r.heading);
  const vf = r.vx * fx + r.vz * fz, vs = r.vx * sx + r.vz * sz;
  const side = Math.sign(vs) || 1;

function updateSpray(dt) {

    if (sprayLife[i] <= 0) { sprayPos[i * 3 + 1] = -9999; sprayAlpha[i] = 0; continue; }
    // Powder hangs in the air: air drag slows it, and gravity pulls it down gently.
    sprayVel[i * 3] *= drag; sprayVel[i * 3 + 2] *= drag;
    sprayVel[i * 3 + 1] = sprayVel[i * 3 + 1] * drag - 6.5 * dt;
    sprayPos[i * 3] += sprayVel[i * 3] * dt;
    sprayPos[i * 3 + 1] += sprayVel[i * 3 + 1] * dt;
    sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt;
    // Settle on the snow rather than falling through it.

    if (sprayPos[i * 3 + 1] < ground) { sprayPos[i * 3 + 1] = ground; sprayVel[i * 3 + 1] = 0; }

// ---------------------------------------------------------------------------
const TRAIL_SEGS = 12000;

const trailUv = new Float32Array(TRAIL_SEGS * 4 * 2);

{

function clearTrails() {

// A point across the track at (x, z), sitting just above the snow.
const trailEdge = (x, z) => [x, terrainH(x, z) + 0.03, z];

function updateTrail(r) {
  const speed = Math.hypot(r.vx, r.vz);
  if (!r.grounded) { r.trail = null; return; }
  if (speed < 1) return;
  // The track is as wide as the board looks from the direction you're moving:
  // edge-on when carving, broadside when skidding or crashing.
  const dir = Math.atan2(r.vx, r.vz);
  const yaw = r.heading + (r.sw ? Math.PI : 0) + r.spin;
  const half = (0.28 + Math.abs(Math.sin(yaw - dir)) * 1.5 + (r.crashT > 0 ? 0.5 : 0)) / 2;
  const px = Math.cos(dir), pz = -Math.sin(dir);
  const L = trailEdge(r.x - px * half, r.z - pz * half), R = trailEdge(r.x + px * half, r.z + pz * half);
  const t = r.trail;
  if (!t) { r.trail = { x: r.x, z: r.z, L, R, v: 0 }; return; }
  const d = Math.hypot(r.x - t.x, r.z - t.z);
  if (d < TRAIL_MIN) return;
  const v = t.v + d / 3;
  if (d < 6) {
    // Skip pieces that would span a jump or a teleport.
    const i = trailNext;
    trailNext = (trailNext + 1) % TRAIL_SEGS;
    trailPos.set([...t.L, ...t.R, ...L, ...R], i * 12);
    trailUv.set([0, t.v, 1, t.v, 0, v, 1, v], i * 8);
    trailLo = Math.min(trailLo, i); trailHi = Math.max(trailHi, i);
  }
  Object.assign(t, { x: r.x, z: r.z, L, R, v });
}

// Upload only the pieces written since last frame.
function flushTrails() {
  if (trailHi < trailLo) return;
  const pos = trailGeo.attributes.position, uv = trailGeo.attributes.uv;
  pos.clearUpdateRanges(); uv.clearUpdateRanges();
  pos.addUpdateRange(trailLo * 12, (trailHi - trailLo + 1) * 12);
  uv.addUpdateRange(trailLo * 8, (trailHi - trailLo + 1) * 8);
  pos.needsUpdate = uv.needsUpdate = true;
  trailLo = Infinity; trailHi = -1;
}

// Weather: falling snow, and patches of powder blowing across the slope. Both

// snowfall never runs out.
// ---------------------------------------------------------------------------
const FLAKES = 3500;
const SNOW_HALF = { x: 35, y: 18, z: 35 };
const PUFFS = 36, PUFF_HALF = 60;
const wrapIn = (d, h) => ((((d + h) % (2 * h)) + 2 * h) % (2 * h)) - h;

const flakePos = new Float32Array(FLAKES * 3), flakeSeed = new Float32Array(FLAKES);

  flakePos[i * 3 + 1] = (Math.random() * 2 - 1) * SNOW_HALF.y;
  flakePos[i * 3 + 2] = (Math.random() * 2 - 1) * SNOW_HALF.z;
  flakeSeed[i] = Math.random();
}
const flakeGeo = new THREE.BufferGeometry();
flakeGeo.setAttribute("position", new THREE.BufferAttribute(flakePos, 3));
const snowfall = new THREE.Points(flakeGeo, new THREE.PointsMaterial({

// Big, soft, mostly transparent sprites hugging the ground read as blowing powder.
const puffTex = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, "rgba(255,255,255,0.8)");
  grd.addColorStop(0.45, "rgba(255,255,255,0.35)");
  grd.addColorStop(1, "rgba(255,255,255,0)");

  tex.colorSpace = THREE.SRGBColorSpace;

})();

  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 }));
  s.userData = {
    x: (Math.random() * 2 - 1) * PUFF_HALF, z: (Math.random() * 2 - 1) * PUFF_HALF,
    size: 9 + Math.random() * 10, alpha: 0.25 + Math.random() * 0.2, drift: 0.6 + Math.random() * 0.8,
  };

});

let weatherT = 0, windX = 0, windZ = 0;
const camDir = new THREE.Vector3();
function updateWeather(dt) {
  weatherT += dt;
  // A gusty wind that slowly changes strength and direction.
  const wx = 1.2 + Math.sin(weatherT * 0.23) * 1.6, wz = Math.cos(weatherT * 0.17) * 0.9;
  windX = wx; windZ = wz;
  camera.getWorldDirection(camDir);
  const cx = camera.position.x + camDir.x * 22, cz = camera.position.z + camDir.z * 22, cy = camera.position.y;

  for (let i = 0; i < FLAKES; i++) {
    const j = i * 3, s = flakeSeed[i], ph = s * 60;
    const x = flakePos[j] + (wx + Math.sin(weatherT * 1.3 + ph) * 0.5) * dt;
    const y = flakePos[j + 1] - (1 + s * 0.9) * dt;
    const z = flakePos[j + 2] + (wz + Math.cos(weatherT * 1.1 + ph) * 0.5) * dt;

const store = {

function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }

  if (!AC) return;

  master.connect(ac.destination);
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const wind = ac.createBufferSource();
  wind.buffer = buf; wind.loop = true;
  windFilter = ac.createBiquadFilter();
  windFilter.type = "bandpass"; windFilter.frequency.value = 400; windFilter.Q.value = 0.7;
  windGain = ac.createGain(); windGain.gain.value = 0;
  wind.connect(windFilter).connect(windGain).connect(master);

  carve.buffer = buf; carve.loop = true;

function blip(notes, { type = "square", gain = 0.1, slide = false, rise = false } = {}) {
  if (!ac || muted) return;
  let t = ac.currentTime;
  for (const [freq, dur] of notes) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), t + dur);
    if (rise) osc.frequency.exponentialRampToValueAtTime(freq * 1.8, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(master);
    osc.start(t);
    osc.stop(t + dur);
    t += dur;
  }
}

const ytBox = document.getElementById("yt");

function loadYouTube() {
  if (ytLoading) return;
  ytLoading = true;
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("yt-player", {
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => { ytReady = true; yt.setVolume(TRACK_VOL); },
        // Loop the song for as long as it's the one that should be playing.
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED && ytPlayingNow) yt.playVideo(); },
      },

  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";

// Called every frame: show and play the song for where you are, pause and hide it otherwise.
// It waits for the first click or key press (ac), since browsers block sound until then.
function syncTrack() {
  const t = ac && musicOn && !muted ? currentTrack() : null;
  if (t) {
    if (ytVideo !== t.video) {
      document.getElementById("yt-title").textContent = t.title;
      document.getElementById("yt-artist").textContent = t.artist;
      document.getElementById("yt-link").href = `https://www.youtube.com/watch?v=${t.video}`;
    }
    ytBox.classList.add("on");
    loadYouTube();
    if (!ytReady) return;
    if (ytVideo !== t.video) { ytVideo = t.video; yt.loadVideoById(t.video); ytPlayingNow = true; }
    else if (!ytPlayingNow) { yt.playVideo(); ytPlayingNow = true; }
  } else if (ytBox.classList.contains("on")) {
    ytBox.classList.remove("on");
    if (ytReady && ytPlayingNow) yt.pauseVideo();
    ytPlayingNow = false;
  }
}

if (speech) { pickVoice(); speech.addEventListener?.("voiceschanged", pickVoice); }

// Spins are said the way riders say them.
const SPIN_WORDS = { 180: "one-eighty", 360: "three-sixty", 540: "five-forty", 720: "seven-twenty", 900: "nine hundred", 1080: "ten-eighty", 1260: "twelve-sixty" };
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];

function say(text, rate = 1.08) {
  if (!speech || !voiceOn || muted) return;
  speech.cancel(); // only ever say the latest thing, never a backlog
  const u = new SpeechSynthesisUtterance(text);
  if (announcerVoice) u.voice = announcerVoice;
  u.lang = announcerVoice?.lang || "en-US";
  u.rate = rate;
  speech.speak(u);
}

// On landing. If the tricks were already called out in the air, just react to the landing.
function announceTrick(parts, pts, calledInAir) {
  const words = parts.map((p) => p.replace(/\d+/, (n) => SPIN_WORDS[n] || n)).join(", ");
  const hype = pts >= 4000 ? pickOne(["Unbelievable!", "Are you kidding me?", "Legendary!"])
    : pts >= 2000 ? pickOne(["Huge!", "Massive!", "Sending it!"])
    : pts >= 900 ? pickOne(["Nice!", "Clean!", "Stomped it!"])
    : "";
  if (calledInAir) say(hype || pickOne(["Landed it!", "Rode it out!", "Clean!"]));
  else say(`${words}! ${hype}`.trim());
}

// In the air, each rotation is called the moment you complete it: "Backflip", "three-sixty", "seven-twenty"...
function announceInAir(part) {
  say(part.replace(/^(Frontside|Backside) (\d+)$/, (_, side, n) => SPIN_WORDS[n] || n), 1.2);
}

function announceWipeout() {
  say(pickOne(["Ouch!", "Wipeout!", "Oof. Shake it off.", "Yard sale!", "That's gonna leave a mark."]), 1.12);
}

function toggleVoice() {
  voiceOn = !voiceOn;
  store.set("powderrun-voice", voiceOn ? "1" : "0");
  if (!voiceOn) speech?.cancel();
  voiceBtn.textContent = `Voice: ${voiceOn ? "on" : "off"}`;
  if (voiceOn) say("Announcer on.");
}

// Input
