<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powder Run</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0f1115;
    color: #e8e8ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    touch-action: none;
  }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  button {
    padding: 0.5rem 1.1rem;
    font-size: 0.95rem;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #3a78f0; }
  button.secondary { background: rgba(42, 47, 58, 0.85); }
  button.secondary:hover { background: #363c4a; }

  #hud {
    position: fixed; top: 12px; left: 12px;
    display: grid; grid-template-columns: auto auto; gap: 2px 14px;
    padding: 0.6rem 0.85rem;
    background: rgba(15, 17, 21, 0.6);
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
  }
  #hud .label { opacity: 0.6; font-size: 0.72rem; letter-spacing: 0.08em; align-self: center; }
  #top-right { position: fixed; top: 12px; right: 12px; display: flex; gap: 0.5rem; }
  #progress {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(34vw, 300px); height: 6px;
    background: rgba(15, 17, 21, 0.55); border-radius: 3px; overflow: hidden;
  }
  #progress div { height: 100%; width: 0; background: #4f8cff; }
  #popup {
    position: fixed; top: 20%; left: 0; right: 0;
    text-align: center; font-weight: 700;
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  #popup .pts { display: block; font-size: 0.75em; color: #ffd84f; }
  #popup.bad .pts { color: #ff6b6b; }
  #count {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(3rem, 14vw, 8rem); font-weight: 800; color: #fff;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  #charge {
    position: fixed; bottom: 24%; left: 50%; transform: translateX(-50%);
    width: 120px; height: 8px; border-radius: 4px; overflow: hidden;
    background: rgba(15, 17, 21, 0.6); opacity: 0; transition: opacity 0.15s;
  }
  #charge div { height: 100%; width: 0; background: #ffd84f; }
  #panel {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 17, 21, 0.45);
    padding: 1rem;
  }
  #panel.hidden { display: none; }
  .card {
    background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px;
    padding: 1.4rem 1.6rem; width: min(100%, 440px); text-align: center;
  }
  .card h1 { font-size: 1.4rem; margin: 0 0 0.4rem; font-weight: 600; letter-spacing: 0.04em; }
  .card p { margin: 0.3rem 0 0.8rem; font-size: 0.9rem; opacity: 0.75; line-height: 1.4; }
  .card table { margin: 0.5rem auto 1rem; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
  .card td { padding: 0.18rem 0.6rem; }
  .card td:first-child { opacity: 0.65; }
  .card .num { text-align: right; font-variant-numeric: tabular-nums; }
  .card .total td { font-weight: 700; border-top: 1px solid #2a2f3a; padding-top: 0.4rem; opacity: 1; }
  .card .new { color: #ffd84f; font-weight: 600; }
  .card th { padding: 0 0.6rem 0.2rem; font-size: 0.72rem; font-weight: 600; opacity: 0.55; text-align: left; }
  .card th.num { text-align: right; }
  .card .standings .me td { color: #ffd84f; opacity: 1; font-weight: 600; }
  .card .buttons { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
  .card .mp { border-top: 1px solid #2a2f3a; margin-top: 1.1rem; padding-top: 0.9rem; }
  .card .mp h2 { font-size: 0.75rem; letter-spacing: 0.08em; opacity: 0.6; margin: 0 0 0.5rem; font-weight: 600; }
  .card .row { display: flex; gap: 0.5rem; margin: 0.45rem 0; }
  .card .row input { flex: 1; min-width: 0; }
  .card .wide { flex: 1; }
  .card input {
    font: inherit; font-size: 0.95rem; padding: 0.45rem 0.6rem; border-radius: 8px;
    border: 1px solid #2a2f3a; background: #0f1115; color: inherit; user-select: text;
  }
  .card #code { text-transform: uppercase; letter-spacing: 0.15em; }
  .card p.err { color: #ff8a80; opacity: 1; }
  .card .code { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.25em; margin: 0.1rem 0 0.6rem; user-select: text; }
  .card ul.players { list-style: none; padding: 0; margin: 0.8rem auto; max-width: 280px; text-align: left; }
  .card ul.players li { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid #2a2f3a; }
  .card .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; }
  .card .tag { font-size: 0.75rem; opacity: 0.6; }
  .card button.small { padding: 0.15rem 0.6rem; }
  kbd {
    font-family: inherit; font-size: 0.8em;
    padding: 0.05rem 0.35rem; border: 1px solid #2a2f3a; border-radius: 4px; background: #0f1115;
  }

  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: flex; position: fixed; left: 12px; right: 12px; bottom: 16px;
      justify-content: space-between; pointer-events: none;
    }
    #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
    #touch button {
      width: 62px; height: 62px; padding: 0; border-radius: 50%;
      background: rgba(23, 26, 33, 0.7); border: 1px solid #2a2f3a;
      font-size: 0.75rem; font-weight: 600;
    }
    .keys-only { display: none; }
  }
</style>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <span class="label">TIME</span><strong id="time">0.00</strong>
  <span class="label">SPEED</span><span><strong id="speed">0</strong> km/h</span>
  <span class="label">TRICKS</span><strong id="tricks">0</strong>
  <span class="label">POS</span><strong id="pos">–</strong>
  <span class="label">BEST</span><span id="best">–</span>
</div>
<div id="progress"><div></div></div>
<div id="top-right">
  <button id="mute" class="secondary">Sound: on</button>
  <button id="restart" class="secondary">Restart</button>
  <button id="leave-lobby" class="secondary" style="display: none">Leave lobby</button>
</div>
<div id="popup"></div>
<div id="count"></div>
<div id="charge"><div></div></div>

<div id="touch">
  <div class="grp">
    <button data-t="left">◀</button>
    <button data-t="right">▶</button>
    <button data-t="brake">BRAKE</button>
  </div>
  <div class="grp">
    <button data-t="tuck">TUCK</button>
    <button data-t="grab">GRAB</button>
    <button data-t="jump">JUMP</button>
  </div>
</div>

<div id="panel"><div class="card" id="card"></div></div>

<script type="module">
import * as THREE from "three";

// ---------------------------------------------------------------------------
// Course definition. Downhill is +Z. The terrain is a pure function of (x, z),
// which both the mesh and the physics sample, so they always agree.
// ---------------------------------------------------------------------------
const COURSE_LEN = 1400;   // metres from start to the finish line
const RUNOUT = 180;        // flat-ish area past the finish
const HALF_W = 18;         // half-width of the groomed run
const SLOPE = 0.3;         // average fall-line gradient
const PAR_TIME = 70;       // seconds; finishing faster earns a time bonus

const G_GROUND = 22;       // gravity used for sliding along the slope
const G_AIR = 28;          // gravity in the air (a little floaty-but-snappy)
const TURN_RATE = 2.0;     // rad/s carve rate
const SPIN_RATE = 6.8;     // rad/s spin rate in the air
const SPIN_POINTS = [0, 100, 250, 450, 700, 1000, 1400, 1800];
const FLIP_RATE = 6.0;     // rad/s flip rate in the air
const FLIP_POINTS = [0, 600, 1500, 2800, 4500];
const FLIP_LAND_TOL = 0.75; // rad of leftover flip rotation you can still ride away from
const FLIP_PIVOT = 0.9;     // flips rotate about the rider's middle, not their feet

function mulberry32(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7331);
const smooth = (t) => t * t * (3 - 2 * t);
const wrapAngle = (a) => a - Math.PI * 2 * Math.round(a / (Math.PI * 2));

const center = (z) => 16 * Math.sin(z / 130) + 7 * Math.sin(z / 53 + 1.3);

// Kickers: a ramp that curves up over `len` metres, then drops off at the lip.
const KICK_HALF = 5, KICK_FADE = 2.5, LIP_DROP = 2;
const kickers = [];
{
  let z = 150, i = 0;
  while (z < COURSE_LEN - 80) {
    const big = i % 4 === 3;
    kickers.push({ z, x: center(z) + [0, -7, 6, -3, 8, -6][i % 6], h: big ? 3.2 : 2.1, len: big ? 15 : 12 });
    z += 100 + (i % 3) * 20;
    i++;
  }
}

function kickerH(x, z) {
  for (const k of kickers) {
    const u = z - k.z;
    if (u < -k.len || u > LIP_DROP) continue;
    const d = Math.abs(x - k.x);
    if (d > KICK_HALF + KICK_FADE) continue;
    const lat = d < KICK_HALF ? 1 : smooth(1 - (d - KICK_HALF) / KICK_FADE);
    const p = u <= 0 ? k.h * ((u + k.len) / k.len) ** 2 : k.h * (1 - u / LIP_DROP);
    return p * lat;
  }
  return 0;
}

function terrainH(x, z) {
  let h = -Math.min(z, COURSE_LEN) * SLOPE;
  if (z > COURSE_LEN) h -= (z - COURSE_LEN) * 0.04;
  h += 0.7 * Math.sin(z * 0.045) * Math.cos(x * 0.09) + 0.35 * Math.sin(z * 0.13 + x * 0.05);
  const d = Math.abs(x - center(z));
  if (d > HALF_W) {
    const e = Math.min(d - HALF_W, 28);
    h += e * e * 0.09 + e * 0.15 + Math.max(0, d - HALF_W - 28) * 0.5;
  }
  return h + kickerH(x, z);
}

function grad(x, z) {
  const e = 0.15;
  return [
    (terrainH(x + e, z) - terrainH(x - e, z)) / (2 * e),
    (terrainH(x, z + e) - terrainH(x, z - e)) / (2 * e),
  ];
}

// ---------------------------------------------------------------------------
// Renderer, scene, lights
// ---------------------------------------------------------------------------
const canvas = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const SKY = 0xa9cdf0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 70, 340);

const camera = new THREE.PerspectiveCamera(64, window.innerWidth / window.innerHeight, 0.1, 2000);

scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x7d90b0, 1.3));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---------------------------------------------------------------------------
// Terrain mesh
// ---------------------------------------------------------------------------
{
  const X0 = -95, X1 = 95, NX = 76;
  const Z0 = -60, Z1 = COURSE_LEN + RUNOUT, DZ = 1.25;
  const NZ = Math.round((Z1 - Z0) / DZ);
  const pos = new Float32Array((NX + 1) * (NZ + 1) * 3);
  const col = new Float32Array((NX + 1) * (NZ + 1) * 3);
  let p = 0;
  for (let j = 0; j <= NZ; j++) {
    const z = Z0 + j * DZ;
    const c = center(z);
    for (let i = 0; i <= NX; i++) {
      const x = X0 + (i * (X1 - X0)) / NX;
      pos[p] = x; pos[p + 1] = terrainH(x, z); pos[p + 2] = z;
      const d = Math.abs(x - c);
      const n = (rand() - 0.5) * 0.04;
      let r, g, b;
      if (kickerH(x, z) > 0.05) { r = 0.5; g = 0.72; b = 1.0; }
      else if (d < HALF_W) { r = 0.9 + n; g = 0.93 + n; b = 0.98 + n * 0.5; }
      else {
        const e = Math.min(1, (d - HALF_W) / 24);
        r = 0.84 - e * 0.08 + n; g = 0.88 - e * 0.06 + n; b = 0.97 + n * 0.5;
      }
      col[p] = r; col[p + 1] = g; col[p + 2] = b;
      p += 3;
    }
  }
  const idx = new Uint32Array(NX * NZ * 6);
  let q = 0;
  for (let j = 0; j < NZ; j++) {
    for (let i = 0; i < NX; i++) {
      const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
      idx[q++] = a; idx[q++] = c; idx[q++] = b;
      idx[q++] = b; idx[q++] = c; idx[q++] = d;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ---------------------------------------------------------------------------
// Trees, course poles, kicker lips, banners, far mountains
// ---------------------------------------------------------------------------
const trees = [];
const treeBuckets = new Map();
const BUCKET = 8;
for (let z = -50; z < COURSE_LEN + RUNOUT; z += 2.2) {
  for (const side of [-1, 1]) {
    if (rand() > 0.55) continue;
    const d = HALF_W + 2.5 + rand() ** 1.6 * 26;
    const x = center(z) + side * d + (rand() - 0.5) * 1.5;
    const t = { x, z, y: terrainH(x, z), s: 0.8 + rand() * 0.7 };
    trees.push(t);
    const key = Math.floor(z / BUCKET);
    if (!treeBuckets.has(key)) treeBuckets.set(key, []);
    treeBuckets.get(key).push(t);
  }
}

const dummy = new THREE.Object3D();
function instanced(geo, color, list, place) {
  const m = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true }), list.length);
  m.castShadow = true;
  m.frustumCulled = false;
  const c = new THREE.Color();
  list.forEach((item, i) => {
    place(item, dummy, c);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
    m.setColorAt(i, c);
  });
  scene.add(m);
  return m;
}
const greens = [0x2f5d46, 0x356b4c, 0x28503f, 0x3c7352];
instanced(new THREE.CylinderGeometry(0.22, 0.3, 1.4, 6), 0xffffff, trees, (t, o, c) => {
  o.position.set(t.x, t.y + 0.5 * t.s, t.z); o.scale.setScalar(t.s); o.rotation.set(0, 0, 0); c.set(0x5a3e2b);
});
instanced(new THREE.ConeGeometry(1.9, 3.4, 7), 0xffffff, trees, (t, o, c) => {
  o.position.set(t.x, t.y + 2.6 * t.s, t.z); o.scale.setScalar(t.s); o.rotation.set(0, t.x, 0);
  c.set(greens[Math.floor(Math.abs(t.x * 7 + t.z)) % greens.length]);
});
instanced(new THREE.ConeGeometry(1.25, 2.8, 7), 0xffffff, trees, (t, o, c) => {
  o.position.set(t.x, t.y + 4.6 * t.s, t.z); o.scale.setScalar(t.s); o.rotation.set(0, t.z, 0);
  c.set(0xe8f0fa); // snow-capped tops
});

const poles = [];
for (let z = 20; z < COURSE_LEN; z += 25) {
  for (const side of [-1, 1]) {
    const x = center(z) + side * (HALF_W + 0.6);
    poles.push({ x, z, y: terrainH(x, z), side });
  }
}
instanced(new THREE.CylinderGeometry(0.07, 0.07, 1.8, 6), 0xffffff, poles, (p, o, c) => {
  o.position.set(p.x, p.y + 0.9, p.z); o.scale.setScalar(1); o.rotation.set(0, 0, 0);
  c.set(p.side < 0 ? 0xff6a2a : 0x3a6dff);
});
instanced(new THREE.BoxGeometry(KICK_HALF * 2, 0.25, 0.5), 0xffffff, kickers, (k, o, c) => {
  o.position.set(k.x, terrainH(k.x, k.z - 0.01), k.z - 0.25); o.scale.setScalar(1); o.rotation.set(0, 0, 0);
  c.set(0xff8a2a);
});

function bannerTexture(text, bg) {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#ffffff";
  g.font = "bold 84px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, c.width / 2, c.height / 2 + 4);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function addBanner(z, text, bg) {
  const c = center(z);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a });
  let top = -Infinity;
  for (const side of [-1, 1]) {
    const x = c + side * HALF_W;
    const y = terrainH(x, z);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 10, 8), poleMat);
    pole.position.set(x, y + 5, z);
    pole.castShadow = true;
    scene.add(pole);
    top = Math.max(top, y + 10);
  }
  const banner = new THREE.Mesh(
    new THREE.PlaneGeometry(HALF_W * 2, HALF_W * 2 / 8),
    new THREE.MeshBasicMaterial({ map: bannerTexture(text, bg), side: THREE.DoubleSide })
  );
  banner.position.set(c, top - 1.4, z);
  banner.rotation.y = Math.PI;
  scene.add(banner);
}
addBanner(4, "START", "#3a6dff");
addBanner(COURSE_LEN, "FINISH", "#e0443a");

const mountains = new THREE.Group();
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xdfe8f4, flatShading: true, fog: false });
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + rand() * 0.2;
    const r = 1000 + rand() * 250;
    const ht = 520 + rand() * 260;
    const m = new THREE.Mesh(new THREE.ConeGeometry(300 + rand() * 150, ht, 6), mat);
    m.position.set(Math.sin(a) * r, ht / 2 - 380, Math.cos(a) * r);
    m.rotation.y = rand() * 3;
    mountains.add(m);
  }
  scene.add(mountains);
}

// ---------------------------------------------------------------------------
// Rider models. Forward is local +Z; the rider stands sideways facing +X.
// ---------------------------------------------------------------------------
const LEG_H = 0.8;
const matCache = new Map();
function mat(color) {
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.7, flatShading: true }));
  return matCache.get(color);
}
function part(geo, m, parent, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
const boardGeo = new THREE.BoxGeometry(0.5, 0.06, 1.7);
const bindingGeo = new THREE.BoxGeometry(0.52, 0.065, 0.12);
const legGeo = new THREE.BoxGeometry(0.2, LEG_H, 0.2).translate(0, LEG_H / 2, 0);
const torsoGeo = new THREE.BoxGeometry(0.34, 0.62, 0.52).translate(0, 0.31, 0);
const headGeo = new THREE.SphereGeometry(0.19, 10, 8);
const helmetGeo = new THREE.SphereGeometry(0.2, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2);
const goggleGeo = new THREE.BoxGeometry(0.08, 0.09, 0.3);
const armGeo = new THREE.BoxGeometry(0.13, 0.58, 0.13).translate(0, -0.27, 0);

function buildRiderModel(look) {
  const root = new THREE.Group(), pose = new THREE.Group(), upper = new THREE.Group();
  root.add(pose);
  scene.add(root);
  part(boardGeo, mat(look.board), pose, 0, 0.03, 0);
  part(bindingGeo, mat(0xffd84f), pose, 0, 0.035, 0.55);
  part(bindingGeo, mat(0xffd84f), pose, 0, 0.035, -0.55);
  const legs = [part(legGeo, mat(look.pants), pose, 0, 0.06, 0.28), part(legGeo, mat(look.pants), pose, 0, 0.06, -0.28)];
  pose.add(upper);
  part(torsoGeo, mat(look.jacket), upper);
  part(headGeo, mat(0xf1c9a5), upper, 0, 0.8, 0);
  part(helmetGeo, mat(look.helmet), upper, 0, 0.82, 0);
  part(goggleGeo, mat(0x4fd8ff), upper, 0.17, 0.82, 0);
  const arms = [new THREE.Group(), new THREE.Group()];
  arms.forEach((g, i) => {
    g.position.set(0, 0.58, i ? -0.33 : 0.33);
    part(armGeo, mat(look.jacket), g);
    upper.add(g);
  });
  return { root, pose, upper, legs, arms };
}

// A floating name above other riders' heads.
function nameTag(text, color) {
  const c = document.createElement("canvas");

// Snow spray particles
// ---------------------------------------------------------------------------
const SPRAY_N = 1200;
const sprayPos = new Float32Array(SPRAY_N * 3).fill(-9999);
const sprayVel = new Float32Array(SPRAY_N * 3);

const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute("position", new THREE.BufferAttribute(sprayPos, 3));
const dot = document.createElement("canvas");
dot.width = dot.height = 32;
{
  const g = dot.getContext("2d");
  const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 32, 32);
}
const spray = new THREE.Points(sprayGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.16, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false,
}));
spray.frustumCulled = false;
scene.add(spray);
let sprayNext = 0, sprayAcc = 0;
const tailLocal = new THREE.Vector3();

function emitSpray(r, rate, dt) {
  sprayAcc += rate * dt;
  while (sprayAcc >= 1) {
    sprayAcc -= 1;
    const i = sprayNext; sprayNext = (sprayNext + 1) % SPRAY_N;
    tailLocal.set((rand() - 0.5) * 0.5, 0.08, -0.75 + rand() * 0.6);
    r.model.root.localToWorld(tailLocal);
    sprayPos[i * 3] = tailLocal.x; sprayPos[i * 3 + 1] = tailLocal.y; sprayPos[i * 3 + 2] = tailLocal.z;
    sprayVel[i * 3] = r.vx * 0.3 + (rand() - 0.5) * 4;
    sprayVel[i * 3 + 1] = 1.5 + rand() * 3;
    sprayVel[i * 3 + 2] = r.vz * 0.3 + (rand() - 0.5) * 4;
    sprayLife[i] = 0.4 + rand() * 0.4;
  }
}
function updateSpray(dt) {
  for (let i = 0; i < SPRAY_N; i++) {
    if (sprayLife[i] <= 0) continue;
    sprayLife[i] -= dt;
    if (sprayLife[i] <= 0) { sprayPos[i * 3 + 1] = -9999; continue; }
    sprayVel[i * 3 + 1] -= 9 * dt;
    sprayPos[i * 3] += sprayVel[i * 3] * dt;
    sprayPos[i * 3 + 1] += sprayVel[i * 3 + 1] * dt;
    sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt;
  }
  sprayGeo.attributes.position.needsUpdate = true;
}
function clearSpray() { sprayLife.fill(0); sprayPos.fill(-9999); }

const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let muted = store.get("powderrun-muted") === "1";
let ac = null, master = null, windGain, windFilter, carveGain;

function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = muted ? 0 : 1;
  master.connect(ac.destination);
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const wind = ac.createBufferSource();
  wind.buffer = buf; wind.loop = true;
  windFilter = ac.createBiquadFilter();
  windFilter.type = "bandpass"; windFilter.frequency.value = 400; windFilter.Q.value = 0.7;
  windGain = ac.createGain(); windGain.gain.value = 0;
  wind.connect(windFilter).connect(windGain).connect(master);
  const carve = ac.createBufferSource();
  carve.buffer = buf; carve.loop = true;
  const hp = ac.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 2200;
  carveGain = ac.createGain(); carveGain.gain.value = 0;
  carve.connect(hp).connect(carveGain).connect(master);
  wind.start();
  carve.start(0, 0.7);
}

function blip(notes, { type = "square", gain = 0.1, slide = false, rise = false } = {}) {
  if (!ac || muted) return;
  let t = ac.currentTime;
  for (const [freq, dur] of notes) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), t + dur);
    if (rise) osc.frequency.exponentialRampToValueAtTime(freq * 1.8, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(master);
    osc.start(t);
    osc.stop(t + dur);
    t += dur;
  }
}
const sfx = {
  count: () => blip([[440, 0.15]], { gain: 0.08 }),
  go: () => blip([[880, 0.35]], { gain: 0.08 }),
  jump: () => blip([[300, 0.1]], { type: "triangle", gain: 0.14, rise: true }),
  land: () => blip([[130, 0.09]], { type: "triangle", gain: 0.2, slide: true }),
  trick: () => blip([[660, 0.06], [880, 0.06], [1320, 0.14]], { gain: 0.06 }),
  crash: () => blip([[240, 0.45]], { type: "sawtooth", gain: 0.14, slide: true }),
  finish: () => blip([[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.4]], { type: "triangle", gain: 0.2 }),
};
function updateAudio(speed, slip) {
  if (!ac) return;
  const t = ac.currentTime;
  const moving = state === "run";
  const s = moving ? speed : 0;
  windGain.gain.setTargetAtTime(Math.min(0.22, (s / 35) ** 2 * 0.2), t, 0.15);
  windFilter.frequency.setTargetAtTime(250 + s * 25, t, 0.15);
  const c = moving && me.grounded ? Math.min(0.1, slip * 0.012 + s * 0.0015) : 0;
  carveGain.gain.setTargetAtTime(c, t, 0.05);
}

function newRider(e, isMe) {

    id: e.id, name: e.name, look: e.look, isPlayer: isMe, bot: null, remote: false, net: null, netRaw: null,

function disposeRider(r) {

}

const riders = [];
let me = newRider({ id: "me", name: "You", look: 0 }, true);

// A roster is the list of riders in a race: [{ id, name, look, bot? }], where
// `bot` is a bot's skill. Every browser in a lobby builds the same roster.
function setRoster(roster) {
  for (const r of riders) if (r !== me) disposeRider(r);
  riders.length = 0;
  roster.forEach((e, i) => {
    let r;
    if (e.id === me.id) {
      if (me.look !== e.look) { disposeRider(me); me = newRider(e, true); }
      me.name = e.name;
      r = me;
    } else {
      r = newRider(e, false);
      // Bots run in solo races and on the host; other browsers follow the host's copy.
      if (e.bot != null && net.role !== "client") r.bot = { skill: e.bot };
      else r.remote = true;

    r.lane = LANES[i % LANES.length];
    resetRider(r);
    riders.push(r);

}
const soloRoster = () => [
  { id: me.id, name: "You", look: 0 },
  ...BOTS.map((b, i) => ({ id: `bot${i}`, name: b.name, look: b.look, bot: b.skill })),

function removeRider(id) {
  const i = riders.findIndex((r) => r.id === id && r !== me);
  if (i < 0) return;
  disposeRider(riders[i]);
  riders.splice(i, 1);
  if (resultsShown) renderResults();
}

function resetRider(r) {

    x: center(0) + r.lane, z: 0, y: 0, vx: 0, vy: 0, vz: 0,
    heading: 0, spin: 0, flip: 0, flipYaw: 0, sw: false, takeoffSw: false,

    crashT: 0, crashSpin: 0, lean: 0, crouch: 0,

// What a browser sends about the riders it runs, about 15 times a second.
const r2 = (v) => Math.round(v * 100) / 100;
const NET_KEYS = ["x", "y", "z", "vx", "vy", "vz", "yaw", "fl", "fy", "g", "gr", "c", "ch", "sl", "k", "ts", "fin", "ft"];
function packRider(r) {
  if (r.remote) return r.netRaw;
  const i = r.inp;
  return {
    id: r.id, x: r2(r.x), y: r2(r.y), z: r2(r.z), vx: r2(r.vx), vy: r2(r.vy), vz: r2(r.vz),
    yaw: r2(r.heading + (r.sw ? Math.PI : 0) + r.spin), fl: r2(r.flip), fy: r2(r.flipYaw),
    g: r.grounded ? 1 : 0, gr: r.grabbing ? 1 : 0, c: r2(r.crashT), ch: r2(r.charge), sl: r2(r.slip),
    k: (i.left ? 1 : 0) | (i.right ? 2 : 0) | (i.tuck ? 4 : 0) | (i.brake ? 8 : 0),

// Incoming state comes from another browser, so only finite numbers are kept.
function applyNet(r, s) {
  if (!s || typeof s !== "object") return;
  const v = { id: r.id };
  for (const k of NET_KEYS) v[k] = Number.isFinite(s[k]) ? s[k] : 0;
  r.netRaw = v;
  r.net = { ...v, at: performance.now() };
  r.trickScore = v.ts;

// Draw a remote rider where its last update says it should be by now, eased so
// the 15 updates a second don't show as jumps.
function followNet(r, dt) {
  const n = r.net;
  if (!n) return;
  const t = Math.min(0.25, (performance.now() - n.at) / 1000);
  const tx = n.x + n.vx * t, tz = n.z + n.vz * t;
  const ty = n.g ? terrainH(tx, tz) : n.y + n.vy * t - 0.5 * G_AIR * t * t;
  const k = 1 - Math.exp(-12 * dt), ka = 1 - Math.exp(-20 * dt);
  if (Math.hypot(tx - r.x, ty - r.y, tz - r.z) > 8) { r.x = tx; r.y = ty; r.z = tz; }
  else { r.x += (tx - r.x) * k; r.y += (ty - r.y) * k; r.z += (tz - r.z) * k; }
  if (n.g) r.y = terrainH(r.x, r.z);
  r.vx = n.vx; r.vy = n.vy; r.vz = n.vz;
  r.heading = wrapAngle(r.heading + wrapAngle(n.yaw - r.heading) * ka);
  r.spin = 0; r.sw = false;
  r.flip = wrapAngle(r.flip + wrapAngle(n.fl - r.flip) * ka);
  r.flipYaw = n.fy;
  r.grounded = !!n.g; r.grabbing = !!n.gr; r.charge = n.ch; r.slip = n.sl;
  r.crashT = n.c;
  r.crashSpin = r.crashT > 0 ? r.crashSpin + 9 * dt : 0;

// ---------------------------------------------------------------------------
// Game state and physics
// ---------------------------------------------------------------------------
const STEP = 1 / 180;        // fixed physics step, so every rider behaves the same at any frame rate
let state = "menu";          // menu | countdown | run
let raceTime = 0, countT = 0, simAcc = 0;
let resultsShown = false, lastCount = 0, result = null;
let best = Number(store.get("powderrun-best")) || 0;

const canControl = (r) => state === "run" && r.crashT <= 0 && !r.finished;

function leaveGround(r, y, vy) {
  r.grounded = false;
  r.y = y; r.vy = vy;
  r.airTime = 0; r.spin = 0; r.flip = 0; r.grabTime = 0; r.grabbing = false; r.popped = false;
  r.takeoffSw = r.sw;
  // Flips turn about the axis across the direction of travel at takeoff, so
  // "forward" always means toward where you're headed, whichever way you've spun.
  r.flipYaw = Math.hypot(r.vx, r.vz) > 1 ? Math.atan2(r.vx, r.vz) : r.heading;
}

function ollie(r, late) {
  const base = late ? r.vy : r.groundVy;
  if (r.grounded) leaveGround(r, r.y + 0.02, base);
  r.vy = base + 4 + 4.5 * r.charge;
  r.popped = true;
  if (r.isPlayer) sfx.jump();
}

function crash(r, reason) {
  if (r.crashT > 0) return;
  r.crashT = 1.6;
  r.crashSpin = 0;
  r.grabbing = false; r.spin = 0; r.flip = 0; r.charge = 0;
  r.vx *= 0.35; r.vz *= 0.35;
  if (r.isPlayer) { sfx.crash(); showPopup(reason, "WIPEOUT", true); }
}

function recover(r) {
  const s = Math.hypot(r.vx, r.vz);
  r.heading = s > 3 ? Math.atan2(r.vx, r.vz) : 0;
  r.sw = false; r.crashSpin = 0;
}

function groundStep(r, h, inp) {
  const ctl = canControl(r);
  const [gx, gz] = grad(r.x, r.z);
  const inv = 1 / (1 + gx * gx + gz * gz);
  r.vx += -G_GROUND * gx * inv * h;
  r.vz += -G_GROUND * gz * inv * h;

  const steer = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  const brake = ctl && inp.brake;
  const tuck = ctl && inp.tuck && !brake;
  r.heading -= steer * TURN_RATE * (brake ? 1.3 : 1) * h;

  const fx = Math.sin(r.heading), fz = Math.cos(r.heading);
  const sx = Math.cos(r.heading), sz = -Math.sin(r.heading);
  let vf = r.vx * fx + r.vz * fz;
  let vs = r.vx * sx + r.vz * sz;
  r.slip = Math.abs(vs);

  // Edges bite: sideways speed bleeds off, and most of it is redirected forward when carving.
  const grip = r.crashT > 0 ? 1.5 : brake ? 3 : 7;
  const keep = Math.exp(-grip * h);
  const lost = Math.abs(vs) * (1 - keep);
  vs *= keep;
  if (r.crashT <= 0) vf += Math.sign(vf || 1) * lost * (brake ? 0.1 : 0.55);

  const kAir = tuck ? 0.0045 : 0.0085;
  vf -= (0.03 * vf + kAir * vf * Math.abs(vf)) * h;
  if (brake) vf *= Math.exp(-1.2 * h);
  if (r.crashT > 0) vf *= Math.exp(-1.8 * h);
  if (r.finished) { vf *= Math.exp(-1.4 * h); vs *= Math.exp(-3 * h); }

  r.vx = vf * fx + vs * sx;
  r.vz = vf * fz + vs * sz;

  const nx = r.x + r.vx * h, nz = r.z + r.vz * h;
  const ground = terrainH(nx, nz);
  const yPred = r.y + r.groundVy * h - 0.5 * G_AIR * h * h;
  r.x = nx; r.z = nz;
  if (yPred > ground + 0.04) {
    // The ground fell away faster than gravity can pull us down: we're airborne.
    leaveGround(r, yPred, r.groundVy - G_AIR * h);
  } else {
    // Keep speed along the surface constant when the slope changes, so riding
    // up a steep bank slows you down instead of handing out free speed.
    const [gx2, gz2] = grad(nx, nz);
    const sp = Math.hypot(r.vx, r.vz) || 1;
    const mOld = (gx * r.vx + gz * r.vz) / sp, mNew = (gx2 * r.vx + gz2 * r.vz) / sp;
    const scale = Math.sqrt((1 + mOld * mOld) / (1 + mNew * mNew));
    r.vx *= scale; r.vz *= scale;
    // Use the actual height change rather than the local gradient, so touching
    // down for one substep on a kicker's drop-off doesn't glue us to the snow.
    // Capped so a sudden position change (bouncing off a tree) can't launch us.
    r.groundVy = Math.min((ground - r.y) / h, Math.max(mOld, mNew) * sp + 2);
    r.y = ground;
  }
}

function airStep(r, h, inp) {
  r.vy -= G_AIR * h;
  const drag = Math.exp(-0.05 * h);
  r.vx *= drag; r.vz *= drag;
  r.x += r.vx * h; r.y += r.vy * h; r.z += r.vz * h;
  r.airTime += h;
  if (canControl(r)) {
    const steer = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    r.spin -= steer * SPIN_RATE * h;
    const pitch = (inp.tuck ? 1 : 0) - (inp.brake ? 1 : 0);
    r.flip += pitch * FLIP_RATE * h;
    if (inp.grab) {
      if (!r.grabbing) {
        r.grabbing = true;
        if (!r.grabName) r.grabName = inp.tuck ? "Tail" : inp.brake ? "Nose" : steer ? "Method" : "Indy";
      }
      r.grabTime += h;
    } else r.grabbing = false;
  }
  const ground = terrainH(r.x, r.z);
  if (r.y <= ground) land(r, ground);
}

function land(r, ground) {
  r.y = ground;
  const [gx, gz] = grad(r.x, r.z);
  const len = Math.hypot(gx, 1, gz);
  const nx = -gx / len, ny = 1 / len, nz = -gz / len;
  const vn = r.vx * nx + r.vy * ny + r.vz * nz;
  if (vn < 0) { r.vx -= vn * nx; r.vy -= vn * ny; r.vz -= vn * nz; }
  r.grounded = true;
  r.groundVy = gx * r.vx + gz * r.vz;
  r.charge = 0;
  const airTime = r.airTime;
  const wasGrabbing = r.grabbing;
  const grabTime = r.grabTime, grabName = r.grabName;
  r.grabbing = false; r.grabName = "";

  if (!canControl(r)) { r.spin = 0; r.flip = 0; return; }

  const phi = Math.atan2(r.vx, r.vz);
  const rel = wrapAngle(r.heading + (r.sw ? Math.PI : 0) + r.spin - phi);
  const spin = r.spin, flip = r.flip;
  const flipLeft = wrapAngle(flip);
  r.spin = 0; r.flip = 0;
  if (Math.abs(flipLeft) > FLIP_LAND_TOL) {
    if (Math.abs(flipLeft) > 2.2) return crash(r, "Landed on your head!");
    return crash(r, Math.abs(flip) < Math.PI * 2 - FLIP_LAND_TOL ? "Under-rotated!" : "Over-rotated!");
  }
  if (wasGrabbing && airTime > 0.3) return crash(r, "Still grabbing!");
  if (Math.abs(rel) < 0.75) r.sw = false;
  else if (Math.abs(rel) > Math.PI - 0.75) r.sw = true;
  else return crash(r, "Landed sideways!");
  r.heading = phi;
  if (airTime > 0.25 && r.isPlayer) sfx.land();
  scoreTrick(r, airTime, spin, flip, grabTime, grabName);
}

const FLIP_COUNT = ["", "", "Double ", "Triple ", "Quad "];
function scoreTrick(r, airTime, spin, flip, grabTime, grabName) {
  const n180 = Math.round(Math.abs(spin) / Math.PI);
  const nFlip = Math.round(Math.abs(flip) / (Math.PI * 2));
  const parts = [];
  let pts = 0;
  if (nFlip > 0) {
    const i = Math.min(nFlip, FLIP_POINTS.length - 1);
    parts.push(`${FLIP_COUNT[nFlip] ?? nFlip + "x "}${flip > 0 ? "Frontflip" : "Backflip"}`);
    pts += FLIP_POINTS[i];
  }
  if (n180 > 0) {
    parts.push(`${spin > 0 ? "Frontside" : "Backside"} ${n180 * 180}`);
    pts += SPIN_POINTS[Math.min(n180, SPIN_POINTS.length - 1)];
  }
  if (grabTime > 0.12) {
    parts.push(`${grabName} Grab`);
    pts += Math.round(100 + 400 * Math.min(grabTime, 1.5));
  }
  if (parts.length === 0 && airTime > 0.8) parts.push("Big Air");
  if (airTime > 0.6) pts += Math.round(airTime * 60);
  if (parts.length === 0) return;
  const kinds = (nFlip > 0) + (n180 > 0) + (grabTime > 0.12);
  if (kinds >= 2) pts = Math.round(pts * (kinds === 3 ? 2 : 1.5));
  if (r.takeoffSw) { parts.unshift("Switch"); pts = Math.round(pts * 1.25); }
  r.trickScore += pts;
  if (r.isPlayer) { sfx.trick(); showPopup(parts.join(" + "), `+${pts}`, false); }
}

function checkTrees(r) {
  const key = Math.floor(r.z / BUCKET);
  for (let k = key - 1; k <= key + 1; k++) {
    const list = treeBuckets.get(k);
    if (!list) continue;
    for (const t of list) {
      const dx = r.x - t.x, dz = r.z - t.z;
      const rad = 0.45 * t.s + 0.35;
      if (dx * dx + dz * dz >= rad * rad || r.y > t.y + 5.5 * t.s) continue;
      const d = Math.hypot(dx, dz) || 1;
      r.x = t.x + (dx / d) * (rad + 0.05);
      r.z = t.z + (dz / d) * (rad + 0.05);
      r.vx = (dx / d) * 3; r.vz = Math.max(r.vz * 0.15, 1);
      if (!r.finished) crash(r, "Tree!");
    }
  }
}

function handleJump(r, inp, h) {
  const held = inp.jump && canControl(r);
  if (held) {
    if (r.grounded) r.charge = Math.min(1, r.charge + h / 0.5);
  } else if (r.jumpPrev && canControl(r)) {
    // Release: pop off the ground, or a late pop just after leaving a lip.
    if (r.grounded) ollie(r, false);
    else if (r.airTime < 0.18 && !r.popped) ollie(r, true);
    r.charge = 0;
  }
  if (!canControl(r)) r.charge = 0;
  r.jumpPrev = held;
}

function stepRider(r, h, inp) {
  r.inp = inp;
  handleJump(r, inp, h);
  if (r.grounded) groundStep(r, h, inp); else airStep(r, h, inp);
  checkTrees(r);
  if (r.crashT > 0) {
    r.crashT -= h;
    r.crashSpin += h * 9;
    if (r.crashT <= 0) recover(r);
  }
  if (!r.finished && r.z >= COURSE_LEN) {
    r.finished = true;
    r.finishTime = raceTime;
    if (r.isPlayer) sfx.finish();
    if (resultsShown) renderResults();
  }
}

// Finished riders by finishing time, then everyone else by distance down the hill.
function standings() {
  return [...riders].sort((a, b) =>
    a.finished !== b.finished ? (a.finished ? -1 : 1) : a.finished ? a.finishTime - b.finishTime : b.z - a.z);
}

// ---------------------------------------------------------------------------
// Bots. A bot only produces controls, exactly like the keyboard does.
// ---------------------------------------------------------------------------
function predictAirTime(r) {
  let { x, y, z, vx, vy, vz } = r, t = 0;
  const dt = 1 / 60;
  while (t < 5) {
    vy -= G_AIR * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
    if (y <= terrainH(x, z)) break;
  }
  return t;
}

function planTrick(r, b) {
  const left = predictAirTime(r);
  // Weaker bots leave a bigger margin, but sometimes try more than they have time for.
  const greedy = Math.random() < 0.3 * (1 - b.skill);
  const avail = left - (0.3 - 0.2 * b.skill) + (greedy ? 0.45 : 0);
  if (avail < 0.35) return null;
  const flipTime = (Math.PI * 2) / FLIP_RATE, halfSpin = Math.PI / SPIN_RATE;
  let flips = 0;
  if (avail > flipTime && Math.random() < 0.3 + 0.45 * b.skill) flips = avail > flipTime * 2 && Math.random() < b.skill - 0.4 ? 2 : 1;
  const maxHalves = Math.min(6, Math.floor(avail / halfSpin));
  const halves = Math.round(maxHalves * Math.random() * (0.5 + 0.5 * b.skill) + (flips ? 0 : 0.3));
  const end = r.airTime + left;
  return {
    spin: halves * Math.PI, spinDir: Math.random() < 0.5 ? 1 : -1,
    flip: flips * Math.PI * 2, flipDir: Math.random() < 0.65 ? -1 : 1,
    grab: Math.random() < 0.55, grabFrom: r.airTime + 0.1, grabTo: end - (greedy ? 0.1 : 0.3),
  };
}

function botControls(r, h) {
  const b = r.bot;
  const inp = { left: false, right: false, tuck: false, brake: false, grab: false, jump: false };
  if (!canControl(r)) return inp;
  b.t += h;

  if (!r.grounded) {
    if (!b.plan && r.airTime > 0.04) b.plan = planTrick(r, b) || { spin: 0, flip: 0, grab: false };
    const p = b.plan;
    if (!p) return inp;
    if (Math.abs(r.spin) < p.spin - SPIN_RATE * h * 0.5) inp[p.spinDir > 0 ? "left" : "right"] = true;
    if (Math.abs(r.flip) < p.flip - FLIP_RATE * h * 0.5) inp[p.flipDir > 0 ? "tuck" : "brake"] = true;
    inp.grab = p.grab && r.airTime > p.grabFrom && r.airTime < p.grabTo;
    return inp;
  }
  b.plan = null;

  // Pick the next kicker and decide how to ride it.
  let idx = kickers.findIndex((k) => k.z > r.z - 1);
  if (idx !== b.kickIdx) {
    b.kickIdx = idx;
    b.goKick = Math.random() < 0.5 + 0.45 * b.skill;
    b.kickOff = (Math.random() - 0.5) * 3;
    b.popAt = 0.3 + Math.random() * 1.6 * (1 - b.skill);
  }
  const k = kickers[idx];
  const toKick = k ? k.z - r.z : Infinity;
  const speed = Math.hypot(r.vx, r.vz);

  // Steer toward a point a little way down the run, or at the kicker.
  const look = Math.max(7, speed * 0.7);
  let tx = center(r.z + look) + 5 * Math.sin(b.t * 0.25 + b.phase);
  if (k && b.goKick && toKick < 40) tx = k.x + b.kickOff;
  const err = wrapAngle(Math.atan2(tx - r.x, look) - r.heading);
  if (err > 0.04) inp.left = true;
  else if (err < -0.04) inp.right = true;

  const vmax = 19 + 11 * b.skill;
  if (speed > vmax || (Math.abs(err) > 0.6 && speed > 12)) inp.brake = true;
  else if (Math.abs(err) < 0.25) inp.tuck = true;

  // Charge an ollie on the ramp and pop just before the lip.
  inp.jump = !!(k && b.goKick && toKick < 9 && toKick > b.popAt && Math.abs(r.x - k.x) < KICK_HALF);
  return inp;
}

function startRace(roster = soloRoster()) {
  initAudio();
  setRoster(roster);
  clearSpray();
  raceTime = 0; simAcc = 0; netAcc = 0;
  resultsShown = false; result = null;
  countT = 3; lastCount = 4;
  state = "countdown";
  panel.classList.add("hidden");
  restartBtn.style.display = net.role === "client" ? "none" : "";
  leaveTopBtn.style.display = net.role ? "" : "none";
  snapCamera();
}

// R, Restart and "Ride again": a solo race restarts at once; in a lobby only the host can restart.
function requestRestart() {
  if (!net.role) startRace();
  else if (net.role === "host") hostStart();
}

function update(dt) {
  const keysIn = readInput();
  if (state === "countdown") {
    countT -= dt;
    const c = Math.ceil(countT);
    if (c !== lastCount && c > 0) { lastCount = c; sfx.count(); countEl.textContent = c; }
    if (countT <= 0) { state = "run"; sfx.go(); countEl.textContent = "GO!"; setTimeout(() => { if (countEl.textContent === "GO!") countEl.textContent = ""; }, 700); }
  }
  if (state === "run") {
    simAcc += dt;
    while (simAcc >= STEP) {
      simAcc -= STEP;
      raceTime += STEP;
      for (const r of riders) if (!r.remote) stepRider(r, STEP, r.bot ? botControls(r, STEP) : keysIn);
    }
    for (const r of riders) if (r.remote) followNet(r, dt);
    netTick(dt);
    if (me.finished && !resultsShown && raceTime - me.finishTime > 1.6) showResults();
    for (const r of riders) {
      const speed = Math.hypot(r.vx, r.vz);
      if (!r.grounded || speed <= 3) continue;
      const rate = r.crashT > 0 ? 200 : speed * 2.5 + r.slip * 25 + (r.inp.brake && canControl(r) ? speed * 6 : 0);
      emitSpray(r, rate, dt);
    }
  }
  for (const r of riders) updateRider(r, dt);
  updateSpray(dt);
  updateCamera(dt);
  updateHUD();
  updateAudio(Math.hypot(me.vx, me.vz), me.slip);
}

// ---------------------------------------------------------------------------
// Rider pose and camera
// ---------------------------------------------------------------------------
const UP = new THREE.Vector3(0, 1, 0);
const vN = new THREE.Vector3(), qa = new THREE.Quaternion(), qy = new THREE.Quaternion();
const qf = new THREE.Quaternion(), flipAxis = new THREE.Vector3();

function updateRider(r, dt) {
  const m = r.model, inp = r.inp;
  m.root.position.set(r.x, r.y, r.z);
  if (r.grounded) {
    const [gx, gz] = grad(r.x, r.z);
    vN.set(-gx, 1, -gz).normalize();
  } else vN.copy(UP);
  qa.setFromUnitVectors(UP, vN);
  qy.setFromAxisAngle(UP, r.heading + (r.sw ? Math.PI : 0) + r.spin);
  qa.multiply(qy);
  if (r.flip !== 0) {
    // Flip about the world axis across the takeoff direction, applied on top of the spin.
    const s = Math.sin(r.flipYaw), c = Math.cos(r.flipYaw);
    flipAxis.set(c, 0, -s);
    qf.setFromAxisAngle(flipAxis, r.flip);
    qa.premultiply(qf);
    // Pivot about the rider's middle so the body doesn't swing through the snow.
    const fs = Math.sin(r.flip), fc = Math.cos(r.flip);
    m.root.position.x -= FLIP_PIVOT * fs * s;
    m.root.position.z -= FLIP_PIVOT * fs * c;
    m.root.position.y += FLIP_PIVOT * (1 - fc);
  }
  m.root.quaternion.slerp(qa, 1 - Math.exp(-(r.grounded ? 14 : 40) * dt));
  if (r.tag) r.tag.position.set(r.x, r.y + 2.5, r.z);

  const ctl = canControl(r);
  const speed = Math.hypot(r.vx, r.vz);
  const steer = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  const leanT = r.grounded && ctl ? steer * 0.38 * Math.min(1, speed / 12) * (r.sw ? -1 : 1) : 0;
  r.lean += (leanT - r.lean) * (1 - Math.exp(-8 * dt));
  let crouchT = 0.1;
  if (r.charge > 0) crouchT = 0.3 + 0.5 * r.charge;
  else if (r.grabbing) crouchT = 0.75;
  else if (!r.grounded && ctl && (inp.tuck || inp.brake)) crouchT = 0.65;
  else if (ctl && inp.tuck && r.grounded) crouchT = 0.6;
  else if (!r.grounded) crouchT = 0.3;
  r.crouch += (crouchT - r.crouch) * (1 - Math.exp(-12 * dt));

  m.pose.rotation.set(r.crashT > 0 ? r.crashSpin : 0, 0, r.lean);
  const legScale = 1 - 0.45 * r.crouch;
  m.legs.forEach((l) => (l.scale.y = legScale));
  m.upper.position.y = 0.06 + LEG_H * legScale;
  m.upper.rotation.z = -r.crouch * 0.35;
  const reach = r.grabbing ? 1.1 : 0;
  m.arms[0].rotation.set(0.35 - reach * 0.2, 0, reach);
  m.arms[1].rotation.set(-0.35 + reach * 0.2, 0, reach * 0.3);
}

let camYaw = 0;
const camTarget = new THREE.Vector3();
function updateCamera(dt, snap = false) {
  const speed = Math.hypot(me.vx, me.vz);
  const want = speed > 2 ? Math.atan2(me.vx, me.vz) : me.heading;
  camYaw = snap ? want : camYaw + wrapAngle(want - camYaw) * (1 - Math.exp(-3 * dt));
  const back = 8.5 + Math.min(speed, 35) * 0.06;
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  camTarget.set(me.x - fx * back, me.y + 4.2, me.z - fz * back);
  if (snap) camera.position.copy(camTarget);
  else camera.position.lerp(camTarget, 1 - Math.exp(-6 * dt));
  camera.position.y = Math.max(camera.position.y, terrainH(camera.position.x, camera.position.z) + 1.5);
  camera.lookAt(me.x + fx * 4, me.y + 1.2, me.z + fz * 4);
  camera.fov = 62 + Math.min(speed, 40) * 0.3;
  camera.updateProjectionMatrix();

  sun.position.set(me.x - 25, me.y + 45, me.z - 15);
  sun.target.position.set(me.x, me.y, me.z);
  mountains.position.set(camera.position.x, camera.position.y, camera.position.z);
}
const snapCamera = () => updateCamera(0, true);

// ---------------------------------------------------------------------------
// HUD and panels
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const timeEl = $("time"), speedEl = $("speed"), tricksEl = $("tricks"), posEl = $("pos"), bestEl = $("best");
const countEl = $("count"), popupEl = $("popup"), chargeEl = $("charge");
const progressEl = document.querySelector("#progress div");
const panel = $("panel"), card = $("card"), muteBtn = $("mute"), restartBtn = $("restart"), leaveTopBtn = $("leave-lobby");
const fmt = (n) => n.toLocaleString("en-US");
const ordinal = (n) => n + (n > 3 && n < 21 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

function updateHUD() {
  timeEl.textContent = (me.finished ? me.finishTime : raceTime).toFixed(2);
  speedEl.textContent = Math.round(Math.hypot(me.vx, me.vz) * 3.6);
  tricksEl.textContent = fmt(me.trickScore);
  posEl.textContent = `${standings().indexOf(me) + 1} / ${riders.length}`;
  bestEl.textContent = best ? fmt(best) : "–";
  progressEl.style.width = `${Math.min(100, Math.max(0, (me.z / COURSE_LEN) * 100))}%`;
  chargeEl.style.opacity = me.charge > 0 ? 1 : 0;
  chargeEl.firstElementChild.style.width = `${me.charge * 100}%`;
}

let popupTimer = 0;
function showPopup(text, pts, bad) {
  popupEl.innerHTML = "";
  popupEl.append(text);
  const s = document.createElement("span");
  s.className = "pts"; s.textContent = pts;
  popupEl.append(s);
  popupEl.classList.toggle("bad", bad);
  popupEl.style.opacity = 1;
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => (popupEl.style.opacity = 0), 1500);
}

const CONTROLS = `
  <table>
    <tr><td>Steer / spin in the air</td><td><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd></td></tr>

    <tr><td>Brake / skid · back flip in the air</td><td><kbd>↓</kbd> or <kbd>S</kbd></td></tr>
    <tr><td>Hold &amp; release to jump</td><td><kbd>Space</kbd></td></tr>
    <tr><td>Grab (in the air)</td><td><kbd>J</kbd>, <kbd>X</kbd> or <kbd>Shift</kbd></td></tr>
    <tr><td>Restart · Sound</td><td><kbd>R</kbd> · <kbd>M</kbd></td></tr>
  </table>`;

const inviteCode = (new URLSearchParams(location.search).get("join") || "").toUpperCase().slice(0, 5);

    <h1>POWDER RUN</h1>

    </div>`;

}

function showLobby() {
  const isHost = net.role === "host";
  const bots = lobbyBotCount();
  const list = net.players.map((p, i) => `
      <li><span><span class="dot" style="background:${LOOKS[i % PLAYER_LOOKS].tagColor}"></span>${esc(p.name)}</span>
      <span class="tag">${[i === 0 && "host", p.id === me.id && "you"].filter(Boolean).join(" · ")}</span></li>`).join("");
  const botLine = isHost
    ? `<p>Bots <button id="bots-" class="secondary small">−</button> <strong>${bots}</strong> <button id="bots+" class="secondary small">+</button></p>`
    : `<p>${bots} bot${bots === 1 ? "" : "s"} · ${net.racing ? "A race is on. You'll join the next one." : "Waiting for the host to start the race…"}</p>`;
  card.innerHTML = `

  });
  $("leave").addEventListener("click", () => leaveLobby());
  if (isHost) {
    $("start").addEventListener("click", hostStart);

  }
  panel.classList.remove("hidden");
}
// Only redraw the lobby while it's on screen, not over a race or the results.
const refreshLobby = () => { if (net.role && state === "menu") showLobby(); };

function showResults() {
  resultsShown = true;
  const bonus = Math.max(0, Math.round((PAR_TIME - me.finishTime) * 50));
  const total = me.trickScore + bonus;
  const isBest = total > best;
  if (isBest) { best = total; store.set("powderrun-best", String(best)); }
  result = { bonus, total, isBest };
  renderResults();
  panel.classList.remove("hidden");
}

// Re-rendered as other riders cross the line, so the standings fill in live.
function renderResults() {
  if (!result) return;
  const { bonus, total, isBest } = result;
  const order = standings();
  const rows = order.map((r, i) => `
      <tr${r === me ? ' class="me"' : ""}><td>${i + 1}</td><td>${esc(r.name)}</td>
      <td class="num">${r.finished ? r.finishTime.toFixed(2) + " s" : "racing…"}</td><td class="num">${fmt(r.trickScore)}</td></tr>`).join("");
  const actions = !net.role ? '<button id="go">Ride again</button><button id="leave" class="secondary">Menu</button>'
    : net.role === "host" ? '<button id="go">Race again</button><button id="leave" class="secondary">Leave lobby</button>'
    : '<button id="leave" class="secondary">Leave lobby</button>';
  card.innerHTML = `
    <h1>${ordinal(order.indexOf(me) + 1).toUpperCase()} PLACE</h1>
    <table>
      <tr><td>Time</td><td class="num">${me.finishTime.toFixed(2)} s</td></tr>
      <tr><td>Trick points</td><td class="num">${fmt(me.trickScore)}</td></tr>
      <tr><td>Time bonus</td><td class="num">${fmt(bonus)}</td></tr>
      <tr class="total"><td>Total</td><td class="num">${fmt(total)}</td></tr>
    </table>
    <table class="standings">
      <tr><th></th><th>Rider</th><th class="num">Time</th><th class="num">Tricks</th></tr>${rows}
    </table>
    <p>${isBest ? '<span class="new">New best score!</span>' : `Best: ${fmt(best)}`}</p>
    ${net.role === "client" ? "<p>Waiting for the host to start the next race…</p>" : ""}
    <div class="buttons">${actions}</div>`;
  $("go")?.addEventListener("click", requestRestart);
  $("leave")?.addEventListener("click", () => leaveLobby());
}

function toggleMute() {
  muted = !muted;
  store.set("powderrun-muted", muted ? "1" : "0");
  if (master) master.gain.value = muted ? 0 : 1;
  muteBtn.textContent = `Sound: ${muted ? "off" : "on"}`;
}
muteBtn.textContent = `Sound: ${muted ? "off" : "on"}`;
muteBtn.addEventListener("click", () => { initAudio(); toggleMute(); muteBtn.blur(); });
restartBtn.addEventListener("click", (e) => { requestRestart(); e.currentTarget.blur(); });
leaveTopBtn.addEventListener("click", () => leaveLobby());

// ---------------------------------------------------------------------------
// Multiplayer. Browsers connect directly to each other over WebRTC using
// PeerJS. PeerJS's public server is only used to find the host by lobby code.
// The host runs the bots and relays every rider's state to everyone; each
// browser runs the physics for its own rider.
// ---------------------------------------------------------------------------
const PEERJS_URL = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
const PEER_PREFIX = "powderrun-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const SEND_RATE = 15;
const net = { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], bots: BOTS.length, racing: false };
let netAcc = 0;
let myName = store.get("powderrun-name") || "";

let peerJS = null;
function loadPeerJS() {
  peerJS ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PEERJS_URL;
    s.onload = () => resolve(window.Peer);
    s.onerror = () => { peerJS = null; reject(new Error("Couldn't load the multiplayer library. Check your internet connection.")); };
    document.head.append(s);
  });
  return peerJS;
}

const makeCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const cleanName = (s) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, 16) || "Rider";
function readName() {
  myName = cleanName($("name")?.value);
  store.set("powderrun-name", myName);
}

function peerErrorText(err) {
  switch (err?.type) {
    case "peer-unavailable": return "No lobby found with that code.";
    case "browser-incompatible": return "This browser doesn't support the connections multiplayer needs.";
    case "network": case "server-error": case "socket-error": case "socket-closed":
      return "Couldn't reach the lobby server. Check your connection and try again.";
    default: return `Connection problem (${err?.type || "unknown"}).`;
  }
}

function sendAll(msg) {
  for (const c of net.conns.values()) if (c.open) c.send(msg);
}

// Called every frame during a race; sends at SEND_RATE.
function netTick(dt) {
  if (!net.role) return;
  netAcc += dt;
  if (netAcc < 1 / SEND_RATE) return;
  netAcc %= 1 / SEND_RATE;
  if (net.role === "client") { if (net.host?.open) net.host.send({ t: "me", s: packRider(me) }); }
  else sendAll({ t: "snap", s: riders.map(packRider).filter(Boolean) });
}

// --- Host ---
async function hostLobby() {
  readName();
  showStatus("Creating a lobby…");
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message); }
  const open = (attempt) => {
    const code = makeCode();
    const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
    Object.assign(net, { role: "host", peer, code, conns: new Map(), players: [], racing: false });
    peer.on("open", (id) => {
      me.id = id;
      net.players = [{ id, name: myName }];
      state = "menu";
      showLobby();
    });
    peer.on("connection", acceptPlayer);
    // Losing the lobby server only stops new players joining; reconnect so they can.
    peer.on("disconnected", () => { if (net.peer === peer && !peer.destroyed) peer.reconnect(); });
    peer.on("error", (err) => {
      if (net.peer !== peer) return;
      if (err.type === "unavailable-id" && attempt < 3) { peer.destroy(); open(attempt + 1); }
      else if (err.type !== "peer-unavailable" && !net.players.length) leaveLobby(peerErrorText(err));
    });
  };
  open(0);
}

function acceptPlayer(conn) {
  conn.on("open", () => {
    if (net.players.length >= MAX_RIDERS) { conn.send({ t: "full" }); setTimeout(() => conn.close(), 500); return; }
    net.conns.set(conn.peer, conn);
  });
  conn.on("data", (m) => onHostData(conn, m));
  conn.on("close", () => dropPlayer(conn.peer));
  conn.on("error", () => dropPlayer(conn.peer));
}

function onHostData(conn, m) {
  if (!m || typeof m !== "object" || !net.conns.has(conn.peer)) return;
  if (m.t === "hello") {
    if (net.players.some((p) => p.id === conn.peer)) return;
    net.players.push({ id: conn.peer, name: cleanName(m.name) });
    broadcastLobby();
    refreshLobby();
  } else if (m.t === "me") {
    const r = riders.find((x) => x.id === conn.peer && x.remote);
    if (r) applyNet(r, m.s);
  }
}

function dropPlayer(id) {
  if (net.role !== "host") return;
  net.conns.delete(id);
  const i = net.players.findIndex((p) => p.id === id);
  if (i < 0) return;
  net.players.splice(i, 1);
  removeRider(id);
  broadcastLobby();
  refreshLobby();
}

const lobbyBotCount = () => Math.max(0, Math.min(net.bots, BOTS.length, MAX_RIDERS - net.players.length));
function setBots(n) {
  net.bots = Math.max(0, Math.min(BOTS.length, n));
  broadcastLobby();
  showLobby();
}
function broadcastLobby() {
  sendAll({ t: "lobby", code: net.code, players: net.players, bots: lobbyBotCount(), racing: net.racing });
}

function hostStart() {
  const roster = [
    ...net.players.map((p, i) => ({ id: p.id, name: p.name, look: i % PLAYER_LOOKS })),
    ...BOTS.slice(0, lobbyBotCount()).map((b, i) => ({ id: `bot${i}`, name: b.name, look: b.look, bot: b.skill })),
  ];
  net.racing = true;
  sendAll({ t: "start", roster });
  broadcastLobby();
  startRace(roster);
}

// --- Client ---
async function joinLobby(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 5) return showMenu("Lobby codes are 5 letters and numbers.");
  readName();
  showStatus(`Joining lobby ${code}…`);
  let Peer;
  try { Peer = await loadPeerJS(); } catch (e) { return leaveLobby(e.message); }
  const peer = new Peer({ debug: 0 });
  Object.assign(net, { role: "client", peer, code, host: null, players: [], racing: false });
  const timer = setTimeout(() => {
    if (net.peer === peer && !net.host?.open) {
      leaveLobby("Couldn't connect to the lobby. The host may have left, or a network between you is blocking direct connections.");
    }
  }, 15000);
  peer.on("open", (id) => {
    me.id = id;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
    net.host = conn;
    conn.on("open", () => { clearTimeout(timer); conn.send({ t: "hello", name: myName }); });
    conn.on("data", onClientData);
    conn.on("close", () => { if (net.peer === peer) leaveLobby("The host closed the lobby."); });
  });
  peer.on("error", (err) => {
    if (net.peer !== peer) return;
    clearTimeout(timer);
    leaveLobby(peerErrorText(err));
  });
}

function onClientData(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "lobby") {
    net.players = (Array.isArray(m.players) ? m.players : []).slice(0, MAX_RIDERS)
      .map((p) => ({ id: String(p?.id), name: cleanName(p?.name) }));
    net.bots = Number.isInteger(m.bots) ? m.bots : 0;
    net.racing = !!m.racing;
    // Remove riders whose players have left.
    for (const r of [...riders]) if (r.remote && r.bot == null && !r.id.startsWith("bot") && !net.players.some((p) => p.id === r.id)) removeRider(r.id);
    refreshLobby();
  } else if (m.t === "start") {
    const roster = (Array.isArray(m.roster) ? m.roster : []).slice(0, MAX_RIDERS).map((e) => ({
      id: String(e?.id), name: cleanName(e?.name),
      look: Number.isInteger(e?.look) && e.look >= 0 && e.look < LOOKS.length ? e.look : 0,
      bot: Number.isFinite(e?.bot) ? e.bot : undefined,
    }));
    // Joined after this race was set up: wait in the lobby for the next one.
    if (roster.some((e) => e.id === me.id)) startRace(roster);
  } else if (m.t === "snap" && Array.isArray(m.s)) {
    for (const s of m.s) {
      const r = s && riders.find((x) => x.id === s.id && x.remote);
      if (r) applyNet(r, s);
    }
  } else if (m.t === "full") {
    leaveLobby("That lobby is full.");
  }
}

// Back to solo play. `message` explains why, if it wasn't the player's choice.
function leaveLobby(message = "") {
  const peer = net.peer;
  Object.assign(net, { role: null, peer: null, host: null, conns: new Map(), code: "", players: [], racing: false });
  peer?.destroy();
  me.id = "me";
  state = "menu";
  resultsShown = false; result = null;
  countEl.textContent = "";
  restartBtn.style.display = "";
  leaveTopBtn.style.display = "none";
  setRoster(soloRoster());
  snapCamera();
  showMenu(message);
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
setRoster(soloRoster());
for (const r of riders) updateRider(r, 1);
snapCamera();
showMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
