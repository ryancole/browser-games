# Publishes the games in src/ to GitHub Pages on every push to master, with
# each page minified first (npm run build, into dist/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts; don't cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy run as separate jobs, as in GitHub's Pages template. In one
# job, deploy-pages can look for the artifact before GitHub has registered it
# and fail with "No artifacts named github-pages were found".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
